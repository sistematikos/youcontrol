<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes | You Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #F4F7F9; margin: 0; padding: 20px; color: #1E293B; }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
        .grid-reportes { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card-report { 
            background: white; padding: 25px; border-radius: 20px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: center; 
            border: 1px solid #E2E8F0; transition: transform 0.3s;
        }
        .card-report:hover { transform: translateY(-5px); }
        .val { font-size: 2.2rem; font-weight: 900; color: #3B82F6; margin: 10px 0; }
        .label { color: #64748B; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        .btn-back { border: none; background: white; padding: 12px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 10px; }
        .btn-back:hover { background: #E2E8F0; }
        
        .gain { color: #10B981; }
        .sale { color: #8B5CF6; }
        .cash { color: #F59E0B; }
    </style>
</head>
<body oncontextmenu="return false">

    <div class="header">
        <button onclick="location.href='index_menu.html'" class="btn-back">
            <i class="fas fa-chevron-left"></i> VOLVER AL PANEL
        </button>
        <h2 style="margin:0;"><i class="fas fa-chart-line" style="color: #007BFF;"></i> Módulo de Reportes</h2>
    </div>

    <div class="grid-reportes">
        <div class="card-report">
            <div class="label"><i class="fas fa-warehouse"></i> Inversión Total</div>
            <div id="total-inversion" class="val">$ 0.00</div>
            <small style="color:#94a3b8">Costo total de mercancía en stock</small>
        </div>

        <div class="card-report">
            <div class="label"><i class="fas fa-arrow-trend-up"></i> Ganancia Estimada</div>
            <div id="total-ganancia" class="val gain">$ 0.00</div>
            <small style="color:#94a3b8">Retorno proyectado sobre stock</small>
        </div>

        <div class="card-report" style="border-bottom: 5px solid #8B5CF6;">
            <div class="label"><i class="fas fa-shopping-basket"></i> Ventas Totales</div>
            <div id="ventas-hoy" class="val sale">$ 0.00</div>
            <small style="color:#94a3b8">Ingreso total acumulado</small>
        </div>

        <div class="card-report" style="border-bottom: 5px solid #F59E0B;">
            <div class="label"><i class="fas fa-wallet"></i> Efectivo en Caja</div>
            <div id="caja-efectivo" class="val cash">$ 0.00</div>
            <small style="color:#94a3b8">Total recibido en divisas ($)</small>
        </div>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ID de usuario verificado
        const UID = "sUhfZI9Fy3M9UlInTYw2wFWZmB12";

        // --- 1. PROCESAR PRODUCTOS (Inventario) ---
        onSnapshot(collection(db, "usuarios", UID, "productos"), (snap) => {
            let totalInversion = 0;
            let totalGananciaPotencial = 0;

            snap.forEach(doc => {
                const p = doc.data();
                const stock = parseFloat(p.stock) || 0;
                const costo = parseFloat(p.costo) || 0;
                const precio = parseFloat(p.precio) || 0;
                
                totalInversion += (costo * stock);
                totalGananciaPotencial += ((precio - costo) * stock);
            });

            document.getElementById('total-inversion').innerText = "$ " + totalInversion.toFixed(2);
            document.getElementById('total-ganancia').innerText = "$ " + totalGananciaPotencial.toFixed(2);
        });

        // --- 2. PROCESAR VENTAS (Historial Real) ---
        onSnapshot(collection(db, "usuarios", UID, "ventas"), (snap) => {
            let acumuladoVentasUSD = 0;
            let acumuladoCajaDivisas = 0;

            snap.forEach(doc => {
                const v = doc.data();
                acumuladoVentasUSD += parseFloat(v.total_usd) || 0;
                
                // Sumamos el efectivo ingresado en el campo divisas del POS
                if (v.pagos && v.pagos.divisas) {
                    acumuladoCajaDivisas += parseFloat(v.pagos.divisas);
                }
            });

            document.getElementById('ventas-hoy').innerText = "$ " + acumuladoVentasUSD.toFixed(2);
            document.getElementById('caja-efectivo').innerText = "$ " + acumuladoCajaDivisas.toFixed(2);
        });
    </script>
</body>
</html>
