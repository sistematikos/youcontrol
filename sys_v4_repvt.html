<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ventas - YouControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --text-muted: #6b7280;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .kpi-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f9fafb;
            font-weight: 600;
        }
        .fila-factura {
            cursor: pointer;
            transition: background 0.2s;
        }
        .fila-factura:hover, .fila-factura.seleccionada {
            background-color: #eff6ff;
        }
        .lista-productos {
            margin: 0;
            padding-left: 15px;
            font-size: 13px;
            color: #4b5563;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="text-2xl font-bold mb-6">Reporte y Control de Ventas</h1>

        <!-- Filtros y KPIs -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 items-end">
            <div>
                <label class="block text-sm font-medium mb-1">Desde:</label>
                <input type="date" id="filtro-desde" class="w-full border rounded p-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Hasta:</label>
                <input type="date" id="filtro-hasta" class="w-full border rounded p-2">
            </div>
            <div>
                <button id="btn-buscar" class="btn btn-primary w-full">Buscar Ventas</button>
            </div>
            <div>
                <button id="btn-anular-seleccionada" class="btn btn-danger w-full">Anular Seleccionada</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="kpi-card">
                <p class="text-sm text-gray-500">Total Vendido</p>
                <p id="kpi-total-usd" class="text-2xl font-bold text-blue-600">$ 0.00</p>
            </div>
            <div class="kpi-card">
                <p class="text-sm text-gray-500">Cantidad de Facturas</p>
                <p id="kpi-total-facturas" class="text-2xl font-bold text-gray-700">0</p>
            </div>
        </div>

        <!-- Tabla de Resultados -->
        <div class="overflow-x-auto">
            <table>
                <thead>
                    <tr>
                        <th class="w-10 text-center">Sel</th>
                        <th>Fecha / Hora</th>
                        <th>Nro Factura</th>
                        <th>Cliente</th>
                        <th>Productos</th>
                        <th class="text-right">Total</th>
                    </tr>
                </thead>
                <tbody id="tabla-reporte-ventas">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 20px;">
                            Seleccione un rango y presione buscar.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script de Firebase y Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, runTransaction } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "youcontrol-1d60a.firebaseapp.com",
            projectId: "youcontrol-1d60a",
            storageBucket: "youcontrol-1d60a.appspot.com",
            messagingSenderId: "812100760013",
            appId: "1:812100760013:web:7574906aa285555faf5484"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let facturaSeleccionadaId = null;
        let facturaSeleccionadaData = null;

        document.getElementById('btn-buscar').addEventListener('click', cargarReporteVentas);

        async function cargarReporteVentas() {
            const tbody = document.getElementById('tabla-reporte-ventas');
            const empresaId = localStorage.getItem('youcontrol_empresa_id');

            if (!empresaId) {
                alert("No se encontró la empresa activa en el sistema.");
                return;
            }

            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px;">Buscando documentos...</td></tr>`;

            try {
                const ventasRef = collection(db, "usuarios", empresaId, "ventas");
                const querySnapshot = await getDocs(ventasRef);

                let totalUSD = 0;
                let cantidadFacturas = 0;
                tbody.innerHTML = "";

                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 20px;">No se encontraron registros de ventas.</td></tr>`;
                    document.getElementById('kpi-total-usd').innerText = "$ 0.00";
                    document.getElementById('kpi-total-facturas').innerText = "0";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const v = docSnap.data();
                    const id = docSnap.id;

                    cantidadFacturas++;
                    
                    // CORREGIDO: Apuntando al campo exacto `total_usd` visto en Firestore
                    const montoVenta = Number(v.total_usd || v.total || v.total_general || v.monto || 0);
                    totalUSD += montoVenta;

                    // Formateo de fecha
                    let fechaStr = "N/A";
                    if (v.fecha && typeof v.fecha.toDate === 'function') {
                        fechaStr = v.fecha.toDate().toLocaleString();
                    } else if (v.fecha) {
                        fechaStr = v.fecha;
                    }

                    // Formatear productos
                    let productosHTML = `<ul class="lista-productos">`;
                    const listaProds = v.productos || v.items || v.cart || [];
                    if (Array.isArray(listaProds) && listaProds.length > 0) {
                        listaProds.forEach(p => {
                            const nombreP = p.nombre || p.descripcion || p.titulo || 'Producto';
                            const cantP = p.cantidad || p.qty || 1;
                            const precioP = Number(p.precio || p.price || 0);
                            productosHTML += `<li>${nombreP} (${cantP} x $${precioP.toFixed(2)})</li>`;
                        });
                    } else {
                        productosHTML += `<li>Venta registrada / Sin detalle interno</li>`;
                    }
                    productosHTML += `</ul>`;

                    const tr = document.createElement('tr');
                    tr.className = "fila-factura";
                    tr.innerHTML = `
                        <td class="text-center"><input type="radio" name="select_factura" class="radio-factura" data-id="${id}"></td>
                        <td>${fechaStr}</td>
                        <td><strong>${v.nro_factura || v.nroFactura || id.slice(0,6)}</strong></td>
                        <td>${v.nombre_cliente || v.cliente || 'CLIENTE CONTADO'}</td>
                        <td>${productosHTML}</td>
                        <td class="text-right"><strong>$${montoVenta.toFixed(2)}</strong></td>
                    `;

                    tr.addEventListener('click', () => {
                        document.querySelectorAll('.fila-factura').forEach(f => f.classList.remove('seleccionada'));
                        document.querySelectorAll('.radio-factura').forEach(r => r.checked = false);

                        tr.classList.add('seleccionada');
                        const radio = tr.querySelector('.radio-factura');
                        radio.checked = true;
                        
                        facturaSeleccionadaId = id;
                        facturaSeleccionadaData = v;
                    });

                    tbody.appendChild(tr);
                });

                document.getElementById('kpi-total-usd').innerText = `$ ${totalUSD.toFixed(2)}`;
                document.getElementById('kpi-total-facturas').innerText = cantidadFacturas;

            } catch (error) {
                console.error("Error cargando ventas: ", error);
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--danger); padding: 20px;">Error al conectar con la base de datos.</td></tr>`;
            }
        }

        document.getElementById('btn-anular-seleccionada').addEventListener('click', async () => {
            if (!facturaSeleccionadaId || !facturaSeleccionadaData) {
                alert("Por favor selecciona una factura de la tabla para anular.");
                return;
            }

            if (!confirm(`¿Estás seguro de anular la factura ${facturaSeleccionadaData.nro_factura || facturaSeleccionadaId}? Esta acción devolverá los productos al inventario.`)) {
                return;
            }

            const empresaId = localStorage.getItem('youcontrol_empresa_id');

            try {
                await runTransaction(db, async (transaction) => {
                    const listaProds = facturaSeleccionadaData.productos || facturaSeleccionadaData.items || [];
                    if (Array.isArray(listaProds)) {
                        for (let prod of listaProds) {
                            const prodId = prod.id || prod.codigo || prod.sku;
                            if (prodId) {
                                const prodRef = doc(db, "usuarios", empresaId, "inventario", prodId);
                                const prodDoc = await transaction.get(prodRef);
                                
                                if (prodDoc.exists()) {
                                    const stockActual = Number(prodDoc.data().stock || prodDoc.data().existencia || 0);
                                    const cantidadDevolver = Number(prod.cantidad || prod.qty || 1);
                                    const nuevoStock = stockActual + cantidadDevolver;
                                    
                                    transaction.update(prodRef, { 
                                        stock: nuevoStock,
                                        existencia: nuevoStock 
                                    });
                                }
                            }
                        }
                    }

                    const ventaRef = doc(db, "usuarios", empresaId, "ventas", facturaSeleccionadaId);
                    transaction.delete(ventaRef);
                });

                alert("Factura anulada con éxito y productos retornados al inventario.");
                facturaSeleccionadaId = null;
                facturaSeleccionadaData = null;
                cargarReporteVentas();

            } catch (error) {
                console.error("Error al anular la factura: ", error);
                alert("Hubo un error al procesar la anulación en la base de datos.");
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('filtro-desde').value = hoy;
            document.getElementById('filtro-hasta').value = hoy;
            cargarReporteVentas();
        });
    </script>
</body>
</html>
