<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ventas - YouControl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --danger: #dc2626;
            --text-muted: #6b7280;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .header-panel { 
            background: #ffffff; 
            padding: 0 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            border: 1px solid #E2E8F0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            height: 70px; 
        }
        .btn-back { 
            background: #F1F5F9; 
            color: #1E293B; 
            padding: 8px 15px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-size: 0.8rem; 
            font-weight: 700; 
            border: 1px solid #E2E8F0; 
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .logo-header { 
            height: 90%; 
            width: auto; 
            object-fit: contain; 
        }
        .kpi-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f9fafb;
            font-weight: 600;
        }
        .fila-factura {
            cursor: pointer;
            transition: background 0.2s;
        }
        .fila-factura:hover, .fila-factura.seleccionada {
            background-color: #eff6ff;
        }
        .fila-anulada {
            background-color: #fef2f2 !important;
            color: #991b1b;
        }
        .fila-anulada:hover {
            background-color: #fee2e2 !important;
        }
        .lista-productos {
            margin: 0;
            padding-left: 15px;
            font-size: 13px;
            color: #4b5563;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabecera estándar -->
        <header class="header-panel">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="sys_v1_menu.html" class="btn-back" onclick="event.preventDefault(); window.location.href='sys_v1_menu.html?v=' + Date.now();">
                    <i class="fas fa-arrow-left"></i> VOLVER
                </a>
                <h1 style="font-size: 1.2rem; margin: 0; font-weight: 700; color: #1E293B;">
                    Reporte y Control de Ventas
                </h1>
            </div>
            <img src="img/logo.png" class="logo-header" alt="Logo">
        </header>

        <!-- Filtros y KPIs -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 items-end">
            <div>
                <label class="block text-sm font-medium mb-1">Desde:</label>
                <input type="date" id="filtro-desde" class="w-full border rounded p-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Hasta:</label>
                <input type="date" id="filtro-hasta" class="w-full border rounded p-2">
            </div>
            <div>
                <button id="btn-buscar" class="btn btn-primary w-full">Buscar Ventas</button>
            </div>
            <div>
                <button id="btn-anular-seleccionada" class="btn btn-danger w-full">Anular Seleccionada</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="kpi-card">
                <p class="text-sm text-gray-500">Total Vendido</p>
                <p id="kpi-total-usd" class="text-2xl font-bold text-blue-600">$ 0.00</p>
            </div>
            <div class="kpi-card">
                <p class="text-sm text-gray-500">Cantidad de Facturas</p>
                <p id="kpi-total-facturas" class="text-2xl font-bold text-gray-700">0</p>
            </div>
        </div>

        <!-- Tabla de Resultados -->
        <div class="overflow-x-auto">
            <table>
                <thead>
                    <tr>
                        <th class="w-10 text-center">Sel</th>
                        <th>Fecha / Hora</th>
                        <th>Nro Factura</th>
                        <th>Cliente</th>
                        <th>Productos</th>
                        <th class="text-right">Total</th>
                    </tr>
                </thead>
                <tbody id="tabla-reporte-ventas">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 20px;">
                            Seleccione un rango y presione buscar.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script de Firebase y Lógica Completa -->
    <script type="module">
        // RUTA CORREGIDA: Apuntando a la carpeta js/
        import { db } from './js/firebase-config.js';
        import { collection, getDocs, doc, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const USER_ID = localStorage.getItem('youcontrol_empresa_id');

        let facturaSeleccionadaId = null;
        let facturaSeleccionadaData = null;

        // Función para obtener la fecha local correcta en Venezuela (YYYY-MM-DD)
        function obtenerFechaLocalVenezuela() {
            const d = new Date();
            const localTime = d.getTime() - (4 * 60 * 60 * 1000);
            const localDate = new Date(localTime);
            return localDate.toISOString().split('T')[0];
        }

        window.cargarReporteVentas = async () => {
            const tbody = document.getElementById('tabla-reporte-ventas');

            if (!USER_ID) {
                alert("No se encontró la empresa activa en el sistema.");
                return;
            }

            const inputDesde = document.getElementById('filtro-desde');
            const inputHasta = document.getElementById('filtro-hasta');
            
            const desde = inputDesde ? inputDesde.value : "";
            let hasta = inputHasta ? inputHasta.value : desde;

            if (!desde) {
                alert("Por favor selecciona una fecha inicial.");
                return;
            }

            if (tbody) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px;">Buscando documentos...</td></tr>`;
            }

            try {
                const ventasRef = collection(db, "usuarios", USER_ID, "ventas");
                const querySnapshot = await getDocs(ventasRef);

                let totalUSD = 0;
                let cantidadFacturas = 0;
                if (tbody) tbody.innerHTML = "";

                let ventasArray = [];

                querySnapshot.forEach((docSnap) => {
                    const v = docSnap.data();
                    const id = docSnap.id;

                    // Detección flexible de fecha (Timestamp, Date, o String)
                    let fechaRaw = v.fecha || v.fecha_venta || v.createdAt || v.timestamp || null;
                    let d = null;

                    if (fechaRaw && typeof fechaRaw.toDate === 'function') {
                        d = fechaRaw.toDate();
                    } else if (fechaRaw instanceof Date) {
                        d = fechaRaw;
                    } else if (typeof fechaRaw === 'string') {
                        d = new Date(fechaRaw);
                    }

                    if (d && !isNaN(d.getTime())) {
                        // Ajuste zona horaria Venezuela (UTC-4) para extraer YYYY-MM-DD exacto
                        const localTimeDoc = d.getTime() - (4 * 60 * 60 * 1000);
                        const dLocal = new Date(localTimeDoc);
                        const yyyy = dLocal.getUTCFullYear();
                        const mm = String(dLocal.getUTCMonth() + 1).padStart(2, '0');
                        const dd = String(dLocal.getUTCDate()).padStart(2, '0');
                        const fechaDocStr = `${yyyy}-${mm}-${dd}`;

                        // Filtrado estricto por rango seleccionado en pantalla
                        if (fechaDocStr >= desde && fechaDocStr <= hasta) {
                            ventasArray.push({
                                id: id,
                                data: v,
                                fechaDate: d,
                                fechaStr: d.toLocaleString()
                            });
                        }
                    }
                });

                // Ordenar de más reciente a más antiguo
                ventasArray.sort((a, b) => b.fechaDate - a.fechaDate);

                if (ventasArray.length === 0) {
                    if (tbody) {
                        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 20px;">No se encontraron registros de ventas en este rango.</td></tr>`;
                    }
                    if (document.getElementById('kpi-total-usd')) document.getElementById('kpi-total-usd').innerText = "$ 0.00";
                    if (document.getElementById('kpi-total-facturas')) document.getElementById('kpi-total-facturas').innerText = "0";
                    return;
                }

                ventasArray.forEach((item) => {
                    const v = item.data;
                    const id = item.id;
                    const fechaStr = item.fechaStr;

                    cantidadFacturas++;

                    // Detección inteligente del número de factura (para estructuras viejas y nuevas con ID automático)
                    const nroFacturaStr = v.nro_factura || v.nroFactura || v.correlativo || id;
                    const tr = document.createElement('tr');
                    tr.className = "fila-factura";

                    if (v.anulada === true) {
                        tr.classList.add('fila-anulada');
                        tr.innerHTML = `
                            <td class="text-center"><input type="radio" name="select_factura" class="radio-factura" data-id="${id}" disabled></td>
                            <td>${fechaStr}</td>
                            <td><strong>${nroFacturaStr}</strong></td>
                            <td colspan="3" class="text-center font-bold text-red-600">*** FACTURA ANULADA ***</td>
                        `;
                    } else {
                        const montoVenta = Number(v.total_usd || v.monto_total_usd || v.total || v.total_general || v.monto || 0);
                        totalUSD += montoVenta;

                        let productosHTML = `<ul class="lista-productos">`;
                        const listaProds = v.items || v.productos || v.cart || [];
                        if (Array.isArray(listaProds) && listaProds.length > 0) {
                            listaProds.forEach(p => {
                                const nombreP = p.nombre || p.nombre_producto || p.descripcion || 'Producto';
                                const cantP = p.cantidad || p.qty || 1;
                                const precioP = Number(p.precio || p.precio_usd || p.price || 0);
                                productosHTML += `<li>${nombreP} (${cantP} x $${precioP.toFixed(2)})</li>`;
                            });
                        } else {
                            productosHTML += `<li>Venta registrada / Sin detalle interno</li>`;
                        }
                        productosHTML += `</ul>`;

                        tr.innerHTML = `
                            <td class="text-center"><input type="radio" name="select_factura" class="radio-factura" data-id="${id}"></td>
                            <td>${fechaStr}</td>
                            <td><strong>${nroFacturaStr}</strong></td>
                            <td>${v.nombre_cliente || v.cliente || 'CLIENTE CONTADO'}</td>
                            <td>${productosHTML}</td>
                            <td class="text-right"><strong>$${montoVenta.toFixed(2)}</strong></td>
                        `;

                        tr.addEventListener('click', () => {
                            document.querySelectorAll('.fila-factura').forEach(f => f.classList.remove('seleccionada'));
                            document.querySelectorAll('.radio-factura').forEach(r => r.checked = false);

                            tr.classList.add('seleccionada');
                            const radio = tr.querySelector('.radio-factura');
                            if (radio) radio.checked = true;
                            
                            facturaSeleccionadaId = id;
                            facturaSeleccionadaData = v;
                        });
                    }

                    if (tbody) tbody.appendChild(tr);
                });

                if (document.getElementById('kpi-total-usd')) {
                    document.getElementById('kpi-total-usd').innerText = `$ ${totalUSD.toFixed(2)}`;
                }
                if (document.getElementById('kpi-total-facturas')) {
                    document.getElementById('kpi-total-facturas').innerText = cantidadFacturas;
                }

            } catch (error) {
                console.error("Error cargando ventas: ", error);
                if (tbody) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--danger); padding: 20px;">Error al conectar con la base de datos.</td></tr>`;
                }
            }
        };

        // Evento de anulación compatible con "productos" o "inventario"
        const btnAnular = document.getElementById('btn-anular-seleccionada');
        if (btnAnular) {
            btnAnular.addEventListener('click', async () => {
                if (!facturaSeleccionadaId || !facturaSeleccionadaData) {
                    alert("Por favor selecciona una factura de la tabla para anular.");
                    return;
                }

                const nroFactura = facturaSeleccionadaData.nro_factura || facturaSeleccionadaData.nroFactura || facturaSeleccionadaId;

                if (!confirm(`¿Estás seguro de anular la factura ${nroFactura}? Esta acción devolverá los productos al inventario y marcará la factura como anulada.`)) {
                    return;
                }

                try {
                    await runTransaction(db, async (transaction) => {
                        const listaProds = facturaSeleccionadaData.items || facturaSeleccionadaData.productos || [];
                        if (Array.isArray(listaProds)) {
                            for (let prod of listaProds) {
                                const prodId = prod.id || prod.codigo || prod.sku;
                                if (prodId) {
                                    // Intenta buscar en "productos" (nuevo) y si no existe en "inventario" (viejo)
                                    let prodRef = doc(db, "usuarios", USER_ID, "productos", prodId);
                                    let prodDoc = await transaction.get(prodRef);

                                    if (!prodDoc.exists()) {
                                        prodRef = doc(db, "usuarios", USER_ID, "inventario", prodId);
                                        prodDoc = await transaction.get(prodRef);
                                    }

                                    if (prodDoc.exists()) {
                                        const stockActual = Number(prodDoc.data().stock || prodDoc.data().existencia || 0);
                                        const cantidadDevolver = Number(prod.cantidad || prod.qty || 1);
                                        const nuevoStock = stockActual + cantidadDevolver;
                                        
                                        transaction.update(prodRef, { 
                                            stock: nuevoStock,
                                            existencia: nuevoStock 
                                        });
                                    }
                                }
                            }
                        }

                        const ventaRef = doc(db, "usuarios", USER_ID, "ventas", facturaSeleccionadaId);
                        transaction.update(ventaRef, {
                            anulada: true,
                            total_usd: 0,
                            monto_total_usd: 0,
                            total: 0,
                            items: [],
                            productos: []
                        });
                    });

                    alert("Factura anulada con éxito, productos retornados al inventario y registro conservado.");
                    facturaSeleccionadaId = null;
                    facturaSeleccionadaData = null;
                    window.cargarReporteVentas();

                } catch (error) {
                    console.error("Error al anular la factura: ", error);
                    alert("Hubo un error al procesar la anulación en la base de datos.");
                }
            });
        }

        // Inicialización al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            const hoy = obtenerFechaLocalVenezuela();
            const inputDesde = document.getElementById('filtro-desde');
            const inputHasta = document.getElementById('filtro-hasta');
            
            if (inputDesde && !inputDesde.value) inputDesde.value = hoy;
            if (inputHasta && !inputHasta.value) inputHasta.value = hoy;

            const btnBuscar = document.getElementById('btn-buscar');
            if (btnBuscar) {
                btnBuscar.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.cargarReporteVentas();
                });
            }

            window.cargarReporteVentas();
        });
    </script>
</body>
</html>
