<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ventas | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #F8FAFC; 
            --primary: #3B82F6; 
            --text: #1E293B; 
            --border: #E2E8F0; 
            --emerald: #10B981; 
            --indigo: #6366F1; 
            --slate-dark: #0F172A;
            --text-muted: #64748B;
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding-bottom: 50px; 
            color: var(--text); 
        }
        .container { 
            padding: 15px; 
            max-width: 1300px; 
            margin: auto; 
        }
        .btn-back { 
            border: none; 
            background: none; 
            color: var(--primary); 
            cursor: pointer; 
            font-weight: bold; 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            font-size: 0.9rem; 
        }
        .header-table { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
        }

        /* Barra de Filtros */
        .filter-card {
            background: white;
            padding: 18px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            align-items: flex-end;
            gap: 15px;
            flex-wrap: wrap;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }
        .form-group input[type="date"] {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'Poppins';
            font-size: 0.95rem;
            background: #F8FAFC;
            color: var(--text);
            outline: none;
        }
        .form-group input[type="date"]:focus {
            border-color: var(--primary);
            background: white;
        }
        .btn-filter {
            background: var(--primary);
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }
        .btn-filter:hover { background: #2563EB; }

        /* Tarjetas de KPI */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .kpi-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .kpi-data h3 { margin: 0; font-size: 1.7rem; font-weight: 800; color: var(--slate-dark); }
        .kpi-data span { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        .kpi-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        .icon-blue { background: #EFF6FF; color: var(--primary); }
        .icon-emerald { background: #ECFDF5; color: var(--emerald); }
        .icon-indigo { background: #EEF2F6; color: var(--indigo); }

        /* Contenedor del Reporte */
        .report-container {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .table-report {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .table-report th {
            background: #F1F5F9;
            color: #475569;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 12px 10px;
            text-align: left;
            border-bottom: 2px solid var(--border);
        }
        .table-report td {
            padding: 12px 10px;
            border-bottom: 1px solid #F1F5F9;
            color: var(--text);
            vertical-align: middle;
        }
        .table-report tr:last-child td { border: none; }

        /* Status Bar */
        #status-bar-report { 
            width: 100%; 
            padding: 10px; 
            border-radius: 10px; 
            font-size: 14px; 
            font-weight: 600; 
            text-align: center; 
            margin-bottom: 15px; 
            display: none; 
        }
        .status-loading { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .status-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    </style>
</head>
<body oncontextmenu="return false">
    <div class="container">
        <button class="btn-back" onclick="location.href='sys_v1_menu.html'">
            <i class="fas fa-arrow-left"></i> VOLVER AL MENÚ
        </button>

        <div class="header-table">
            <h3><i class="fas fa-chart-line" style="color: var(--primary);"></i> REPORTES DE VENTAS</h3>
        </div>

        <div id="status-bar-report"></div>

        <div class="filter-card">
            <div class="form-group">
                <label>Desde Fecha</label>
                <input type="date" id="filtro-desde">
            </div>
            <div class="form-group">
                <label>Hasta Fecha</label>
                <input type="date" id="filtro-hasta">
            </div>
            <button class="btn-filter" id="btnConsultar" onclick="window.cargarReporteVentas()">
                <i class="fas fa-magnifying-glass"></i> GENERAR REPORTE
            </button>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-data">
                    <h3 id="kpi-total-ventas">$ 0.00</h3>
                    <span>Total Facturado</span>
                </div>
                <div class="kpi-icon icon-blue"><i class="fas fa-money-bill-wave"></i></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-data">
                    <h3 id="kpi-margen-estimado">$ 0.00</h3>
                    <span>Ganancia Estimada</span>
                </div>
                <div class="kpi-icon icon-emerald"><i class="fas fa-hand-holding-dollar"></i></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-data">
                    <h3 id="kpi-total-articulos">0</h3>
                    <span>Artículos Vendidos</span>
                </div>
                <div class="kpi-icon icon-indigo"><i class="fas fa-boxes-stacked"></i></div>
            </div>
        </div>

        <div class="report-container">
            <table class="table-report">
                <thead>
                    <tr>
                        <th>ID Venta / Fecha</th>
                        <th>Cliente / Tipo</th>
                        <th style="text-align: center;">Artículos</th>
                        <th style="text-align: right;">Costo Total</th>
                        <th style="text-align: right;">Total Venta ($)</th>
                    </tr>
                </thead>
                <tbody id="tabla-reporte-ventas">
                    <tr>
                        <td colspan="5" style="text-align:center; color:var(--text-muted); padding:30px;">
                            Selecciona un rango de fechas para procesar el histórico.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="./js/sys_v4_repvt.js"></script>
</body>
</html>
