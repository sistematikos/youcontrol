<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Ventas | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            /* Degradado Zafiro a Turquesa */
            --bg-gradient: linear-gradient(135deg, #0f4c75 0%, #3282b8 50%, #00d2ff 100%);
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-gradient); 
            min-height: 100vh;
            margin: 0; padding: 20px; 
        }
        .container { max-width: 1200px; margin: auto; }

        /* Estilo para el Logo Eléctrico */
        .logo-header { 
            height: 120px; 
            width: auto;
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.8)) brightness(1.2) contrast(1.1);
        }

        .main-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Ajustes de botones y tablas */
        .btn-filter { background: #0f4c75; color: white; padding: 12px 25px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
        input { padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #eef2f3; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">
            <div class="header-row">
                <div>
                    <h2>Historial de Ventas Pro</h2>
                    <p>Consulta el desempeño histórico de tus transacciones</p>
                </div>
                <img src="img/logo.png" alt="Logo" class="logo-header">
            </div>

            <div class="filter-section">
                <input type="date" id="filtro-desde">
                <input type="date" id="filtro-hasta">
                <button class="btn-filter" onclick="window.cargarReporteVentas()">
                    <i class="fas fa-magnifying-glass"></i> GENERAR REPORTE
                </button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Factura / Fecha</th>
                        <th>Cliente</th>
                        <th>Detalle</th>
                        <th>Total ($)</th>
                    </tr>
                </thead>
                <tbody id="tabla-reporte-ventas">
                    <tr><td colspan="4" style="text-align:center;">Selecciona fechas para cargar datos.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script type="module" src="./js/sys_v4_repvt.js"></script>
</body>
</html>
