<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ventas | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #F1F5F9; 
            --primary: #1D4ED8;
            --text: #0F172A;
            --border: #CBD5E1;
            --text-muted: #475569;
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        .container { max-width: 1200px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        /* Encabezado con Logo */
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo-header { height: 70px; width: auto; }
        
        .btn-back { border: none; background: #E2E8F0; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 20px; }
        .btn-back:hover { background: #CBD5E1; }
        
        /* Filtros y Tabla */
        .filter-section { display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-end; }
        input { padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
        button#btnConsultar { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #F8FAFC; text-align: left; padding: 12px; border-bottom: 2px solid var(--border); }
        td { padding: 12px; border-bottom: 1px solid #F1F5F9; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-back" onclick="location.href='sys_v1_menu.html'">
            <i class="fas fa-arrow-left"></i> VOLVER AL MENÚ
        </button>

        <div class="header-section">
            <div>
                <h3>Historial de Ventas</h3>
            </div>
            <img src="img/logo.png" alt="Logo" class="logo-header">
        </div>

        <div class="filter-section">
            <div>
                <label>Desde:</label><br>
                <input type="date" id="filtro-desde">
            </div>
            <div>
                <label>Hasta:</label><br>
                <input type="date" id="filtro-hasta">
            </div>
            <button id="btnConsultar" onclick="window.cargarReporteVentas()">Generar Reporte</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Factura / Fecha</th>
                    <th>Cliente</th>
                    <th>Detalle</th>
                    <th>Total ($)</th>
                </tr>
            </thead>
            <tbody id="tabla-reporte-ventas">
                <tr><td colspan="4" style="text-align:center;">Selecciona fechas para ver el reporte.</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module" src="./js/sys_v4_repvt.js"></script>
</body>
</html>
