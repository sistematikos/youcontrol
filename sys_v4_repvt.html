<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ventas | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #F1F5F9; 
            --primary: #1D4ED8; /* Azul corporativo más intenso y persuasivo */
            --primary-hover: #1E40AF;
            --text: #0F172A; /* Slate oscuro para máxima legibilidad */
            --border: #CBD5E1; 
            --emerald: #059669; /* Verde esmeralda profundo para finanzas */
            --indigo: #4F46E5; 
            --slate-dark: #1E293B;
            --text-muted: #475569;
            --card-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.05), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding-bottom: 60px; 
            color: var(--text); 
            letter-spacing: -0.01em;
        }
        .container { 
            padding: 24px 15px; 
            max-width: 1340px; 
            margin: auto; 
        }
        .btn-back { 
            border: none; 
            background: none; 
            color: var(--text-muted); 
            cursor: pointer; 
            font-weight: 600; 
            margin-bottom: 20px; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            font-size: 0.85rem; 
            transition: color 0.2s;
        }
        .btn-back:hover { 
            color: var(--primary); 
        }
        .header-table h3 { 
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text);
            margin: 0 0 25px 0;
            letter-spacing: -0.02em;
        }

        /* Barra de Filtros Ejecutiva */
        .filter-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            margin-bottom: 24px;
            display: flex;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .form-group input[type="date"] {
            padding: 12px 14px;
            border: 1.5px solid #E2E8F0;
            border-radius: 12px;
            font-family: 'Poppins';
            font-size: 0.95rem;
            background: #F8FAFC;
            color: var(--text);
            outline: none;
            transition: all 0.2s;
            font-weight: 500;
        }
        .form-group input[type="date"]:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .btn-filter {
            background: var(--primary);
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(29, 78, 216, 0.2);
        }
        .btn-filter:hover { 
            background: var(--primary-hover); 
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(29, 78, 216, 0.3);
        }
        .btn-filter:active {
            transform: translateY(0);
        }

        /* Tarjetas de KPI Premium */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 24px;
            margin-bottom: 28px;
        }
        .kpi-card {
            background: white;
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }
        .kpi-card.kpi-total::before { background: var(--primary); }
        .kpi-card.kpi-ganancia::before { background: var(--emerald); }
        .kpi-card.kpi-items::before { background: var(--indigo); }

        .kpi-data h3 { 
            margin: 0; 
            font-size: 2rem; 
            font-weight: 800; 
            color: var(--text); 
            letter-spacing: -0.03em;
        }
        .kpi-data span { 
            font-size: 0.8rem; 
            font-weight: 700; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.05em;
            display: block;
            margin-top: 4px;
        }
        .kpi-icon {
            width: 54px;
            height: 54px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .icon-blue { background: #EFF6FF; color: var(--primary); }
        .icon-emerald { background: #ECFDF5; color: var(--emerald); }
        .icon-indigo { background: #EEF2F6; color: var(--indigo); }

        /* Tabla de Reporte Corporativa */
        .report-container {
            background: white;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--card-shadow);
        }
        .table-report {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .table-report th {
            background: #F8FAFC;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 16px 12px;
            text-align: left;
            border-bottom: 2px solid #E2E8F0;
            letter-spacing: 0.05em;
        }
        .table-report td {
            padding: 16px 12px;
            border-bottom: 1px solid #F1F5F9;
            color: var(--text);
            vertical-align: middle;
        }
        .table-report tr:hover td {
            background-color: #F8FAFC;
        }
        .table-report tr:last-child td { border: none; }

        /* Barra de Estados */
        #status-bar-report { 
            width: 100%; 
            padding: 12px; 
            border-radius: 12px; 
            font-size: 0.9rem; 
            font-weight: 700; 
            text-align: center; 
            margin-bottom: 20px; 
            display: none; 
            box-sizing: border-box;
        }
        .status-loading { background: #EFF6FF; color: var(--primary); border: 1.5px solid #BFDBFE; }
        .status-success { background: #ECFDF5; color: var(--emerald); border: 1.5px solid #A7F3D0; }
    </style>
</head>
<body oncontextmenu="return false">
    <div class="container">
        <button class="btn-back" onclick="location.href='sys_v1_menu.html'">
            <i class="fas fa-arrow-left"></i> VOLVER AL MENÚ
        </button>

        <div class="header-table">
            <h3><i class="fas fa-chart-line" style="color: var(--primary); margin-right: 8px;"></i> Reporte de Ventas</h3>
        </div>

        <div id="status-bar-report"></div>

        <div class="filter-card">
            <div class="form-group">
                <label>Desde Fecha</label>
                <input type="date" id="filtro-desde">
            </div>
            <div class="form-group">
                <label>Hasta Fecha</label>
                <input type="date" id="filtro-hasta">
            </div>
            <button class="btn-filter" id="btnConsultar" onclick="window.cargarReporteVentas()">
                <i class="fas fa-magnifying-glass"></i> GENERAR REPORTE
            </button>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card kpi-total">
                <div class="kpi-data">
                    <h3 id="kpi-total-ventas">$ 0.00</h3>
                    <span>Total Facturado</span>
                </div>
                <div class="kpi-icon icon-blue"><i class="fas fa-money-bill-wave"></i></div>
            </div>
            <div class="kpi-card kpi-ganancia">
                <div class="kpi-data">
                    <h3 id="kpi-margen-estimado">$ 0.00</h3>
                    <span>Ganancia Estimada</span>
                </div>
                <div class="kpi-icon icon-emerald"><i class="fas fa-hand-holding-dollar"></i></div>
            </div>
            <div class="kpi-card kpi-items">
                <div class="kpi-data">
                    <h3 id="kpi-total-articulos">0</h3>
                    <span>Artículos Vendidos</span>
                </div>
                <div class="kpi-icon icon-indigo"><i class="fas fa-boxes-stacked"></i></div>
            </div>
        </div>

        <div class="report-container">
            <table class="table-report">
                <thead>
                   <tr>
                      <th style="width: 18%;">Nro. Factura / Fecha</th>
                      <th style="width: 22%;">Cliente / Tipo</th>
                      <th style="text-align: left; padding-left: 10px; width: 48%;">Artículos y Precios de Venta</th>
                      <th style="text-align: right; padding-right: 15px; width: 12%;">Total Venta ($)</th>
                   </tr>
                 </head>
                                
                <tbody id="tabla-reporte-ventas">
                    <tr>
                        <td colspan="4" style="text-align:center; color:var(--text-muted); padding:40px; font-weight: 500;">
                            Selecciona un rango de fechas para procesar el histórico.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="./js/sys_v4_repvt.js"></script>
</body>
</html>
