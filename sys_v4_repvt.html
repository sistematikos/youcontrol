<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Ventas | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f4c75 0%, #3282b8 50%, #00d2ff 100%);
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-gradient); 
            min-height: 100vh;
            margin: 0; padding: 20px; 
        }
        .container { max-width: 1300px; margin: auto; display: flex; flex-direction: column; gap: 20px; }

        /* Primera parte: Encabezado */
        .header-card {
            background: white;
            border-radius: 20px;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-back { background: #3282b8; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .logo-header { 
            height: 140px; /* Logo más grande */
            width: auto;
            filter: drop-shadow(0 0 12px rgba(0, 210, 255, 0.6)) brightness(1.1);
        }

        /* Segunda parte: Cuerpo del reporte (ajuste vertical) */
        .report-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            flex-grow: 1; /* Se expande hacia abajo */
            min-height: 65vh; /* Ajustado para aprovechar el espacio vertical */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .filter-section { display: flex; gap: 15px; margin-bottom: 25px; align-items: flex-end; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 15px; text-align: left; border-bottom: 2px solid #dee2e6; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <div>
                <button class="btn-back" onclick="location.href='sys_v1_menu.html'">
                    <i class="fas fa-arrow-left"></i> VOLVER
                </button>
                <h1 style="margin: 15px 0 0 0;">Reporte de Ventas</h1>
                <p style="color: #666;">Historial detallado de transacciones</p>
            </div>
            <img src="img/logo.png" alt="Logo" class="logo-header">
        </div>

        <div class="report-card">
            <div class="filter-section">
                <div>
                    <label>Desde:</label><br>
                    <input type="date" id="filtro-desde">
                </div>
                <div>
                    <label>Hasta:</label><br>
                    <input type="date" id="filtro-hasta">
                </div>
                <button style="background:#0f4c75; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;" onclick="window.cargarReporteVentas()">
                    <i class="fas fa-search"></i> GENERAR
                </button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Factura / Fecha</th>
                        <th>Cliente</th>
                        <th>Detalle</th>
                        <th>Total ($)</th>
                    </tr>
                </thead>
                <tbody id="tabla-reporte-ventas">
                    <tr><td colspan="4" style="text-align:center; padding: 40px;">Selecciona fechas para cargar reporte.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script type="module" src="./js/sys_v4_repvt.js"></script>
</body>
</html>
