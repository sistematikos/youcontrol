<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Ventas | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f4c75 0%, #3282b8 50%, #00d2ff 100%);
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-gradient); 
            min-height: 100vh;
            margin: 0; padding: 20px; 
        }
        .container { max-width: 1200px; margin: auto; display: flex; flex-direction: column; gap: 15px; }

        /* Tarjeta 1: Compacta */
        .header-card {
            background: white;
            border-radius: 16px;
            padding: 15px 25px; /* Menos padding vertical */
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .btn-back { background: #3282b8; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
        .logo-header { height: 90px; width: auto; filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.5)); }

        /* Tarjeta 2: Altura controlada */
        .report-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            max-height: 70vh; /* Ajustado para no exceder tanto la pantalla */
            overflow-y: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        /* Inputs Modernos */
        .filter-section { display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-end; }
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.75rem; font-weight: 600; color: #555; text-transform: uppercase; }
        input[type="date"] { 
            padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 10px; 
            font-family: inherit; font-size: 0.9rem; transition: border-color 0.3s;
        }
        input[type="date"]:focus { border-color: #3282b8; outline: none; }
        
        .btn-gen { background: #0f4c75; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6; font-size: 0.9rem; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <div>
                <button class="btn-back" onclick="location.href='sys_v1_menu.html'">
                    <i class="fas fa-arrow-left"></i> VOLVER
                </button>
                <h2 style="margin: 10px 0 0 0;">Reporte de Ventas</h2>
            </div>
            <img src="img/logo.png" alt="Logo" class="logo-header">
        </div>

        <div class="report-card">
            <div class="filter-section">
                <div class="input-group">
                    <label>Desde</label>
                    <input type="date" id="filtro-desde">
                </div>
                <div class="input-group">
                    <label>Hasta</label>
                    <input type="date" id="filtro-hasta">
                </div>
                <button class="btn-gen" onclick="window.cargarReporteVentas()">
                    <i class="fas fa-search"></i> GENERAR
                </button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Factura / Fecha</th>
                        <th>Cliente</th>
                        <th>Detalle</th>
                        <th>Total ($)</th>
                    </tr>
                </thead>
                <tbody id="tabla-reporte-ventas">
                    <tr><td colspan="4" style="text-align:center; padding: 20px; color: #888;">Esperando selección de fechas...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script type="module" src="./js/sys_v4_repvt.js"></script>
</body>
</html>
