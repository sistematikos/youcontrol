<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPERACIONES DE INVENTARIO | YOU CONTROL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #F1F5F9; 
            --emerald: #10B981; 
            --blue: #2563EB;
            --red: #EF4444;
            --dark: #1E293B;
            --border: #E2E8F0;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 20px; 
            color: var(--dark);
        }
        
        /* Cabecera */
        .header-panel { 
            background: #ffffff; 
            padding: 0 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            border: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            max-width: 800px; 
            margin: 0 auto 15px auto; 
            height: 70px; 
        }

        .btn-back { 
            background: #F1F5F9; 
            color: var(--dark); 
            padding: 8px 15px; 
            border-radius: 8px; 
            text-decoration: none; 
            font-size: 0.8rem; 
            font-weight: 700; 
            border: 1px solid var(--border); 
            display: inline-flex; 
            align-items: center; 
            gap: 5px; 
            cursor: pointer; 
            transition: background 0.2s; 
        }

        .btn-back:hover { 
            background: #E2E8F0; 
        }

        .logo-header { 
            height: 50px; 
            width: auto; 
        }

        /* Contenido y Tarjeta Principal */
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            max-width: 800px; 
            margin: auto; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            position: relative; 
        }

        .grid-form { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-top: 15px;
        }

        label { 
            font-size: 0.8rem; 
            font-weight: 600; 
            color: #64748B; 
            margin-bottom: 5px; 
            display: block; 
        }

        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 15px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-family: inherit;
        }

        input:disabled {
            background-color: #F8FAFC;
            color: #64748B;
        }

        /* Buscador Flotante */
        .contenedor-buscador {
            position: relative;
            width: 100%;
        }

        #lista-resultados-inv { 
            position: absolute; 
            top: 100%;
            left: 0;
            right: 0;
            background: white; 
            border: 1px solid var(--border); 
            border-radius: 0 0 8px 8px; 
            z-index: 1000; 
            display: none; 
            max-height: 220px; 
            overflow-y: auto; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
        }

        .item-res-inv { 
            padding: 12px; 
            cursor: pointer; 
            border-bottom: 1px solid #F1F5F9; 
            transition: background 0.15s ease-in-out;
        }

        .item-res-inv:hover { 
            background: #F1F5F9; 
        }

        .item-res-inv strong {
            color: var(--dark);
            font-size: 0.9rem;
        }

        .item-res-inv small {
            color: #64748B;
            font-size: 0.8rem;
        }

        /* Botón de Acción */
        .btn-process { 
            background: var(--blue); 
            color: white; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            width: 100%; 
            font-weight: 800; 
            cursor: pointer; 
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn-process:hover {
            opacity: 0.9;
        }
    </style>

    <!-- Script para limpiar caché al retornar -->
    <script>
        function irAlMenu(e) {
            e.preventDefault();
            window.location.href = 'sys_v1_menu.html?refresh=' + new Date().getTime();
        }
    </script>
</head>
<body>

    <header class="header-panel">
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="#" class="btn-back" onclick="irAlMenu(event)">
                <i class="fas fa-arrow-left"></i> VOLVER
            </a>
            <h1 style="font-size: 1.2rem; margin: 0; font-weight: 700; color: #1E293B;">
                OPERACIONES DE INVENTARIO
            </h1>
        </div>
        <img src="img/logo.png" class="logo-header" alt="Logo">
    </header>

    <main class="card">
        <h2><i class="fas fa-boxes-stacked"></i> Movimiento de Inventario</h2>

        <!-- Buscador con Desplegable Flotante -->
        <div class="contenedor-buscador">
            <label>BUSCAR PRODUCTO</label>
            <input type="text" id="buscador-prod-inv" placeholder="Buscar por nombre, SKU o código de barras..." autocomplete="off">
            <div id="lista-resultados-inv"></div>
        </div>

        <div class="grid-form">
            <section>
                <label>SKU Producto</label>
                <input type="text" id="inv-sku" disabled>

                <label>Nombre del Producto</label>
                <input type="text" id="inv-nombre" disabled>

                <label>Stock Actual</label>
                <input type="number" id="inv-stock-actual" disabled value="0">
            </section>

            <section>
                <label>Tipo de Operación</label>
                <select id="inv-tipo-op">
                    <option value="ENTRADA">ENTRADA (+)</option>
                    <option value="SALIDA">SALIDA (-)</option>
                    <option value="AJUSTE">AJUSTE MANUAL (=)</option>
                </select>

                <label>Cantidad a Procesar</label>
                <input type="number" id="inv-cantidad" min="1" placeholder="Ej: 10">

                <label>Concepto / Motivo</label>
                <input type="text" id="inv-concepto" placeholder="Ej: Compra a proveedor, Ajuste de stock...">
            </section>
        </div>

        <button class="btn-process" onclick="window.procesarOperacionInventario()">
            PROCESAR OPERACIÓN (F9)
        </button>
    </main>

    <script type="module" src="./js/sys_v3_op-inv.js"></script>
</body>
</html>
