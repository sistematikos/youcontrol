<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Operaciones de Inventario - YOU CONTROL</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container my-4">
  <h3 class="mb-3">Operaciones de Inventario</h3>

  <!-- Tipo de Operación -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="row">
        <div class="col-md-4">
          <label for="tipo-operacion" class="form-label font-weight-bold">Acción a Realizar:</label>
          <select id="tipo-operacion" class="form-select">
            <option value="carga">CARGA (+ Sumar Inventario)</option>
            <option value="descarga">DESCARGA (- Restar Inventario)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Buscador -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="position-relative">
        <input type="text" id="buscador-dinamico" class="form-control form-control-lg" placeholder="Buscar por Nombre, SKU o Código de Barras...">
        <div id="dropdown-resultados" class="position-absolute w-100 shadow" style="display:none; z-index:1000;"></div>
        <small id="aviso-no-registrado" class="text-danger mt-1" style="display:none;">Producto no encontrado.</small>
      </div>
    </div>
  </div>

  <!-- Formulario de Selección e Ingreso de Cantidad -->
  <div class="card mb-3">
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <input type="hidden" id="inv-barras">
        
        <div class="col-md-2">
          <label for="inv-sku" class="form-label">SKU</label>
          <input type="text" id="inv-sku" class="form-control" readonly>
        </div>
        
        <div class="col-md-4">
          <label for="inv-nombre" class="form-label">Producto</label>
          <input type="text" id="inv-nombre" class="form-control" readonly>
        </div>
        
        <div class="col-md-2">
          <label for="inv-stock-actual" class="form-label">Stock Actual</label>
          <input type="number" id="inv-stock-actual" class="form-control bg-light" readonly>
        </div>
        
        <div class="col-md-2">
          <label for="inv-cantidad" class="form-label">Cantidad</label>
          <input type="number" id="inv-cantidad" class="form-control border-primary" min="1" placeholder="0">
        </div>
        
        <div class="col-md-2">
          <button class="btn btn-success w-100" onclick="window.agregarALista()">Anexar Línea</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabla de Movimientos Anexados -->
  <div class="card">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover m-0">
          <thead class="table-dark">
            <tr>
              <th>SKU</th>
              <th>Producto</th>
              <th class="text-center">Stock Actual</th>
              <th class="text-center">Operación</th>
              <th class="text-center">Nuevo Stock</th>
              <th class="text-center">Acción</th>
            </tr>
          </thead>
          <tbody id="tabla-items-operacion">
            <!-- Filas añadidas dinámicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Botón Guardar Masivo -->
  <div class="d-flex justify-content-end mt-3">
    <button class="btn btn-primary btn-lg" onclick="window.procesarOperacionInventario()">Guardar Operación</button>
  </div>
</div>

<!-- Importante: cargar como module para que Firebase trabaje correctamente -->
<script type="module" src="./sys_v3_op-inv.js"></script>
</body>
</html>
