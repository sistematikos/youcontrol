<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU CONTROL | Activación</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #F1F5F9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        textarea { width: 100%; height: 100px; padding: 12px; margin: 15px 0; border: 2px solid #E2E8F0; border-radius: 12px; box-sizing: border-box; resize: none; font-family: monospace; }
        button { width: 100%; padding: 15px; background: #002D72; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #0052D4; }
    </style>

    <script>
        // Capta el evento de instalación nativo globalmente al cargar la página
        window.deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.deferredPrompt = e;
        });

        // 1. VALIDACIÓN AUTOMÁTICA DE SESIÓN PREVIA
        document.addEventListener('DOMContentLoaded', () => {
            const licenciaValidada = localStorage.getItem('licencia_validada');
            const empresaID = localStorage.getItem('youcontrol_empresa_id');

            if (licenciaValidada === 'true' && empresaID) {
                window.location.replace('sys_v1_menu.html');
            }
        });

        // REGISTRO DEL SERVICE WORKER
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error', err));
            });
        }
    </script>
</head>
<body>

    <div class="card" id="cardActivacion">
        <img src="img/logo.png" style="width: 80px; margin-bottom: 15px;" alt="Logo">
        <h2 style="color:#002D72; margin-top: 0;">Activación</h2>
        <p style="color:#64748b;">Pega tu código de licencia:</p>
        <textarea id="tokenInput" placeholder="Pega el código aquí..."></textarea>
        <button onclick="procesarActivacion()">ACTIVAR SISTEMA</button>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const getHardwareID = () => btoa(navigator.userAgent + navigator.language);

        window.procesarActivacion = async () => {
    const rawToken = document.getElementById('tokenInput').value.trim();
    if (!rawToken) return alert("Pega el código primero.");
    
    try {
        const data = JSON.parse(atob(rawToken));
        const hwID = getHardwareID();
        const activationId = data.activation_id;

        // Referencias a los documentos en ambas colecciones
        const licenciaRef = doc(db, "licencias", activationId);
        const empresaRef = doc(db, "empresas_config", activationId);

        // Obtener ambos documentos simultáneamente
        const [snapLicencia, snapEmpresa] = await Promise.all([
            getDoc(licenciaRef),
            getDoc(empresaRef)
        ]);

        // --- 1. PROCESAR COLECCIÓN: LICENCIAS ---
        let equiposLicencia = [];
        let limiteLicencia = data.l || 1;

        if (snapLicencia.exists()) {
            const dbData = snapLicencia.data();
            equiposLicencia = Array.isArray(dbData.equipos) ? dbData.equipos : [];
            limiteLicencia = dbData.limite || limiteLicencia;

            if (!equiposLicencia.includes(hwID) && equiposLicencia.length >= limiteLicencia) {
                return alert("Error: Límite de dispositivos alcanzado en la licencia.");
            }

            if (!equiposLicencia.includes(hwID)) {
                equiposLicencia.push(hwID);
                await updateDoc(licenciaRef, { equipos: equiposLicencia });
            }
        } else {
            equiposLicencia = [hwID];
            await setDoc(licenciaRef, { 
                cliente: data.n || "", 
                limite: limiteLicencia, 
                equipos: equiposLicencia, 
                fecha_registro: new Date().toISOString() 
            });
        }

        // --- 2. PROCESAR COLECCIÓN: EMPRESAS_CONFIG ---
        if (snapEmpresa.exists()) {
            const dbEmpresa = snapEmpresa.data();
            const equiposEmpresa = Array.isArray(dbEmpresa.equipos) ? dbEmpresa.equipos : [];
            if (!equiposEmpresa.includes(hwID)) {
                await updateDoc(empresaRef, { 
                    equipos: [...equiposEmpresa, hwID],
                    licencia_token: rawToken
                });
            }
        } else {
            await setDoc(empresaRef, { 
                nombre: data.n || "",
                rif: data.rif || "",
                email: data.email || "",
                telefono: data.tel || "",
                direccion: data.dir || "",
                logoUrl: data.logoUrl || "img/logo.png",
                limite_equipos: limiteLicencia, 
                equipos: [hwID], 
                licencia_token: rawToken,
                timestamp: new Date().toISOString() 
            });
        }

        // --- 3. GUARDAR CREDENCIALES LOCALES Y DISPARAR PWA ---
        localStorage.setItem('youcontrol_empresa_id', activationId);
        localStorage.setItem('licencia_validada', 'true');

        if (window.deferredPrompt) {
            window.deferredPrompt.prompt();
            await window.deferredPrompt.userChoice;
            window.deferredPrompt = null;
        }

        // Redirigir al menú principal
        window.location.replace('sys_v1_menu.html');
        
    } catch (e) {
        console.error("Error al procesar activación:", e);
        alert("Código de licencia inválido o error en la base de datos.");
    }
};
    </script>
</body>
</html>
