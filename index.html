<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Control | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark: #1E1E2D;
            --vinotinto: #800020;
            --blue: #3B82F6;
            --emerald: #10B981;
            --white: #FFFFFF;
            --bg: #F4F7F9;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header Profesional */
        header {
            width: 100%;
            background: var(--dark);
            color: var(--white);
            padding: 40px 0;
            text-align: center;
            border-bottom: 6px solid var(--vinotinto);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            position: relative;
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 3px;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: var(--blue);
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Contenedor del Menú en Cuadrícula */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 30px 20px;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }

        .menu-item {
            background: var(--white);
            border-radius: 25px;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--dark);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #E2E8F0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            cursor: pointer;
        }

        .menu-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-color: var(--blue);
        }

        /* Iconos con Fondos Circulares */
        .icon-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 1.8rem;
            transition: 0.3s;
        }

        .menu-item:hover .icon-circle {
            transform: rotate(10deg) scale(1.1);
        }

        .bg-ventas { background: #DBEAFE; color: var(--blue); }
        .bg-inv { background: #F1F5F9; color: var(--dark); }
        .bg-carga { background: #D1FAE5; color: var(--emerald); }
        .bg-config { background: #FEE2E2; color: var(--vinotinto); }

        .menu-item span {
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
        }

        .menu-item small {
            font-weight: 400;
            color: #64748B;
            margin-top: 5px;
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 25px;
            text-align: center;
            font-size: 0.85rem;
            color: #94A3B8;
            line-height: 1.5;
        }

        footer b {
            color: var(--dark);
        }

        /* Responsive para Móviles */
        @media (max-width: 480px) {
            .menu-container {
                grid-template-columns: 1fr;
            }
            header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body oncontextmenu="return false">

    <header>
        <h1>YOU CONTROL</h1>
        <p>Solución Integral de Inventario</p>
    </header>

    <div class="menu-container">
        <a href="sys_v1_vt.html" class="menu-item">
            <div class="icon-circle bg-ventas">
                <i class="fas fa-cash-register"></i>
            </div>
            <span>Ventas</span>
            <small>Facturación Rápida</small>
        </a>

        <a href="sys_v1_101.html" class="menu-item">
            <div class="icon-circle bg-inv">
                <i class="fas fa-boxes-stacked"></i>
            </div>
            <span>Inventario</span>
            <small>Stock y Precios</small>
        </a>

        <a href="sys_v1_datos.html" class="menu-item">
            <div class="icon-circle bg-carga">
                <i class="fas fa-cloud-upload-alt"></i>
            </div>
            <span>Cargar Stock</span>
            <small>Entrada de Productos</small>
        </a>

        <a href="#" class="menu-item" onclick="accesoSeguro()">
            <div class="icon-circle bg-config">
                <i class="fas fa-user-shield"></i>
            </div>
            <span>Ajustes</span>
            <small>Tasa y Seguridad</small>
        </a>
    </div>

    <footer>
        Sistema Desarrollado por:<br>
        <b>Sistematikos - Frank Hernandez</b><br>
        &copy; 2026 Todos los derechos reservados.
    </footer>

    <script>
        // Bloqueo de teclas de inspección (F12, Ctrl+U, etc.)
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        }

        // Función de seguridad para ajustes
        function accesoSeguro() {
            const pass = prompt("Acceso de Administrador. Ingrese Clave:");
            if(pass === "1234") { // Cambiar por tu clave preferida
                alert("Acceso concedido");
                // Aquí podrías redirigir a un config.html
            } else {
                alert("Clave incorrecta");
            }
        }
    </script>

</body>
</html>
