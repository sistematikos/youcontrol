<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistematikos | Validación de Licencia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #002D72; 
            --electric-blue: #0052D4;
            --bg: #001432;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .licencia-modal {
            background: white; 
            padding: 40px; 
            border-radius: 30px; 
            width: 90%; 
            max-width: 450px;
            text-align: center; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        textarea {
            width: 100%; 
            height: 100px; 
            border-radius: 12px; 
            padding: 10px;
            border: 2px solid #E2E8F0; 
            font-family: monospace; 
            resize: none; 
            margin: 15px 0;
            box-sizing: border-box;
        }

        textarea:focus {
            border-color: var(--electric-blue);
            outline: none;
        }

        .btn-act {
            background: var(--electric-blue); 
            color: white; 
            border: none;
            padding: 15px 30px; 
            border-radius: 12px; 
            font-weight: 800; 
            cursor: pointer; 
            width: 100%;
            transition: 0.2s;
        }

        .btn-act:hover {
            background: #0041a8;
        }

        .loading-screen {
            color: white;
            text-align: center;
        }

        .loading-screen i {
            font-size: 3rem;
            color: var(--electric-blue);
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .oculto { display: none !important; }
    </style>
</head>
<body oncontextmenu="return false">

    <div id="pantallaCarga" class="loading-screen">
        <i class="fas fa-circle-notch"></i>
        <h2>Verificando Licencia de Uso...</h2>
        <p style="opacity: 0.6;">Sistematikos You Control</p>
    </div>

    <div id="capaSeguridad" class="oculto">
        <div class="licencia-modal">
            <img src="https://via.placeholder.com/80/002D72/FFFFFF?text=S" style="border-radius: 15px; margin-bottom: 15px;" alt="Sistematikos">
            <h2 style="color: var(--primary-blue); margin: 0;">Sistematikos</h2>
            <p style="color: #64748B;">Activa tu licencia para continuar</p>
            <textarea id="tokenInput" placeholder="Pega tu clave de activación aquí..."></textarea>
            <button class="btn-act" onclick="procesarActivacion()">ACTIVAR SISTEMA</button>
            <p id="msgError" style="color: red; display: none; margin-top: 10px; font-size: 0.8rem;">Código inválido o límite de equipos alcanzado.</p>
        </div>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const getHardwareID = () => btoa(navigator.userAgent + screen.width + navigator.language);

        async function verificarLicenciaGlobal() {
            const token = localStorage.getItem('licencia_youcontrol');
            
            if (!token) {
                mostrarInterfazActivacion();
                return;
            }

            try {
                const data = JSON.parse(atob(token));
                const hwID = getHardwareID();
                
                const docRef = doc(db, "licencias", data.activation_id);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    const dbData = snap.data();
                    
                    if (!dbData.equipos.includes(hwID)) {
                        if (dbData.equipos.length >= dbData.limite) {
                            alert("Esta licencia ya superó el límite de equipos permitidos.");
                            bloquearAcceso();
                            return;
                        }
                        await updateDoc(docRef, { equipos: [...dbData.equipos, hwID] });
                    }

                    // SE GUARDA EL ID DE LA EMPRESA DINÁMICAMENTE ANTES DE REDIRECCIONAR
                    localStorage.setItem('youcontrol_empresa_id', data.activation_id);

                    // LICENCIA VÁLIDA: Saltamos directo al Menú del Sistema
                    location.href = "sys_v1_menu.html";
                } else {
                    bloquearAcceso();
                }
            } catch (e) {
                bloquearAcceso();
            }
        }

        window.procesarActivacion = async () => {
            const rawToken = document.getElementById('tokenInput').value.trim();
            const btn = document.querySelector('.btn-act');
            btn.innerText = "VERIFICANDO...";
            
            try {
                const data = JSON.parse(atob(rawToken));
                const hwID = getHardwareID();

                const docRef = doc(db, "licencias", data.activation_id);
                const snap = await getDoc(docRef);

                if (!snap.exists()) {
                    await setDoc(docRef, {
                        cliente: data.n,
                        limite: data.l || 3,
                        equipos: [hwID],
                        fecha: new Date().toISOString()
                    });
                }

                // SE GUARDA EL TOKEN DE LICENCIA Y EL ID DE LA EMPRESA EN LA ACTIVACIÓN INICIAL
                localStorage.setItem('licencia_youcontrol', rawToken);
                localStorage.setItem('youcontrol_empresa_id', data.activation_id);
                
                location.reload();
            } catch (e) {
                document.getElementById('msgError').style.display = 'block';
                btn.innerText = "ACTIVAR SISTEMA";
            }
        };

        function mostrarInterfazActivacion() {
            document.getElementById('pantallaCarga').classList.add('oculto');
            document.getElementById('capaSeguridad').classList.remove('oculto');
        }

        function bloquearAcceso() {
            localStorage.removeItem('licencia_youcontrol');
            localStorage.removeItem('youcontrol_empresa_id');
            mostrarInterfazActivacion();
        }

        verificarLicenciaGlobal();
    </script>
</body>
</html>
