<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistematikos | You Control PWA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#001432">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/002D72/FFFFFF?text=YC">

    <style>
        :root {
            --bg-dark: #001432;
            --primary-blue: #002D72;
            --electric-blue: #0052D4;
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
        }

        .hero-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 500px;
            text-align: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .pwa-logo {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, var(--electric-blue), var(--primary-blue));
            color: white;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8rem;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(0, 82, 212, 0.3);
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 10px 25px rgba(0, 82, 212, 0.3); }
            100% { transform: scale(1.04); box-shadow: 0 15px 35px rgba(0, 82, 212, 0.5); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.03em;
            background: linear-gradient(to right, #FFFFFF, #93C5FD);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 8px 0 35px 0;
            line-height: 1.5;
        }

        .action-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 30px 24px;
            width: 100%;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .btn-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--electric-blue), #0041a8);
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0, 82, 212, 0.3);
            border: none;
            cursor: pointer;
        }

        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 82, 212, 0.4);
        }

        /* Botón de instalación dinámico */
        .btn-install {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-install:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .oculto { display: none !important; }

        footer {
            padding: 20px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.3);
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body oncontextmenu="return false">

    <div class="hero-container">
        <div class="pwa-logo">
            <i class="fas fa-cubes"></i>
        </div>

        <h1>You Control</h1>
        <p class="tagline">Plataforma de Gestión Comercial Inteligente y Auditoría de Ventas</p>

        <div class="action-card">
            <div class="btn-panel">
                <a href="./sys_lic.html" class="btn-main">
                    <i class="fas fa-right-to-bracket"></i> INGRESAR AL SISTEMA
                </a>

                <button id="btnPWAInstall" class="btn-install oculto">
                    <i class="fas fa-cloud-arrow-down"></i> DESCARGAR APLICACIÓN WEB
                </button>
            </div>
        </div>
    </div>

    <footer>
        Desarrollado por Sistematikos - Frank Hernandez &copy; 2026
    </footer>

    <script>
        // Registrar el Service Worker indispensable para PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA Service Worker registrado con éxito', reg.scope))
                    .catch(err => console.error('Error al registrar Service Worker', err));
            });
        }

        // Capturar el evento de instalación nativo del navegador
        let deferredPrompt;
        const btnInstall = document.getElementById('btnPWAInstall');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Previene que Chrome/Edge muestren su banner por defecto
            e.preventDefault();
            deferredPrompt = e;
            // Revela nuestro botón corporativo personalizado
            btnInstall.classList.remove('oculto');
        });

        btnInstall.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            // Desplegar diálogo oficial de instalación
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`Respuesta del usuario para la instalación: ${outcome}`);
            deferredPrompt = null;
            // Ocultar el botón una vez aceptado o rechazado
            btnInstall.classList.add('oculto');
        });

        // Ocultar el botón si la app ya está instalada y corriendo de forma nativa
        window.addEventListener('appinstalled', () => {
            console.log('You Control PWA instalada exitosamente por el usuario.');
            btnInstall.classList.add('oculto');
        });
    </script>
</body>
</html>
