<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistematikos | You Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #002D72; /* Azul oscuro Sistematikos */
            --electric-blue: #0052D4;
            --vinotinto: #800020;
            --bg: #F8FAFC;
        }

        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; }

        /* Capa de Bloqueo Total */
        #capaSeguridad {
            position: fixed; z-index: 10000; top: 0; left: 0; width: 100%; height: 100%;
            background: #001432; display: flex; align-items: center; justify-content: center;
        }

        .licencia-modal {
            background: white; padding: 40px; border-radius: 30px; width: 90%; max-width: 450px;
            text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        /* Dashboard Style */
        .header-main {
            background: var(--primary-blue); color: white; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 5px solid var(--vinotinto);
        }

        .menu-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px; padding: 40px; max-width: 1000px; margin: auto;
        }

        .menu-item {
            background: white; padding: 30px; border-radius: 20px; text-align: center;
            text-decoration: none; color: var(--primary-blue); font-weight: 700;
            transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid transparent;
        }

        .menu-item:hover {
            border-color: var(--electric-blue); transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 82, 212, 0.2);
        }

        .menu-item i { font-size: 2.5rem; display: block; margin-bottom: 15px; color: var(--electric-blue); }

        textarea {
            width: 100%; height: 100px; border-radius: 12px; padding: 10px;
            border: 2px solid #DDD; font-family: monospace; resize: none; margin: 15px 0;
        }

        .btn-act {
            background: var(--electric-blue); color: white; border: none;
            padding: 15px 30px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body oncontextmenu="return false">

    <div id="capaSeguridad">
        <div class="licencia-modal">
            <img src="https://via.placeholder.com/80/002D72/FFFFFF?text=S" style="border-radius: 15px; margin-bottom: 15px;">
            <h2 style="color: var(--primary-blue); margin: 0;">Sistematikos</h2>
            <p style="color: #64748B;">Activa tu licencia para continuar</p>
            <textarea id="tokenInput" placeholder="Pega tu clave aquí..."></textarea>
            <button class="btn-act" onclick="procesarActivacion()">ACTIVAR SISTEMA</button>
            <p id="msgError" style="color: red; display: none; margin-top: 10px; font-size: 0.8rem;">Código inválido o límite de equipos alcanzado.</p>
        </div>
    </div>

    <header class="header-main">
        <div>
            <h1 id="txtEmpresa" style="margin: 0; font-size: 1.4rem;">You Control</h1>
            <small id="txtRif" style="opacity: 0.8;">Cargando datos...</small>
        </div>
        <div style="text-align: right;">
            <span id="txtStatus" style="background: #10B981; padding: 5px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: 800;">LICENCIA ACTIVA</span>
        </div>
    </header>

    <div class="menu-grid">
        <a href="sys_v1_inv.html" class="menu-item"><i class="fas fa-boxes-stacked"></i>Inventario</a>
        <a href="sys_v1_vt.html" class="menu-item"><i class="fas fa-cash-register"></i>Ventas</a>
        <a href="sys_v1_reportes.html" class="menu-item"><i class="fas fa-chart-line"></i>Reportes</a>
        <a href="node_v2_config.html" class="menu-item"><i class="fas fa-gears"></i>Ajustes</a>
    </div>

    <footer style="text-align: center; margin-top: 50px; color: #94A3B8; font-size: 0.8rem;">
        Desarrollado por Sistematikos - Frank Hernandez &copy; 2026
    </footer>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Función para generar la huella del equipo
        const getHardwareID = () => btoa(navigator.userAgent + screen.width + navigator.language);

        async function verificarLicenciaGlobal() {
            const token = localStorage.getItem('licencia_youcontrol');
            
            if (!token) {
                document.getElementById('capaSeguridad').style.display = 'flex';
                return;
            }

            try {
                const data = JSON.parse(atob(token));
                const hwID = getHardwareID();
                
                // Consultamos Firebase para validar hardware y licencia
                const docRef = doc(db, "licencias", data.activation_id);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    const dbData = snap.data();
                    
                    // Si el equipo no está registrado, intentamos registrarlo
                    if (!dbData.equipos.includes(hwID)) {
                        if (dbData.equipos.length >= dbData.limite) {
                            alert("Esta licencia ya superó el límite de equipos permitidos.");
                            bloquearAcceso();
                            return;
                        }
                        await updateDoc(docRef, { equipos: [...dbData.equipos, hwID] });
                    }

                    // Todo bien: Ocultamos bloqueo y llenamos datos
                    document.getElementById('capaSeguridad').style.display = 'none';
                    document.getElementById('txtEmpresa').innerText = data.n;
                    document.getElementById('txtRif').innerText = `RIF: ${data.rif || 'N/A'}`;
                } else {
                    bloquearAcceso();
                }
            } catch (e) {
                bloquearAcceso();
            }
        }

        window.procesarActivacion = async () => {
            const rawToken = document.getElementById('tokenInput').value.trim();
            const btn = document.querySelector('.btn-act');
            btn.innerText = "VERIFICANDO...";
            
            try {
                const data = JSON.parse(atob(rawToken));
                const hwID = getHardwareID();

                // Registramos en Firebase si es la primera vez
                const docRef = doc(db, "licencias", data.activation_id);
                const snap = await getDoc(docRef);

                if (!snap.exists()) {
                    await setDoc(docRef, {
                        cliente: data.n,
                        limite: data.l || 3,
                        equipos: [hwID],
                        fecha: new Date().toISOString()
                    });
                }

                localStorage.setItem('licencia_youcontrol', rawToken);
                location.reload();
            } catch (e) {
                document.getElementById('msgError').style.display = 'block';
                btn.innerText = "ACTIVAR SISTEMA";
            }
        };

        function bloquearAcceso() {
            localStorage.removeItem('licencia_youcontrol');
            document.getElementById('capaSeguridad').style.display = 'flex';
        }

        // Ejecutar al entrar
        verificarLicenciaGlobal();
    </script>
</body>
</html>
