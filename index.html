<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU CONTROL | Activación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #F1F5F9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        textarea { width: 100%; height: 100px; padding: 12px; margin: 15px 0; border: 2px solid #E2E8F0; border-radius: 12px; box-sizing: border-box; resize: none; font-family: monospace; }
        button { width: 100%; padding: 15px; background: #002D72; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0052D4; }
    </style>
</head>
<body>

    <div class="card" id="cardActivacion">
        <h2 style="color:#002D72;">Activación</h2>
        <p style="color:#64748b;">Pega tu código de licencia:</p>
        <textarea id="tokenInput" placeholder="Pega el código aquí..."></textarea>
        <button onclick="procesarActivacion()">ACTIVAR SISTEMA</button>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const getHardwareID = () => btoa(navigator.userAgent + navigator.language);

        window.procesarActivacion = async () => {
            const rawToken = document.getElementById('tokenInput').value.trim();
            if (!rawToken) return alert("Pega el código primero.");
            
            try {
                const data = JSON.parse(atob(rawToken));
                const hwID = getHardwareID();
                const docRef = doc(db, "licencias", data.activation_id);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    const dbData = snap.data();
                    const equipos = Array.isArray(dbData.equipos) ? dbData.equipos : [];
                    if (!equipos.includes(hwID) && equipos.length >= dbData.limite) {
                        return alert("Error: Límite de dispositivos alcanzado.");
                    }
                    if (!equipos.includes(hwID)) {
                        await updateDoc(docRef, { equipos: [...equipos, hwID] });
                    }
                } else {
                    await setDoc(docRef, { 
                        cliente: data.n, 
                        limite: data.l, 
                        equipos: [hwID], 
                        fecha_registro: new Date().toISOString() 
                    });
                }

                localStorage.setItem('youcontrol_empresa_id', data.activation_id);
                localStorage.setItem('licencia_validada', 'true');
                
                // Mostrar pantalla de aviso de instalación
                document.body.innerHTML = `
                    <div style="background:white; padding:40px; border-radius:20px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.2); max-width:350px; width: 90%;">
                        <i class="fas fa-check-circle" style="font-size:4rem; color:#22c55e; margin-bottom:20px;"></i>
                        <h2 style="color:#002D72;">¡Sistema Activado!</h2>
                        <p style="color:#64748b; margin-bottom:25px;">Para una mejor experiencia, instala la aplicación en tu dispositivo:</p>
                        
                        <div style="text-align:left; font-size:0.9rem; color:#334; margin-bottom:25px; line-height: 1.5;">
                            <p>📱 <b>Celular:</b> Toca el menú (3 puntos) y elige <b>"Instalar aplicación"</b> o <b>"Añadir a inicio"</b>.</p>
                            <p>💻 <b>PC:</b> Busca el icono de instalación en la barra de direcciones.</p>
                        </div>

                        <button onclick="window.location.href='sys_v1_menu.html'" 
                                style="width:100%; padding:15px; background:#002D72; color:white; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">
                            ENTRAR AL SISTEMA
                        </button>
                    </div>
                `;
                
            } catch (e) {
                console.error(e);
                alert("Código de licencia inválido o mal formado.");
            }
        };
    </script>
</body>
</html>
