<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Control | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-blue: #1E1E2D;
            --vinotinto: #800020;
            --blue-electric: #3B82F6;
            --emerald: #10B981;
            --white: #FFFFFF;
            --bg: #F4F7F9;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Header Estilo Sistematikos */
        header {
            width: 100%;
            background: var(--dark-blue);
            color: var(--white);
            padding: 30px 0;
            text-align: center;
            border-bottom: 6px solid var(--vinotinto);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-weight: 800;
        }

        header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: var(--blue-electric);
            font-weight: 600;
        }

        /* Contenedor del Menú */
        .menu-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 30px 20px;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }

        .menu-item {
            background: var(--white);
            border-radius: 20px;
            padding: 25px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--dark-blue);
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid #E2E8F0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            cursor: pointer;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
            border-color: var(--blue-electric);
        }

        .menu-item i {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        /* Iconos de Colores */
        .icon-inv { color: var(--blue-electric); }
        .icon-add { color: var(--emerald); }
        .icon-rep { color: #F59E0B; } /* Dorado para Reportes */
        .icon-cfg { color: #64748B; }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #94A3B8;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .menu-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body oncontextmenu="return false">

    <header>
        <h1>YOU CONTROL</h1>
        <p>SISTEMA DE VENTAS & INVENTARIO</p>
    </header>

    <div class="menu-container">
        <a href="sys_v1_101.html" class="menu-item">
            <i class="fas fa-boxes-stacked icon-inv"></i>
            <span>Inventario</span>
        </a>

        <a href="sys_v1_datos.html" class="menu-item">
            <i class="fas fa-file-import icon-add"></i>
            <span>Cargar Stock</span>
        </a>

        <a href="sys_v1_reportes.html" class="menu-item">
            <i class="fas fa-chart-line icon-rep"></i>
            <span>Reportes</span>
        </a>

        <a href="#" class="menu-item" onclick="abrirConfig()">
            <i class="fas fa-gears icon-cfg"></i>
            <span>Configuración</span>
        </a>
    </div>

    <footer>
        Diseño y Sistema: <b>Sistematikos</b><br>
        Frank Hernandez &copy; 2026
    </footer>

    <script>
        // Bloqueo de teclas de inspección para protección de código
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
                return false;
            }
        }

        function abrirConfig() {
            let pass = prompt("Acceso Restringido. Ingrese Clave de Administrador:");
            if(pass === "1234") { // Puedes cambiar esta clave luego
                location.href = "config.html";
            } else {
                alert("Acceso Denegado");
            }
        }
    </script>

</body>
</html>
