<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU CONTROL | Acceso</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #F1F5F9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #E2E8F0; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0EA5E9; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <img src="img/logo.png" style="width: 100px; margin-bottom: 20px;" onerror="this.style.display='none'">
        <h2>Bienvenido</h2>
        <p>Ingrese su código de licencia para continuar:</p>
        <input type="text" id="input-licencia" placeholder="Código de acceso">
        <button onclick="validarLicencia()">VALIDAR LICENCIA</button>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        window.validarLicencia = async () => {
            const codigo = document.getElementById('input-licencia').value.trim();
            if (!codigo) return alert("Por favor ingresa un código.");

            try {
                // Suponiendo que tus licencias están en la colección "licencias"
                const docRef = await getDoc(doc(db, "licencias", codigo));
                
                if (docRef.exists()) {
                    const data = docRef.data();
                    // Guardamos la info necesaria en localStorage
                    localStorage.setItem('youcontrol_empresa_id', data.empresa_id);
                    localStorage.setItem('licencia_youcontrol', btoa(JSON.stringify({ n: data.nombre_empresa })));
                    
                    alert("Licencia verificada. Redirigiendo...");
                    window.location.href = "sys_v1_menu.html";
                } else {
                    alert("Código de licencia inválido.");
                }
            } catch (e) {
                console.error(e);
                alert("Error al validar, intenta de nuevo.");
            }
        };
    </script>
</body>
</html>
