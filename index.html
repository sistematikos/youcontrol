<!DOCTYPE html>
<html lang="es">
<head>

    <script>
    // --- GUARD DE AUTENTICACIÓN AUTOMÁTICA ---
    (function() {
        // Verificamos si existe la bandera de licencia válida o el ID de empresa
        const licenciaGuardada = localStorage.getItem('licencia_youcontrol');
        
        if (licenciaGuardada) {
            // Si ya existe licencia, redirigimos al menú inmediatamente
            window.location.replace('sys_v1_menu.html');
        }
    })();
</script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistematikos | You Control v4</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="shortcut icon" href="./assets/logo_512.png" type="image/png">
    <meta name="theme-color" content="#001432">

   <script>
    // --- GUARD DE AUTENTICACIÓN ---
    // Esto se ejecuta antes de mostrar cualquier cosa en pantalla
    (function() {
        if (localStorage.getItem('licencia_validada') === 'true') {
            window.location.replace('sys_v1_menu.html');
        }
    })();
</script>

    <style>
        :root {
            --bg-dark: #001432;
            --primary-blue: #002D72; 
            --electric-blue: #0052D4;
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
        }

        body { font-family: 'Poppins', sans-serif; background: var(--bg-dark); margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; color: var(--text-light); }
        .main-container { display: flex; flex-direction: column; align-items: center; gap: 25px; width: 90%; max-width: 600px; }
        .brand-header { text-align: center; }
        .brand-logo { width: 100px; height: 100px; background: rgba(255, 255, 255, 0.05); border-radius: 25px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); overflow: hidden; }
        .brand-logo img { width: 100%; height: 100%; object-fit: cover; }
        .activation-panel { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 40px; border-radius: 30px; width: 100%; box-sizing: border-box; text-align: center; }
        .btn-act { padding: 18px 25px; border-radius: 16px; font-weight: 700; cursor: pointer; border: none; width: 100%; margin-bottom: 15px; transition: all 0.3s; font-size: 1rem; }
        .btn-download { background: var(--electric-blue); color: white; }
        .btn-entry { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); cursor: not-allowed; }
        .btn-entry.active { background: #10B981; color: white; cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="brand-header">
            <div class="brand-logo">
                <img src="./assets/logo_512.png" alt="Logo You Control">
            </div>
            <h1>You Control v4</h1>
            <p style="color: var(--text-muted)">Sistema de Gestión Inteligente</p>
        </div>

        <div class="activation-panel">
            <button id="btnInstallPWA" class="btn-act btn-download">
                <i class="fas fa-download"></i> INSTALAR SOFTWARE
            </button>
            <button id="btnEnterSystem" class="btn-act btn-entry" disabled>
                <i class="fas fa-lock"></i> ACCESO BLOQUEADO
            </button>
        </div>
    </div>

    <script>
        let deferredPrompt;
        const btnInstall = document.getElementById('btnInstallPWA');
        const btnEnter = document.getElementById('btnEnterSystem');

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        btnInstall.addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') activarIngreso();
                });
            } else {
                alert("El software ya está instalado o no disponible.");
            }
        });

        window.addEventListener('appinstalled', () => activarIngreso());

        function activarIngreso() {
            btnInstall.disabled = true;
            btnInstall.innerHTML = '<i class="fas fa-check"></i> SOFTWARE INSTALADO';
            btnInstall.style.opacity = "0.5";
            
            btnEnter.disabled = false;
            btnEnter.classList.add('active');
            btnEnter.innerHTML = '<i class="fas fa-unlock"></i> INGRESAR AL SISTEMA';
            
            // MODIFICACIÓN AQUÍ: Redirección inteligente
            btnEnter.onclick = () => {
                location.href = "sys_lic.html";
            };
        }
    </script>
</body>
</html>
