<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU CONTROL | Activación</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #F1F5F9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        textarea { width: 100%; height: 100px; padding: 12px; margin: 15px 0; border: 2px solid #E2E8F0; border-radius: 12px; box-sizing: border-box; resize: none; font-family: monospace; }
        button { width: 100%; padding: 15px; background: #002D72; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #0052D4; }
    </style>

    <script>
        window.deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            window.deferredPrompt = e;
        });

        // 1. VALIDACIÓN AUTOMÁTICA DE SESIÓN PREVIA
        document.addEventListener('DOMContentLoaded', () => {
            const licenciaValidada = localStorage.getItem('licencia_validada');
            const empresaID = localStorage.getItem('youcontrol_empresa_id');

            if (licenciaValidada === 'true' && empresaID) {
                window.location.replace('sys_v1_menu.html');
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error', err));
            });
        }
    </script>
</head>
<body>

    <div class="card" id="cardActivacion">
        <img src="img/logo.png" style="width: 80px; margin-bottom: 15px;" alt="Logo">
        <h2 style="color:#002D72; margin-top: 0;">Activación</h2>
        <p style="color:#64748b;">Pega tu código de licencia:</p>
        <textarea id="tokenInput" placeholder="Pega el código aquí..."></textarea>
        <!-- Botón conectado de forma segura -->
        <button id="btnActivar">ACTIVAR SISTEMA</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración por defecto (Base de datos principal para buscar la licencia)
        const defaultConfig = {
            apiKey: "AIzaSyAMkpj9tFps526mL6hO-ciePWrTdx_NK9Q",
            authDomain: "youcontrol-1d60a.firebaseapp.com",
            projectId: "youcontrol-1d60a",
            storageBucket: "youcontrol-1d60a.firebasestorage.app",
            messagingSenderId: "812100760013",
            appId: "1:812100760013:web:7574906aa285555faf5484"
        };

        const appPrincipal = initializeApp(defaultConfig);
        const dbPrincipal = getFirestore(appPrincipal);

        const getHardwareID = () => btoa(navigator.userAgent + navigator.language);

        async function procesarActivacion() {
            const rawToken = document.getElementById('tokenInput').value.trim();
            if (!rawToken) return alert("Pega el código primero.");
            
            try {
                const data = JSON.parse(atob(rawToken));
                const hwID = getHardwareID();
                const activationId = data.activation_id;

                // 1. Consultar primero en la base de datos principal la configuración de la empresa (para ver si tiene Firebase propio)
                const empresaRefPrincipal = doc(dbPrincipal, "empresas_config", activationId);
                const snapEmpresaPrincipal = await getDoc(empresaRefPrincipal);

                let dbObjetivo = dbPrincipal; // Por defecto usa la principal

                if (snapEmpresaPrincipal.exists()) {
                    const datosEmpresaConfig = snapEmpresaPrincipal.data();
                    if (datosEmpresaConfig.firebaseConfig) {
                        // Si tiene base de datos independiente configurada, la guardamos en localStorage para el firebase-config.js
                        localStorage.setItem(`youcontrol_tenant_${activationId}`, JSON.stringify(datosEmpresaConfig));
                        console.log("🔌 Empresa con Base de Datos Independiente detectada.");
                    }
                }

                // Referencias en la base de datos principal (Licencias y Empresas se quedan en la madre)
                const licenciaRef = doc(dbPrincipal, "licencias", activationId);
                const snapLicencia = await getDoc(licenciaRef);

                let equiposLicencia = [];
                let limiteLicencia = data.l || 1;

                if (snapLicencia.exists()) {
                    const dbData = snapLicencia.data();
                    equiposLicencia = Array.isArray(dbData.equipos) ? dbData.equipos : [];
                    limiteLicencia = dbData.limite || limiteLicencia;

                    if (!equiposLicencia.includes(hwID) && equiposLicencia.length >= limiteLicencia) {
                        return alert("Error: Límite de dispositivos alcanzado en la licencia.");
                    }

                    if (!equiposLicencia.includes(hwID)) {
                        equiposLicencia.push(hwID);
                        await updateDoc(licenciaRef, { equipos: equiposLicencia });
                    }
                } else {
                    equiposLicencia = [hwID];
                    await setDoc(licenciaRef, { 
                        cliente: data.n || "", 
                        limite: limiteLicencia, 
                        equipos: equiposLicencia, 
                        fecha_registro: new Date().toISOString() 
                    });
                }

                // Actualizar o crear en empresas_config principal
                if (snapEmpresaPrincipal.exists()) {
                    const dbEmpresa = snapEmpresaPrincipal.data();
                    const equiposEmpresa = Array.isArray(dbEmpresa.equipos) ? dbEmpresa.equipos : [];
                    if (!equiposEmpresa.includes(hwID)) {
                        await updateDoc(empresaRefPrincipal, { 
                            equipos: [...equiposEmpresa, hwID],
                            licencia_token: rawToken
                        });
                    }
                } else {
                    await setDoc(empresaRefPrincipal, { 
                        nombre: data.n || "",
                        rif: data.rif || "",
                        email: data.email || "",
                        telefono: data.tel || "",
                        direccion: data.dir || "",
                        logoUrl: data.logoUrl || "img/logo.png",
                        limite_equipos: limiteLicencia, 
                        equipos: [hwID], 
                        licencia_token: rawToken,
                        timestamp: new Date().toISOString() 
                    });
                }

                // Guardar credenciales locales de sesión
                localStorage.setItem('youcontrol_empresa_id', activationId);
                localStorage.setItem('licencia_validada', 'true');

                if (window.deferredPrompt) {
                    window.deferredPrompt.prompt();
                    await window.deferredPrompt.userChoice;
                    window.deferredPrompt = null;
                }

                window.location.replace('sys_v1_menu.html');
                
            } catch (e) {
                console.error("Error al procesar activación:", e);
                alert("Código de licencia inválido o error en la conexión con Firebase.");
            }
        }

        // Vincular el evento directamente al botón de manera segura una vez cargado el módulo
        document.getElementById('btnActivar').addEventListener('click', procesarActivacion);
    </script>
</body>
</html>
