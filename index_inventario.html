<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Control - Inventario Premium</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Urbanist:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Estilos de respaldo por si el CSS externo falla en cargar */
        body { background-color: #F4F7F6; margin: 0; font-family: 'Urbanist', sans-serif; }
        .header-app { background-color: #1A1A2E; color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .btn-primary { background-color: #007BFF; color: white; border: none; padding: 12px 25px; border-radius: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(0, 123, 255, 0.3); text-transform: uppercase; font-size: 13px; }
    </style>
</head>
<body oncontextmenu="return false">

    <header class="header-app">
        <h1><i class="fas fa-bolt" style="color: #007BFF;"></i> YOU CONTROL</h1>
        <div style="display: flex; align-items: center; gap: 20px;">
            <span style="font-weight: 600;"><i class="fas fa-user-shield"></i> Administrador</span>
            <button id="btn-logout" class="btn-primary" style="background: #B91C1C; box-shadow: none; padding: 8px 15px;">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <main class="container">
        
        <div class="table-card" style="display: flex; align-items: center; justify-content: space-between; border-left: 8px solid #007BFF; margin-bottom: 25px; background: white; padding: 20px; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
            <div>
                <p style="margin: 0; font-size: 13px; color: #64748b; font-weight: 700; text-transform: uppercase;">Monitor de Divisas</p>
                <div style="display: flex; align-items: baseline; gap: 10px;">
                    <span style="font-size: 24px; font-weight: 800; color: #1A1A2E;">1.00 $ = </span>
                    <span id="tasa-actual" style="font-size: 32px; font-weight: 800; color: #007BFF;">0.00</span>
                    <span style="font-size: 18px; font-weight: 700; color: #64748b;">Bs.</span>
                </div>
            </div>
            <button class="btn-primary" onclick="cambiarTasa()">
                <i class="fas fa-sync-alt"></i> ACTUALIZAR TASA
            </button>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 15px; flex-wrap: wrap;">
            <div class="input-group" style="flex: 1; min-width: 300px; margin-bottom: 0; background: white; border: 2px solid #E2E8F0; border-radius: 12px; padding: 10px 15px; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-search" style="color: #007BFF;"></i>
                <input type="text" id="busqueda" placeholder="Buscar producto por nombre..." style="border: none; outline: none; width: 100%; font-size: 16px;">
            </div>
            
            <button class="btn-primary" onclick="document.getElementById('modal-prod').style.display='flex'">
                <i class="fas fa-plus-circle"></i> AGREGAR PRODUCTO
            </button>
        </div>

        <div class="table-card" style="padding: 0; overflow: hidden; background: white; border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
            <table style="width: 100%; border-collapse: collapse;">
                <thead style="background: #F8FAFC;">
                    <tr>
                        <th style="padding: 18px; text-align: left; color: #1A1A2E;">PRODUCTO</th>
                        <th style="padding: 18px; text-align: left; color: #1A1A2E;">STOCK</th>
                        <th style="padding: 18px; text-align: left; color: #1A1A2E;">PRECIO ($)</th>
                        <th style="padding: 18px; text-align: left; color: #15803D;">PRECIO (BS.)</th>
                        <th style="padding: 18px; text-align: left; color: #1A1A2E;">ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="lista-productos">
                    </tbody>
            </table>
        </div>
    </main>

    <div id="modal-prod" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26,26,46,0.85); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000;">
        <div class="form-card" style="background: white; padding: 35px; border-radius: 24px; width: 450px; box-shadow: 0 25px 50px rgba(0,0,0,0.5);">
            <h2 style="font-family: 'Poppins'; margin: 0 0 25px 0; color: #1A1A2E;">Nuevo Artículo</h2>
            <form id="form-nuevo-producto">
                <div class="input-group" style="background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: 12px; padding: 12px 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-tag" style="color: #007BFF;"></i>
                    <input type="text" id="p-nombre" placeholder="Nombre del producto" required style="border: none; background: transparent; outline: none; width: 100%; font-size: 16px;">
                </div>
                <div class="input-group" style="background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: 12px; padding: 12px 15px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-boxes" style="color: #007BFF;"></i>
                    <input type="number" id="p-stock" placeholder="Cantidad Inicial" required style="border: none; background: transparent; outline: none; width: 100%; font-size: 16px;">
                </div>
                <div class="input-group" style="background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: 12px; padding: 12px 15px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-dollar-sign" style="color: #007BFF;"></i>
                    <input type="number" step="0.01" id="p-precio" placeholder="Precio de Venta ($)" required style="border: none; background: transparent; outline: none; width: 100%; font-size: 16px;">
                </div>
                
                <div style="display: flex; gap: 15px;">
                    <button type="submit" class="btn-primary" style="flex: 2;">GUARDAR EN NUBE</button>
                    <button type="button" class="btn-primary" style="flex: 1; background: #64748b; box-shadow: none;" onclick="document.getElementById('modal-prod').style.display='none'">CANCELAR</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/inventario.js"></script>

</body>
</html>
