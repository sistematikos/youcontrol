<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Control - Inventario Premium</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Refuerzo visual de integridad */
        .btn-primary[onclick*="prepararEdicion"] { transition: 0.2s; }
        .btn-primary[onclick*="prepararEdicion"]:hover { background-color: #000 !important; }
    </style>
</head>
<body oncontextmenu="return false">

    <header class="header-app">
        <h1><i class="fas fa-bolt" style="color: #007BFF;"></i> YOU CONTROL</h1>
        <div style="display: flex; align-items: center; gap: 20px;">
            <span style="font-weight: 600;"><i class="fas fa-user-shield"></i> Admin</span>
            <button id="btn-logout" class="btn-primary" style="background: #B91C1C; box-shadow: none; padding: 8px 15px;">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </header>

    <main class="container">
        <div class="table-card" style="display: flex; align-items: center; justify-content: space-between; border-left: 8px solid #007BFF;">
            <div>
                <p style="margin: 0; font-size: 13px; color: #64748b; font-weight: 700; text-transform: uppercase;">Tasa Cambiaria</p>
                <div style="display: flex; align-items: baseline; gap: 10px;">
                    <span style="font-size: 24px; font-weight: 800; color: #1A1A2E;">1.00 $ = </span>
                    <span id="tasa-actual" style="font-size: 32px; font-weight: 800; color: #007BFF;">0.00</span>
                    <span style="font-size: 18px; font-weight: 700; color: #64748b;">Bs.</span>
                </div>
            </div>
            <button class="btn-primary" onclick="cambiarTasa()">
                <i class="fas fa-sync-alt"></i> ACTUALIZAR TASA
            </button>
        </div>

        <div style="display: flex; justify-content: space-between; margin-bottom: 25px;">
            <div class="input-group" style="width: 400px; margin-bottom: 0;">
                <i class="fas fa-search"></i>
                <input type="text" id="busqueda" placeholder="Buscar producto...">
            </div>
            <button class="btn-primary" onclick="document.getElementById('modal-prod').style.display='flex'">
                <i class="fas fa-plus-circle"></i> AGREGAR PRODUCTO
            </button>
        </div>

        <div class="table-card" style="padding: 0; overflow: hidden;">
            <table>
                <thead>
                    <tr>
                        <th>PRODUCTO</th>
                        <th>STOCK</th>
                        <th>PRECIO ($)</th>
                        <th style="color: #15803D;">PRECIO (BS.)</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="lista-productos"></tbody>
            </table>
        </div>
    </main>

    <div id="modal-prod" class="modal-overlay">
        <div class="form-card">
            <h2 style="font-family: 'Poppins'; margin-bottom: 25px; color: #1A1A2E;">Nuevo Artículo</h2>
            <form id="form-nuevo-producto">
                <div class="input-group"><i class="fas fa-tag"></i><input type="text" id="p-nombre" placeholder="Nombre" required></div>
                <div class="input-group"><i class="fas fa-boxes"></i><input type="number" id="p-stock" placeholder="Stock" required></div>
                <div class="input-group"><i class="fas fa-dollar-sign"></i><input type="number" step="0.01" id="p-precio" placeholder="Precio ($)" required></div>
                
                <div style="display: flex; gap: 15px; margin-top: 20px;">
                    <button type="submit" class="btn-primary" style="flex: 2;">GUARDAR EN NUBE</button>
                    <button type="button" class="btn-primary" style="flex: 1; background: #64748b; box-shadow: none;" onclick="cerrarModal()">CANCELAR</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/inventario.js"></script>
</body>
</html>
