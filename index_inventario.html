<div class="table-card" style="margin-bottom: 25px; padding: 20px; display: flex; align-items: center; justify-content: space-between; border-left: 8px solid var(--electric); background: #fff;">
    <div>
        <p style="margin: 0; font-size: 14px; color: var(--text); font-weight: 600; text-transform: uppercase;">Monitor de Divisas</p>
        <div style="display: flex; align-items: baseline; gap: 10px;">
            <span style="font-size: 28px; font-weight: 800; color: var(--navy);">1.00 $ = </span>
            <span id="tasa-actual" style="font-size: 32px; font-weight: 800; color: var(--electric);">0.00</span>
            <span style="font-size: 20px; font-weight: 700; color: var(--text);">Bs.</span>
        </div>
    </div>
    <button class="btn-primary" onclick="cambiarTasa()">
        <i class="fas fa-sync-alt"></i> ACTUALIZAR TASA
    </button>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <div class="input-group" style="width: 400px; margin-bottom: 0;">
        <i class="fas fa-search" style="color: var(--electric);"></i>
        <input type="text" id="busqueda" placeholder="Filtrar productos...">
    </div>
    <button class="btn-primary" onclick="document.getElementById('modal-prod').style.display='flex'">
        <i class="fas fa-plus-circle"></i> NUEVO PRODUCTO
    </button>
</div>

<div class="table-card">
    <table>
        <thead>
            <tr>
                <th>PRODUCTO</th>
                <th>STOCK</th>
                <th>PRECIO ($)</th>
                <th style="color: #15803D;">PRECIO (BS.)</th>
                <th>ACCIONES</th>
            </tr>
        </thead>
        <tbody id="lista-productos"></tbody>
    </table>
</div>
