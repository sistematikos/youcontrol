<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Control - Inventario</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header-app">
        <h2><i class="fas fa-warehouse"></i> Inventario</h2>
        <button id="btn-logout" class="btn-logout"><i class="fas fa-power-off"></i></button>
    </header>

    <main class="container">
        <div class="actions">
            <button class="btn-add" onclick="document.getElementById('modal').style.display='flex'">
                + Nuevo Producto
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Stock</th>
                        <th>Precio</th>
                    </tr>
                </thead>
                <tbody id="tabla-body"></tbody>
            </table>
        </div>
    </main>

    <div id="modal" class="modal">
        <div class="form-card">
            <h3>Nuevo Producto</h3>
            <form id="form-inv">
                <input type="text" id="nom" placeholder="Nombre" required>
                <input type="number" id="cant" placeholder="Cantidad" required>
                <input type="number" step="0.01" id="pre" placeholder="Precio" required>
                <button type="submit" class="btn-login">Guardar</button>
                <button type="button" onclick="document.getElementById('modal').style.display='none'">Cerrar</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/inventario.js"></script>
</body>
</html>
