<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Control - Gestión Premium</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body oncontextmenu="return false">

    <header class="header-app">
        <h1><i class="fas fa-bolt"></i> YOU CONTROL</h1>
        <div style="display: flex; align-items: center; gap: 20px;">
            <span style="font-weight: 600;"><i class="fas fa-user-circle"></i> Admin</span>
            <button id="btn-logout" class="btn-primary" style="padding: 8px 15px; background: #B91C1C; box-shadow: none;">
                <i class="fas fa-power-off"></i>
            </button>
        </div>
    </header>

    <main class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div class="input-group" style="width: 400px; margin-bottom: 0;">
                <i class="fas fa-search" style="color: var(--electric);"></i>
                <input type="text" id="busqueda" placeholder="Buscar en inventario...">
            </div>
            
            <button class="btn-primary" onclick="document.getElementById('modal-prod').style.display='flex'">
                <i class="fas fa-plus-circle"></i> NUEVO PRODUCTO
            </button>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>PRODUCTO</th>
                        <th>STOCK</th>
                        <th>PRECIO (REF)</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="lista-productos">
                    </tbody>
            </table>
        </div>
    </main>

    <div id="modal-prod" class="modal-overlay">
        <div class="form-card">
            <h2 style="font-family: 'Poppins'; margin-top: 0; color: var(--navy);">Nuevo Artículo</h2>
            <form id="form-nuevo-producto">
                <div class="input-group">
                    <i class="fas fa-tag"></i>
                    <input type="text" id="p-nombre" placeholder="Nombre del producto" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-layer-group"></i>
                    <input type="number" id="p-stock" placeholder="Cantidad Inicial" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-dollar-sign"></i>
                    <input type="number" step="0.01" id="p-precio" placeholder="Precio de Venta" required>
                </div>
                
                <div style="display: flex; gap: 15px; margin-top: 25px;">
                    <button type="submit" class="btn-primary" style="flex: 2;">GUARDAR EN NUBE</button>
                    <button type="button" class="btn-primary" style="flex: 1; background: var(--text); box-shadow: none;" 
                            onclick="document.getElementById('modal-prod').style.display='none'">CANCELAR</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/inventario.js"></script>
</body>
</html>
