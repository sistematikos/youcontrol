<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROVEEDORES | YOU CONTROL</title>
    <!-- Tailwind CSS y FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen font-sans">

    <!-- Encabezado -->
    <div class="p-4 bg-white shadow-sm flex justify-between items-center px-8 border-b border-slate-200">
        <div class="flex items-center space-x-4">
            <button onclick="window.history.back()" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg font-bold text-slate-700 text-sm transition">
                <i class="fa-solid fa-arrow-left mr-2"></i>VOLVER
            </button>
            <h1 class="text-xl font-bold text-slate-800">Gestión de Proveedores</h1>
        </div>
        <div class="flex items-center space-x-2">
            <span class="text-xs font-bold text-blue-900 tracking-wider">YOU CONTROL</span>
        </div>
    </div>

    <!-- Contenedor Principal -->
    <div class="p-6 max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-6">

        <!-- Formulario (Ficha Proveedor) -->
        <div class="md:col-span-5 bg-white p-6 rounded-xl shadow-md border-t-4 border-amber-500">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                <i class="fa-solid fa-truck mr-2 text-amber-500"></i>Ficha Proveedor
            </h2>

            <form id="form-proveedor" onsubmit="guardarProveedor(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Código del Proveedor</label>
                    <input type="text" id="prov-codigo" required placeholder="Ej: BENF" 
                        class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold uppercase focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    <span id="prov-estado-codigo" class="text-xs font-bold text-rose-500 mt-1 block"></span>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Razón Social / Nombre</label>
                    <input type="text" id="prov-nombre" required placeholder="Nombre de la empresa" 
                        class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold uppercase focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">RIF / Identificación Fiscal</label>
                    <input type="text" id="prov-rif" placeholder="Ej: J-12345678-0" 
                        class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold uppercase focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Contacto / Persona Enlace</label>
                    <input type="text" id="prov-contacto" placeholder="Nombre del contacto" 
                        class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold uppercase focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Teléfono</label>
                    <input type="text" id="prov-telefono" placeholder="Ej: 0424-1234567" 
                        class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Dirección</label>
                    <textarea id="prov-direccion" rows="2" placeholder="Ciudad / Estado / Dirección" 
                        class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm font-semibold uppercase focus:ring-2 focus:ring-amber-500 focus:outline-none"></textarea>
                </div>

                <div class="pt-2 flex space-x-2">
                    <button type="submit" id="btn-guardar" 
                        class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-lg text-sm tracking-wide shadow-md transition duration-200">
                        GUARDAR PROVEEDOR
                    </button>
                    <button type="button" onclick="limpiarFormulario()" 
                        class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-4 rounded-lg text-sm transition">
                        LIMPIAR
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabla / Listado de Proveedores -->
        <div class="md:col-span-7 bg-white p-6 rounded-xl shadow-md border-t-4 border-emerald-500">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                <i class="fa-solid fa-list-check mr-2 text-emerald-500"></i>Listado de Proveedores
            </h2>

            <!-- Búsqueda -->
            <div class="mb-4">
                <input type="text" id="prov-buscar" oninput="filtrarProveedores()" placeholder="Buscar por código, nombre o RIF..." 
                    class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <!-- Tabla -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase font-bold border-b border-slate-200">
                            <th class="p-2.5">Código</th>
                            <th class="p-2.5">Proveedor / Razón Social</th>
                            <th class="p-2.5">RIF</th>
                            <th class="p-2.5">Teléfono</th>
                            <th class="p-2.5 text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-proveedores-body" class="divide-y divide-slate-100 text-slate-700 font-medium">
                        <tr>
                            <td colspan="5" class="text-center py-6 text-slate-400">Cargando proveedores...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- MÓDULO FIREBASE JS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            deleteDoc, 
            collection, 
            onSnapshot, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración apuntando al proyecto youcontrol-1d60a
        const firebaseConfig = {
            apiKey: "AIzaSy...", // Reemplaza con tu apiKey real si es necesario
            authDomain: "youcontrol-1d60a.firebaseapp.com",
            projectId: "youcontrol-1d60a",
            storageBucket: "youcontrol-1d60a.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abc123def456"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let listaProveedores = [];

        // Obtener ID de la Licencia
        function obtenerLicencia() {
            return localStorage.getItem('youcontrol_empresa_id');
        }

        // Cargar Proveedores en Tiempo Real
        function escucharProveedores() {
            const ID_LICENCIA = obtenerLicencia();
            if (!ID_LICENCIA) {
                console.warn("No hay ID_LICENCIA en localStorage aún.");
                return;
            }

            // Ruta: usuarios / {ID_LICENCIA} / proveedores
            const refColeccion = collection(db, "usuarios", ID_LICENCIA, "proveedores");

            onSnapshot(refColeccion, (snapshot) => {
                listaProveedores = [];
                snapshot.forEach((docSnap) => {
                    listaProveedores.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderizarTabla(listaProveedores);
            }, (error) => {
                console.error("Error al escuchar proveedores:", error);
            });
        }

        // Renderizar datos en la tabla
        function renderizarTabla(datos) {
            const tbody = document.getElementById('tabla-proveedores-body');
            tbody.innerHTML = '';

            if (datos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">No hay proveedores registrados.</td></tr>`;
                return;
            }

            datos.forEach((prov) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-2.5 font-bold text-slate-800">${prov.codigo || prov.id}</td>
                    <td class="p-2.5 uppercase">${prov.nombre || '-'}</td>
                    <td class="p-2.5 uppercase">${prov.rif || '-'}</td>
                    <td class="p-2.5">${prov.telefono || '-'}</td>
                    <td class="p-2.5 text-center space-x-1">
                        <button onclick="cargarParaEditar('${prov.id}')" class="px-2 py-1 bg-amber-100 text-amber-700 rounded hover:bg-amber-200 text-xs font-bold" title="Editar">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button onclick="eliminarProveedor('${prov.id}')" class="px-2 py-1 bg-rose-100 text-rose-700 rounded hover:bg-rose-200 text-xs font-bold" title="Eliminar">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Guardar o Actualizar Proveedor
        window.guardarProveedor = async function(e) {
            e.preventDefault();

            const ID_LICENCIA = obtenerLicencia();
            if (!ID_LICENCIA) {
                alert("Error: No se encontró la licencia en localStorage ('youcontrol_empresa_id').");
                return;
            }

            const codigo = document.getElementById('prov-codigo').value.trim().toUpperCase();
            const nombre = document.getElementById('prov-nombre').value.trim().toUpperCase();
            const rif = document.getElementById('prov-rif').value.trim().toUpperCase();
            const contacto = document.getElementById('prov-contacto').value.trim().toUpperCase();
            const telefono = document.getElementById('prov-telefono').value.trim();
            const direccion = document.getElementById('prov-direccion').value.trim().toUpperCase();

            if (!codigo || !nombre) {
                alert("El Código y el Nombre/Razón Social son requeridos.");
                return;
            }

            const btnGuardar = document.getElementById('btn-guardar');
            btnGuardar.disabled = true;
            btnGuardar.innerText = "GUARDANDO...";

            try {
                // Referencia a: usuarios/{ID_LICENCIA}/proveedores/{codigo}
                const refDoc = doc(db, "usuarios", ID_LICENCIA, "proveedores", codigo);

                await setDoc(refDoc, {
                    codigo: codigo,
                    nombre: nombre,
                    rif: rif,
                    contacto: contacto,
                    telefono: telefono,
                    direccion: direccion,
                    updatedAt: serverTimestamp()
                }, { merge: true });

                alert("✅ Proveedor guardado con éxito.");
                limpiarFormulario();
            } catch (error) {
                console.error("Error al guardar proveedor:", error);
                alert("❌ Error de permisos o guardado: " + error.message);
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.innerText = "GUARDAR PROVEEDOR";
            }
        };

        // Editar
        window.cargarParaEditar = function(codigo) {
            const prov = listaProveedores.find(p => p.id === codigo || p.codigo === codigo);
            if (!prov) return;

            document.getElementById('prov-codigo').value = prov.codigo || prov.id;
            document.getElementById('prov-codigo').readOnly = true;
            document.getElementById('prov-nombre').value = prov.nombre || '';
            document.getElementById('prov-rif').value = prov.rif || '';
            document.getElementById('prov-contacto').value = prov.contacto || '';
            document.getElementById('prov-telefono').value = prov.telefono || '';
            document.getElementById('prov-direccion').value = prov.direccion || '';

            document.getElementById('prov-estado-codigo').innerText = "(Modo Edición - Código bloqueado)";
        };

        // Eliminar
        window.eliminarProveedor = async function(codigo) {
            if (!confirm(`¿Desea eliminar el proveedor ${codigo}?`)) return;

            const ID_LICENCIA = obtenerLicencia();
            try {
                const refDoc = doc(db, "usuarios", ID_LICENCIA, "proveedores", codigo);
                await deleteDoc(refDoc);
                alert("🗑️ Proveedor eliminado.");
            } catch (error) {
                console.error("Error al eliminar proveedor:", error);
                alert("❌ Error: " + error.message);
            }
        };

        // Filtrar
        window.filtrarProveedores = function() {
            const q = document.getElementById('prov-buscar').value.toLowerCase().trim();
            const filtrados = listaProveedores.filter(p => 
                (p.codigo && p.codigo.toLowerCase().includes(q)) ||
                (p.nombre && p.nombre.toLowerCase().includes(q)) ||
                (p.rif && p.rif.toLowerCase().includes(q))
            );
            renderizarTabla(filtrados);
        };

        // Limpiar
        window.limpiarFormulario = function() {
            document.getElementById('form-proveedor').reset();
            document.getElementById('prov-codigo').readOnly = false;
            document.getElementById('prov-estado-codigo').innerText = "";
        };

        // Iniciar al cargar
        escucharProveedores();
    </script>
</body>
</html>
