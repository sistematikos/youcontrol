<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Control - Punto de Ventas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --royal-blue: #0056FF; 
            --deep-navy: #001529; 
            --vibrant-gradient: linear-gradient(135deg, #0056FF 0%, #001529 100%);
            --bg-main: #F1F5F9;
        }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg-main); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Header */
        .header-sales { background: var(--vibrant-gradient); color: white; padding: 14px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--royal-blue); }
        
        /* Shortcuts */
        .shortcuts-container { display: flex; justify-content: center; gap: 12px; padding: 12px; background: white; border-bottom: 1px solid #E2E8F0; }
        .key-pill { background: #F8FAFC; border: 1px solid #E2E8F0; padding: 6px 16px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .key-pill b { background: var(--deep-navy); color: white; padding: 2px 8px; border-radius: 8px; font-size: 0.7rem; }

        /* Main POS */
        .pos-container { display: flex; flex: 1; gap: 20px; padding: 20px; overflow: hidden; }
        .panel-left, .panel-cart { background: white; border-radius: 25px; display: flex; flex-direction: column; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        .panel-left { flex: 1.5; }
        .panel-cart { flex: 1; border-top: 8px solid var(--royal-blue); }

        /* Modal de Pago */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 21, 41, 0.9); backdrop-filter: blur(8px); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 32px; width: 90%; max-width: 480px; text-align: center; }
        
        /* Grid de Botones de Pago */
        .grid-metodos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .btn-metodo { border: 2px solid #F1F5F9; background: #F8FAFC; padding: 12px 5px; border-radius: 15px; cursor: pointer; font-weight: 700; font-size: 0.65rem; color: #64748B; transition: 0.2s; }
        .btn-metodo:hover { border-color: var(--royal-blue); color: var(--royal-blue); }
        .btn-metodo i { display: block; font-size: 1.2rem; margin-bottom: 5px; }

        .input-pago-group { display: flex; align-items: center; background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: 15px; padding: 8px 18px; margin-bottom: 8px; }
        .input-pago-group label { font-size: 0.65rem; font-weight: 800; color: #94A3B8; width: 100px; text-align: left; cursor: pointer; }
        .input-pago-group input { border: none; background: transparent; outline: none; width: 100%; font-size: 1.3rem; font-weight: 700; text-align: right; color: var(--deep-navy); }

        .status-badge { padding: 15px; border-radius: 15px; font-weight: 800; margin: 15px 0; font-size: 0.9rem; }
        .status-pending { background: #FFF7ED; color: #C2410C; border: 1px solid #FFEDD5; }
        .status-complete { background: #F0FDF4; color: #15803D; border: 1px solid #DCFCE7; }

        .btn-pay { border: none; border-radius: 20px; background: var(--vibrant-gradient); color: white; font-weight: 800; cursor: pointer; padding: 18px; width: 100%; font-size: 1.1rem; }
        .btn-pay:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body>

    <header class="header-sales">
        <div style="font-weight: 800; letter-spacing: 1px;">YOU CONTROL | SISTEMATIKOS</div>
        <div class="tasa-badge">BCV: <span id="txt-tasa">0,00</span> Bs.</div>
    </header>

    <div class="shortcuts-container">
        <div class="key-pill"><b>F4</b> CANTIDAD</div>
        <div class="key-pill"><b>F5</b> PRECIO</div>
        <div class="key-pill"><b>F6</b> ELIMINAR</div>
        <div class="key-pill" style="background: var(--royal-blue); color: white;"><b>F9</b> COBRAR</div>
    </div>

    <div class="pos-container">
        <div class="panel-left">
            <input type="text" id="inputBusqueda" style="width:100%; padding:15px; border-radius:15px; border:2px solid #E2E8F0;" placeholder="Buscar producto...">
            <div id="grid-productos" style="flex: 1; overflow-y: auto; margin-top: 20px;"></div>
        </div>

        <div class="panel-cart">
            <div id="lista-carrito" style="flex: 1; overflow-y: auto; margin-top: 10px;"></div>
            <div style="background:#F8FAFC; padding:25px; border-radius:22px; text-align:center; border:2px solid #E2E8F0; margin-bottom:15px;">
                <span id="total-usd" style="font-size:2.8rem; font-weight:800; display:block; color: var(--deep-navy);">$ 0.00</span>
                <span id="total-bs" style="font-size:1.2rem; font-weight:600; color: var(--royal-blue);">0,00 Bs.</span>
            </div>
            <button id="btnCobrar" class="btn-pay">PROCESAR PAGO [F9]</button>
        </div>
    </div>

    <!-- MODAL DE PAGO INTEGRADO -->
    <div id="modalPago" class="modal">
        <div class="modal-content">
            <div style="background: var(--deep-navy); color: white; padding: 25px; border-radius: 20px; margin-bottom: 20px;">
                <small style="opacity: 0.7;">TOTAL VENTA</small>
                <div id="totalModalUSD" style="font-size: 3rem; font-weight: 800;">$ 0.00</div>
                <div id="totalModalBS" style="font-size: 1.2rem; opacity: 0.8;">0,00 Bs</div>
            </div>

            <div class="grid-metodos">
                <div class="btn-metodo" onclick="window.ui.autoCompletar('punto')"><i class="fas fa-credit-card"></i>PUNTO</div>
                <div class="btn-metodo" onclick="window.ui.autoCompletar('pagomovil')"><i class="fas fa-mobile-alt"></i>P. MÓVIL</div>
                <div class="btn-metodo" onclick="window.ui.autoCompletar('efectivo')"><i class="fas fa-money-bill-wave"></i>EFEC. BS</div>
                <div class="btn-metodo" onclick="window.ui.autoCompletar('divisas')" style="background: #EBF4FF; color: var(--royal-blue);"><i class="fas fa-dollar-sign"></i>DIVISAS</div>
            </div>

            <div class="input-pago-group">
                <label onclick="window.ui.autoCompletar('punto')">PUNTO BS</label>
                <input type="number" id="in-punto-bs" value="0" step="0.01" onclick="this.select()">
            </div>
            <div class="input-pago-group">
                <label onclick="window.ui.autoCompletar('pagomovil')">P.MOVIL BS</label>
                <input type="number" id="in-pagomovil-bs" value="0" step="0.01" onclick="this.select()">
            </div>
            <div class="input-pago-group">
                <label onclick="window.ui.autoCompletar('efectivo')">EFEC. BS</label>
                <input type="number" id="in-efectivo-bs" value="0" step="0.01" onclick="this.select()">
            </div>
            <div class="input-pago-group" style="border-color: var(--royal-blue);">
                <label onclick="window.ui.autoCompletar('divisas')" style="color:var(--royal-blue);">DIVISAS $</label>
                <input type="number" id="in-divisas-usd" value="0" step="0.01" onclick="this.select()">
            </div>

            <div id="pago-status" class="status-badge status-pending">PENDIENTE: $ 0.00</div>

            <button id="btnConfirmarVenta" class="btn-pay" disabled>CONFIRMAR VENTA</button>
            <p onclick="document.getElementById('modalPago').style.display='none'" style="margin-top:20px; cursor:pointer; color:#94A3B8; font-weight:600;">Regresar al Carrito</p>
        </div>
    </div>

    <script type="module" src="./js/pos-core.js"></script>
</body>
</html>
