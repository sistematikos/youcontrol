<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU CONTROL - Punto de Ventas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #006aff; --bg-main: #f8fafc; --text-dark: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-dark); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .navbar { background-color: var(--primary-color); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .main-layout { flex: 1; display: flex; overflow: hidden; padding: 15px; gap: 15px; }
        .left-panel { flex: 1.2; display: flex; flex-direction: column; gap: 15px; }
        
        /* ESTILOS DE BUSCADOR Y LISTA */
        .search-box-container { background: white; padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); }
        .resultados-flotantes { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 2px solid var(--primary-color); border-radius: 8px; z-index: 99999; display: none; margin-top: 5px; max-height: 220px; overflow-y: auto; }
        
        /* ESTILO PARA EL TECLADO */
        .resultado-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; }
        .resultado-item.seleccionado { background-color: var(--primary-color); color: white; }
        
        .right-panel { flex: 1.8; background: white; border-radius: 10px; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .cart-items-container { flex: 1; overflow-y: auto; padding: 10px; }
        .totals-section { background: #f8fafc; padding: 20px; text-align: center; border-top: 1px solid var(--border-color); }
        .btn-pay-action { width: 100%; background: var(--primary-color); color: white; border: none; padding: 16px; cursor: pointer; font-weight: 700; }
    </style>
</head>
<body>

    <header class="navbar">
        <div>YOU CONTROL - PUNTO DE VENTAS</div>
    </header>

    <main class="main-layout">
        <section class="left-panel">
            <div class="search-box-container">
                <div style="position:relative;">
                    <input type="text" id="buscar-producto-pos" placeholder="Escriba artículo o código (F2)..." style="width:100%; padding:10px;" oninput="window.renderizarResultadosProducto(window.buscarProducto(this.value))">
                    <div class="resultados-flotantes" id="resultados-producto-pos"></div>
                </div>
            </div>
            <div class="grid-productos-view" id="grid-productos"></div>
        </section>

        <section class="right-panel">
            <div class="cart-items-container" id="lista-carrito"></div>
            <div class="totals-section">
                <h2 id="total-usd">$ 0.00</h2>
                <button class="btn-pay-action" onclick="window.abrirModalCobro()">PAGAR [F9]</button>
            </div>
        </section>
    </main>

    <script>
        let indiceSeleccion = -1;

        // Función para renderizar y habilitar navegación
        window.renderizarResultadosProducto = (lista) => {
            const div = document.getElementById('resultados-producto-pos');
            indiceSeleccion = -1;
            if (lista.length === 0) { div.style.display = 'none'; return; }
            
            div.innerHTML = lista.map((p, i) => `
                <div class="resultado-item" onclick="window.agregarCarrito('${p.id}'); document.getElementById('resultados-producto-pos').style.display='none'">
                    <b>${p.nombre}</b> - $${p.precio_venta}
                </div>
            `).join('');
            div.style.display = 'block';
        };

        // Lógica de flechas y Enter
        document.getElementById('buscar-producto-pos').addEventListener('keydown', (e) => {
            const items = document.querySelectorAll('.resultado-item');
            if (!items.length) return;

            if (e.key === 'ArrowDown') {
                if (indiceSeleccion < items.length - 1) indiceSeleccion++;
                actualizarFoco(items);
            } else if (e.key === 'ArrowUp') {
                if (indiceSeleccion > 0) indiceSeleccion--;
                actualizarFoco(items);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (indiceSeleccion > -1) items[indiceSeleccion].click();
            }
        });

        function actualizarFoco(items) {
            items.forEach((el, i) => el.classList.toggle('seleccionado', i === indiceSeleccion));
        }
    </script>
    <script type="module" src="js/pos-core.js"></script>
</body>
</html>
