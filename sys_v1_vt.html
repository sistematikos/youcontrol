<style>
    /* Estilos para los selectores de pago */
    .payment-methods {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 15px;
    }
    .pay-method-btn {
        background: #F1F5F9;
        border: 2px solid transparent;
        padding: 10px;
        border-radius: 12px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 700;
        color: #64748B;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }
    .pay-method-btn.active {
        background: #EFF6FF;
        border-color: var(--blue);
        color: var(--blue);
    }
    .pay-method-btn i { font-size: 1rem; }
</style>

<body oncontextmenu="return false">

    <div class="pos-container">
        <div class="panel-search">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="inputBusqueda" class="search-input" placeholder="¿Qué vamos a vender hoy?" onkeyup="filtrarVenta()" autofocus>
            </div>
            <div id="grid-productos" class="product-grid"></div>
        </div>

        <div class="panel-cart">
            <h3 style="margin:0 0 15px 0; color:var(--dark); font-weight: 800;">RESUMEN</h3>
            <div id="lista-carrito" class="cart-list"></div>

            <div class="checkout-area">
                <div style="margin-bottom: 10px;">
                    <span style="font-size: 0.75rem; font-weight: 800; color: #94A3B8; text-transform: uppercase;">Método de Pago:</span>
                </div>
                <div class="payment-methods">
                    <div class="pay-method-btn active" onclick="setPago('Divisas', this)">
                        <i class="fas fa-dollar-sign"></i> Divisas
                    </div>
                    <div class="pay-method-btn" onclick="setPago('Bolivares', this)">
                        <i class="fas fa-money-bill-wave"></i> Bolívares
                    </div>
                    <div class="pay-method-btn" onclick="setPago('Punto', this)">
                        <i class="fas fa-credit-card"></i> Punto
                    </div>
                    <div class="pay-method-btn" onclick="setPago('Pago Movil', this)">
                        <i class="fas fa-mobile-alt"></i> P. Móvil
                    </div>
                </div>

                <div class="big-total-card">
                    <span style="color:#94A3B8; font-size: 0.8rem; font-weight: 600; text-transform: uppercase;">Monto Total</span>
                    <span id="total-usd" class="val-usd">$ 0.00</span>
                    <span id="total-bs" class="val-bs">0.00 Bs.</span>
                </div>
                <button id="btnVender" class="btn-pay" onclick="procesarVenta()" disabled>
                    <i class="fas fa-wallet"></i> COMPLETAR COBRO
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        // ... (Importaciones de Firebase iguales) ...
        
        let metodoSeleccionado = "Divisas"; // Valor por defecto

        // Función para cambiar visualmente el botón seleccionado
        window.setPago = (metodo, elemento) => {
            metodoSeleccionado = metodo;
            document.querySelectorAll('.pay-method-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
        };

        // ... (Cargar Inventario y Renderizar igual) ...

        window.procesarVenta = async () => {
            const btn = document.getElementById('btnVender');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> PROCESANDO...';
            
            try {
                const totalUSD = carrito.reduce((s, i) => s + (i.precio * i.cantidad), 0);
                
                // GUARDAR VENTA CON EL MÉTODO DE PAGO
                await addDoc(collection(db, "usuarios", UID, "ventas"), {
                    fecha: new Date().toLocaleString(),
                    timestamp: Date.now(),
                    items: carrito,
                    totalUSD: totalUSD,
                    totalBS: totalUSD * tasaActual,
                    tasa: tasaActual,
                    metodoPago: metodoSeleccionado // <--- AQUÍ SE GUARDA PARA EL CUADRE
                });

                // Descontar inventario
                for (let item of carrito) {
                    await updateDoc(doc(db, "usuarios", UID, "productos", item.id), { stock: increment(-item.cantidad) });
                }

                alert("Venta Registrada como: " + metodoSeleccionado);
                carrito = [];
                actualizarUI();
            } catch (e) { 
                alert("Error en el registro"); 
            } finally { 
                btn.disabled = false; 
                btn.innerHTML = '<i class="fas fa-wallet"></i> COMPLETAR COBRO';
            }
        };
        
        // ... (Resto de funciones: sumarAlCarrito, actualizarUI, etc.) ...
    </script>
</body>
