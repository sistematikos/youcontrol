<!-- Dentro del modalPago en sys_v1_vt.html -->
<div id="modalPago" class="modal">
    <div class="modal-content">
        <h2>Confirmar Pago</h2>
        <div id="totalModal" style="font-size: 2.5rem; font-weight: 800; margin: 20px 0;">$0.00</div>
        
        <!-- Botones de Método de Pago corregidos -->
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px;">
            <button id="btn-metodo-pv" class="btn-action-metodo" onclick="seleccionarMetodo('Punto de Venta', this)">
                <i class="fas fa-credit-card"></i> PUNTO VENTAS
            </button>
            <button id="btn-metodo-pm" class="btn-action-metodo" onclick="seleccionarMetodo('Pago Movil', this)">
                <i class="fas fa-mobile-alt"></i> PAGO MOVIL
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:25px;">
                <button id="btn-metodo-div" class="btn-action-metodo" onclick="seleccionarMetodo('Divisas', this)">
                    <i class="fas fa-dollar-sign"></i> DIVISAS
                </button>
                <button id="btn-metodo-bs" class="btn-action-metodo" onclick="seleccionarMetodo('Efectivo Bs', this)">
                    <i class="fas fa-money-bill-wave"></i> EFECTIVO BS
                </button>
            </div>
        </div>

        <button id="btnConfirmarVenta" class="btn-pay" style="width:100%;">REGISTRAR VENTA</button>
        <p id="btnCerrarModal" style="margin-top:20px; cursor:pointer; color:#94A3B8;">Regresar</p>
    </div>
</div>

<style>
    /* Estilo para resaltar el botón seleccionado */
    .btn-action-metodo {
        border: 2px solid var(--border-color);
        background: #F8FAFC;
        padding: 15px 10px;
        border-radius: 15px;
        color: var(--action-grey);
        font-weight: 700;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        transition: 0.3s;
    }
    .btn-action-metodo.active {
        background: var(--midnight-dark);
        color: white;
        border-color: var(--electric-blue);
    }
</style>
