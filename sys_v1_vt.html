<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Control - Punto de Ventas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --midnight-dark: #001A3D; 
            --midnight-gradient: linear-gradient(135deg, #002D72 0%, #001A3D 100%);
            --electric-blue: #0052D4;
            --bg-body: #F1F5F9; 
            --white: #FFFFFF;
            --border-color: #E2E8F0;
        }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg-body); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header-sales { background: var(--midnight-gradient); color: white; padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header-brand { font-weight: 800; letter-spacing: 1px; font-size: 1.2rem; }
        .tasa-badge { background: rgba(255, 255, 255, 0.1); padding: 6px 15px; border-radius: 8px; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); font-size: 0.9rem; }
        
        .shortcuts-container { display: flex; justify-content: center; gap: 10px; padding: 10px; background: #FFFFFF; border-bottom: 1px solid var(--border-color); }
        .key-pill { background: #F1F5F9; border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: 700; color: var(--midnight-dark); display: flex; align-items: center; gap: 5px; }
        .key-pill b { background: var(--midnight-dark); color: white; padding: 1px 6px; border-radius: 4px; font-size: 0.65rem; }

        .pos-container { display: flex; flex: 1; gap: 15px; padding: 15px; overflow: hidden; }
        .panel-left, .panel-cart { background: var(--white); border-radius: 20px; display: flex; flex-direction: column; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .panel-left { flex: 1.5; }
        .panel-cart { flex: 1; border-top: 6px solid var(--midnight-dark); }

        .product-grid, .cart-list { flex: 1; overflow-y: auto; margin-top: 15px; }

        /* OPTIMIZACIÓN A UNA SOLA LÍNEA POR PRODUCTO */
        .product-card { 
            display: grid; 
            grid-template-columns: 1fr 80px 80px 30px; 
            align-items: center; 
            padding: 8px 12px; 
            border-bottom: 1px solid #F1F5F9; 
            cursor: pointer; 
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
        }
        .product-card span { overflow: hidden; text-overflow: ellipsis; }
        .item-selected { background: #EBF4FF !important; border-left: 4px solid var(--electric-blue); }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,13,26,0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 25px; width: 90%; max-width: 450px; text-align: center; }

        .input-pago-group { display: flex; align-items: center; background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: 12px; padding: 8px 15px; margin-bottom: 8px; }
        .input-pago-group input { border: none; background: transparent; outline: none; width: 100%; font-size: 1.2rem; font-weight: 700; text-align: right; }
        
        .btn-pay { border: none; border-radius: 15px; background: var(--midnight-gradient); color: white; font-weight: 800; cursor: pointer; padding: 15px; width: 100%; }
        .btn-pay:disabled { opacity: 0.3; }
    </style>
</head>
<body oncontextmenu="return false">
    <header class="header-sales">
        <div class="header-brand">YOU CONTROL - PUNTO DE VENTAS</div>
        <div class="tasa-badge">TASA: <span id="txt-tasa">0,00</span> Bs.</div>
    </header>

    <div class="shortcuts-container">
        <div class="key-pill"><b>F4</b> CANTIDAD</div>
        <div class="key-pill"><b>F5</b> PRECIO</div>
        <div class="key-pill"><b>F6</b> ELIMINAR</div>
        <div class="key-pill" style="background: var(--midnight-dark); color: white;"><b>F9</b> COBRAR</div>
    </div>

    <div class="pos-container">
        <div class="panel-left">
            <input type="text" id="inputBusqueda" style="width:100%; padding:12px; border-radius:10px; border:1px solid var(--border-color);" placeholder="Buscar artículo...">
            <div id="grid-productos" class="product-grid"></div>
        </div>

        <div class="panel-cart">
            <div id="lista-carrito" class="cart-list"></div>
            <div style="background:#F8FAFC; padding:15px; border-radius:15px; text-align:center; border:1px solid var(--border-color); margin-bottom:10px;">
                <span id="total-usd" style="font-size:2rem; font-weight:800; color: var(--midnight-dark);">$ 0.00</span>
                <span id="total-bs" style="font-size:1rem; opacity:0.7; display:block;">0,00 Bs.</span>
            </div>
            <button id="btnCobrar" class="btn-pay">COBRAR [F9]</button>
        </div>
    </div>

    <div id="modalPago" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">Confirmar Pago</h3>
            <div style="background: var(--midnight-dark); color: white; padding: 20px; border-radius: 15px; margin-bottom: 15px;">
                <div id="totalModalUSD" style="font-size: 2.5rem; font-weight: 800;">$ 0.00</div>
                <div id="totalModalBS" style="font-size: 1.1rem; opacity: 0.8;">0,00 Bs.</div>
            </div>
            <div class="input-pago-group"><label style="font-size:0.6rem; width:90px; text-align:left;">PUNTO BS</label><input type="number" id="in-punto-bs" value="0" step="0.01" oninput="calcularRestante()"></div>
            <div class="input-pago-group"><label style="font-size:0.6rem; width:90px; text-align:left;">P.MOVIL BS</label><input type="number" id="in-pagomovil-bs" value="0" step="0.01" oninput="calcularRestante()"></div>
            <div class="input-pago-group"><label style="font-size:0.6rem; width:90px; text-align:left;">EFEC. BS</label><input type="number" id="in-efectivo-bs" value="0" step="0.01" oninput="calcularRestante()"></div>
            <div class="input-pago-group" style="border-color: var(--electric-blue);"><label style="font-size:0.6rem; width:90px; text-align:left; color:var(--electric-blue);">DIVISAS $</label><input type="number" id="in-divisas-usd" value="0" step="0.01" oninput="calcularRestante()"></div>
            <div id="pago-status" style="padding:10px; border-radius:10px; font-weight:700; margin-bottom:15px;"></div>
            <button id="btnConfirmarVenta" class="btn-pay" disabled>CONFIRMAR VENTA</button>
            <p onclick="document.getElementById('modalPago').style.display='none'" style="cursor:pointer; font-size:0.8rem; color:grey; margin-top:10px;">Cancelar</p>
        </div>
    </div>

    <script type="module" src="./js/pos-core.js"></script>
</body>
</html>
