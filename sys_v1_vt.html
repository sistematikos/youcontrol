<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Control - Punto de Ventas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --royal-blue: #0056FF; 
            --deep-navy: #001529; 
            --vibrant-gradient: linear-gradient(135deg, #0056FF 0%, #00308F 100%);
            --bg-main: #F0F4F8;
            --text-main: #1E293B;
            --border-color: #F1F5F9;
        }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg-main); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: var(--text-main); }
        
        .header-sales { background: var(--vibrant-gradient); color: white; padding: 14px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0, 86, 255, 0.3); z-index: 10; }
        .header-brand { font-weight: 800; letter-spacing: 1.5px; font-size: 1.3rem; }
        .tasa-badge { background: rgba(255, 255, 255, 0.2); padding: 8px 20px; border-radius: 12px; font-weight: 800; border: 1px solid rgba(255,255,255,0.3); }

        .shortcuts-container { display: flex; justify-content: center; gap: 12px; padding: 12px; background: white; border-bottom: 2px solid #E2E8F0; }
        .key-pill { background: #FFFFFF; border: 2px solid #F1F5F9; padding: 6px 16px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; color: var(--deep-navy); display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .key-pill b { background: var(--royal-blue); color: white; padding: 2px 8px; border-radius: 8px; font-size: 0.7rem; }

        .pos-container { display: flex; flex: 1; gap: 20px; padding: 20px; overflow: hidden; }
        .panel-left, .panel-cart { background: white; border-radius: 24px; display: flex; flex-direction: column; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
        .panel-left { flex: 1.7; }
        .panel-cart { flex: 1.2; border-top: 8px solid var(--royal-blue); }

        .product-grid, .cart-list { flex: 1; overflow-y: auto; margin-top: 15px; }
        
        .single-line-row { display: grid; align-items: center; padding: 10px 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; font-size: 0.85rem; transition: 0.2s; white-space: nowrap; border-radius: 8px; }
        .grid-search { grid-template-columns: 1fr 70px 85px 110px 30px; }
        .grid-cart { grid-template-columns: 1fr 90px 120px 30px; }

        .item-selected { background: #EBF4FF !important; border-left: 5px solid var(--royal-blue) !important; }
        .price-vibrant { color: var(--royal-blue); font-weight: 800; text-align: right; }

        .summary-box { background: #F8FAFC; padding: 20px; border-radius: 20px; text-align: center; border: 2px solid #E2E8F0; margin-top: 15px; }
        #total-usd { font-size: 2.5rem; font-weight: 800; color: var(--deep-navy); display: block; }

        .btn-pay { border: none; border-radius: 18px; background: var(--vibrant-gradient); color: white; font-weight: 800; cursor: pointer; padding: 18px; width: 100%; font-size: 1.1rem; box-shadow: 0 8px 20px rgba(0, 86, 255, 0.2); transition: 0.3s; margin-top: 10px; }
        .btn-pay:disabled { opacity: 0.4; cursor: not-allowed; }

        /* MODAL DE PAGOS */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 21, 41, 0.8); backdrop-filter: blur(10px); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 32px; width: 90%; max-width: 460px; text-align: center; box-shadow: 0 30px 60px rgba(0,0,0,0.4); }
        
        .input-pago-group { display: flex; align-items: center; background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: 15px; padding: 10px 18px; margin-bottom: 10px; transition: 0.3s; }
        .input-pago-group:focus-within { border-color: var(--royal-blue); background: white; }
        .input-pago-group label { font-size: 0.65rem; font-weight: 800; color: #64748B; width: 100px; text-align: left; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        .input-pago-group label:hover { color: var(--royal-blue); transform: scale(1.05); }
        .input-pago-group input { border: none; background: transparent; outline: none; width: 100%; font-size: 1.2rem; font-weight: 700; text-align: right; color: var(--deep-navy); }
    </style>
</head>
<body oncontextmenu="return false">
    <header class="header-sales">
        <div class="header-brand">YOU CONTROL - PUNTO DE VENTAS</div>
        <div class="tasa-badge">BCV: <span id="txt-tasa">0,00</span> Bs.</div>
    </header>

    <div class="shortcuts-container">
        <div class="key-pill"><b>F4</b> CANTIDAD</div>
        <div class="key-pill"><b>F5</b> PRECIO</div>
        <div class="key-pill"><b>F6</b> ELIMINAR</div>
        <div class="key-pill" style="background: var(--deep-navy); color: white;"><b>F9</b> COBRAR</div>
    </div>

    <div class="pos-container">
        <div class="panel-left">
            <input type="text" id="inputBusqueda" style="width:100%; padding:14px 20px; border-radius:12px; border:2px solid var(--border-color); background:#F8FAFC;" placeholder="🔍 Buscar artículo...">
            <div id="grid-productos" class="product-grid"></div>
        </div>

        <div class="panel-cart">
            <div id="lista-carrito" class="cart-list"></div>
            <div class="summary-box">
                <span id="total-usd">$ 0.00</span>
                <span id="total-bs" style="font-weight: 700; color: var(--royal-blue);">0,00 Bs.</span>
            </div>
            <button id="btnCobrar" class="btn-pay">PROCESAR COBRO [F9]</button>
        </div>
    </div>

    <!-- MODAL DE PAGO -->
    <div id="modalPago" class="modal">
        <div class="modal-content">
            <div style="background: var(--vibrant-gradient); color: white; padding: 25px; border-radius: 20px; margin-bottom: 20px;">
                <h2 id="totalModalUSD" style="font-size: 3rem; margin: 0;">$ 0.00</h2>
                <p id="totalModalBS" style="font-size: 1.1rem; opacity: 0.9; margin: 5px 0 0 0;">0,00 Bs</p>
            </div>

            <div class="input-pago-group"><label onclick="autocompletar('punto')">Punto Bs</label><input type="number" id="in-punto-bs" value="0" step="0.01" oninput="calcularRestante()"></div>
            <div class="input-pago-group"><label onclick="autocompletar('pagomovil')">P. Móvil Bs</label><input type="number" id="in-pagomovil-bs" value="0" step="0.01" oninput="calcularRestante()"></div>
            <div class="input-pago-group"><label onclick="autocompletar('efectivo')">Efectivo Bs</label><input type="number" id="in-efectivo-bs" value="0" step="0.01" oninput="calcularRestante()"></div>
            <div class="input-pago-group" style="border-color: #CBD5E1;"><label onclick="autocompletar('divisas')" style="color: var(--royal-blue);">Divisas $</label><input type="number" id="in-divisas-usd" value="0" step="0.01" oninput="calcularRestante()"></div>

            <div id="pago-status" style="padding:12px; border-radius:12px; font-weight:700; margin-bottom:15px; font-size: 0.85rem;"></div>

            <button id="btnConfirmarVenta" class="btn-pay" disabled>CONFIRMAR VENTA</button>
            <p onclick="document.getElementById('modalPago').style.display='none'" style="cursor:pointer; margin-top:15px; color: #94A3B8; font-weight: 600; font-size: 0.9rem;">Regresar al Carrito</p>
        </div>
    </div>

    <script type="module" src="./js/pos-core.js"></script>
</body>
</html>
