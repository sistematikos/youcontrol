<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS | You Control - Pago Mixto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --midnight-dark: #001A3D; 
            --midnight-gradient: linear-gradient(135deg, #002D72 0%, #001A3D 100%);
            --electric-blue: #0052D4;
            --vinotinto: #800020; 
            --bg-body: #F1F5F9; 
            --white: #FFFFFF;
            --border-color: #E2E8F0;
            --action-grey: #475569;
        }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg-body); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Header */
        .header-sales { background: var(--midnight-gradient); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--vinotinto); }
        .tasa-badge { background: rgba(255, 255, 255, 0.1); padding: 8px 18px; border-radius: 10px; font-weight: 800; border: 1px solid rgba(255,255,255,0.2); }
        
        /* Layout */
        .pos-container { display: flex; flex: 1; gap: 20px; padding: 20px; overflow: hidden; }
        .panel-left, .panel-cart { background: var(--white); border-radius: 25px; display: flex; flex-direction: column; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
        .panel-left { flex: 1.4; }
        .panel-cart { flex: 1; border-top: 8px solid var(--midnight-dark); }

        /* Listas */
        .product-grid, .cart-list { flex: 1; overflow-y: auto; margin-top: 20px; }
        .product-card { display: grid; grid-template-columns: 1fr 100px 40px; align-items: center; padding: 14px; border-bottom: 1px solid #F1F5F9; cursor: pointer; transition: 0.2s; }
        .product-card:hover { background: #F8FAFC; }
        
        /* Item Seleccionado en Carrito */
        .item-selected { border: 2px solid var(--electric-blue) !important; background: #EBF4FF !important; border-radius: 15px; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,13,26,0.85); backdrop-filter: blur(10px); }
        .modal-content { background: white; margin: 2% auto; padding: 30px; border-radius: 30px; width: 90%; max-width: 480px; text-align: center; }
        
        .btn-action-metodo {
            border: 2px solid #E2E8F0; background: #F8FAFC; padding: 15px 5px; border-radius: 15px;
            color: var(--action-grey); font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.7rem;
        }
        
        .input-pago-group { display: flex; align-items: center; background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: 15px; padding: 10px 20px; margin-bottom: 10px; }
        .input-pago-group input { border: none; background: transparent; outline: none; width: 100%; font-size: 1.3rem; font-weight: 700; text-align: right; color: var(--midnight-dark); }
        
        .status-badge { padding: 12px; border-radius: 12px; font-weight: 800; margin: 15px 0; }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .status-complete { background: #D1FAE5; color: #065F46; }

        .btn-pay { border: none; border-radius: 20px; background: var(--midnight-gradient); color: white; font-weight: 800; cursor: pointer; padding: 18px; width: 100%; transition: 0.3s; }
        .btn-pay:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Atajos Info */
        .shortcuts-bar { display: flex; gap: 15px; padding: 10px 30px; background: #ddd; font-size: 0.75rem; font-weight: 600; color: #444; }
    </style>
</head>
<body oncontextmenu="return false">
    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

    <header class="header-sales">
        <div class="header-brand">YOU CONTROL <small>| SISTEMATIKOS</small></div>
        <div class="tasa-badge">TASA: <span id="txt-tasa">0,00</span> Bs.</div>
    </header>

    <div class="shortcuts-bar">
        <span>F4: CANTIDAD</span> | <span>F5: PRECIO</span> | <span>F6: BORRAR ITEM</span> | <span>F9: COBRAR</span>
    </div>

    <div class="pos-container">
        <!-- Panel Izquierdo: Buscador y Productos -->
        <div class="panel-left">
            <input type="text" id="inputBusqueda" style="width:100%; padding:15px; border-radius:50px; border:2px solid var(--border-color); box-sizing: border-box;" placeholder="Buscar producto...">
            <div id="grid-productos" class="product-grid">
                <!-- Se llena desde JS -->
            </div>
        </div>

        <!-- Panel Derecho: Carrito -->
        <div class="panel-cart">
            <h3 style="margin:0; color: var(--midnight-dark);">Resumen de Venta</h3>
            <div id="lista-carrito" class="cart-list">
                <!-- Se llena desde JS -->
            </div>
            
            <div style="background:#F8FAFC; padding:20px; border-radius:20px; text-align:center; border:2px solid var(--border-color); margin-bottom:15px;">
                <span id="total-usd" style="font-size:2.5rem; font-weight:800; display:block; color: var(--midnight-dark);">$ 0.00</span>
                <span id="total-bs" style="font-size:1.1rem; opacity:0.7; font-weight:600;">0,00 Bs.</span>
            </div>
            <button id="btnCobrar" class="btn-pay">COBRAR [F9]</button>
        </div>
    </div>

    <!-- MODAL DE PAGO -->
    <div id="modalPago" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--midnight-dark); margin: 0 0 15px 0;">Confirmar Cobro</h2>
            
            <div style="background: var(--midnight-dark); color: white; padding: 20px; border-radius: 20px; margin-bottom: 20px;">
                <small style="opacity: 0.8;">MONTO TOTAL</small>
                <div id="totalModalUSD" style="font-size: 2.8rem; font-weight: 800;">$ 0.00</div>
                <div id="totalModalBS" style="font-size: 1.1rem; opacity: 0.8;">0,00 Bs.</div>
            </div>

            <!-- Botones de Acción Rápida -->
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px;">
                <button class="btn-action-metodo" onclick="autoCompletar('punto')"><i class="fas fa-credit-card"></i> PUNTO</button>
                <button class="btn-action-metodo" onclick="autoCompletar('pagomovil')"><i class="fas fa-mobile-alt"></i> P. MOVIL</button>
                <button class="btn-action-metodo" onclick="autoCompletar('divisas')"><i class="fas fa-dollar-sign"></i> DIVISAS</button>
                <button class="btn-action-metodo" onclick="autoCompletar('efectivo')"><i class="fas fa-money-bill-wave"></i> EFEC. BS</button>
            </div>

            <!-- Inputs de Pago -->
            <div class="input-pago-group"><label style="font-size:0.6rem; width:80px; text-align:left;">PUNTO BS</label><input type="number" id="in-punto-bs" value="0" step="0.01" oninput="calcularRestante()" onclick="this.select()"></div>
            <div class="input-pago-group"><label style="font-size:0.6rem; width:80px; text-align:left;">P.MOVIL BS</label><input type="number" id="in-pagomovil-bs" value="0" step="0.01" oninput="calcularRestante()" onclick="this.select()"></div>
            <div class="input-pago-group"><label style="font-size:0.6rem; width:80px; text-align:left;">EFEC. BS</label><input type="number" id="in-efectivo-bs" value="0" step="0.01" oninput="calcularRestante()" onclick="this.select()"></div>
            <div class="input-pago-group" style="border-color: var(--electric-blue);"><label style="font-size:0.6rem; width:80px; text-align:left; color:var(--electric-blue);">DIVISAS $</label><input type="number" id="in-divisas-usd" value="0" step="0.01" oninput="calcularRestante()" onclick="this.select()"></div>

            <div id="pago-status" class="status-badge status-pending">PENDIENTE: <span id="txt-restante">$ 0.00</span></div>
            
            <button id="btnConfirmarVenta" class="btn-pay" disabled>REGISTRAR VENTA</button>
            <p id="btnCerrarModal" style="margin-top:20px; cursor:pointer; color:var(--action-grey); font-size:0.8rem; font-weight:600;">Regresar al Carrito</p>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { productosMaster, tasaActual, procesarVentaFirebase } from './js/pos-db-motor.js';

        let carrito = [];
        let totalVentaUSD = 0;
        let indiceSeleccionado = -1;

        // --- RENDERIZADO ---
        const renderizarProductos = (lista) => {
            const grid = document.getElementById('grid-productos');
            if (!grid) return;
            grid.innerHTML = "";
            lista.forEach(p => {
                grid.innerHTML += `
                <div class="product-card" onclick="agregar('${p.id}')">
                    <div><b>${p.nombre}</b><br><small>Stock: ${p.stock}</small></div>
                    <div style="text-align:right; font-weight:800;">$${p.precio.toFixed(2)}</div>
                    <i class="fas fa-plus-circle" style="color:var(--electric-blue); text-align:right;"></i>
                </div>`;
            });
            document.getElementById('txt-tasa').innerText = tasaActual.toLocaleString('es-VE');
        };

        // --- LÓGICA CARRITO ---
        window.agregar = (id) => {
            const p = productosMaster.find(x => x.id === id);
            if (!p || p.stock <= 0) return;
            
            const existe = carrito.find(c => c.id === id);
            if (existe) {
                existe.cantidad++;
            } else {
                carrito.push({ ...p, cantidad: 1 });
            }
            indiceSeleccionado = carrito.length - 1; 
            actualizarUI();
            document.getElementById('beepSound').play();
        };

        window.seleccionarItem = (index) => {
            indiceSeleccionado = index;
            actualizarUI();
        };

        function actualizarUI() {
            const list = document.getElementById('lista-carrito');
            list.innerHTML = ""; 
            totalVentaUSD = 0;

            carrito.forEach((c, index) => {
                const subtotal = c.precio * c.cantidad;
                totalVentaUSD += subtotal;
                const claseSeleccionado = index === indiceSeleccionado ? 'item-selected' : '';
                
                list.innerHTML += `
                <div class="product-card ${claseSeleccionado}" onclick="seleccionarItem(${index})" style="border-bottom:1px solid #eee;">
                    <span><b>${c.cantidad}x</b> ${c.nombre}</span>
                    <span style="text-align:right; font-weight:700;">$${subtotal.toFixed(2)}</span>
                    <i class="fas fa-edit" style="opacity:0.3; text-align:right;"></i>
                </div>`;
            });

            document.getElementById('total-usd').innerText = `$ ${totalVentaUSD.toFixed(2)}`;
            document.getElementById('total-bs').innerText = `${(totalVentaUSD * tasaActual).toLocaleString('es-VE')} Bs.`;
        }

        // --- ATAJOS F4, F5, F6, F9 ---
        window.addEventListener('keydown', (e) => {
            // Si el modal está abierto, no procesar estos atajos excepto el enter para confirmar si se desea
            if(document.getElementById('modalPago').style.display === "block") return;

            if (indiceSeleccionado === -1 && ["F4", "F5", "F6"].includes(e.key)) return;

            if (e.key === "F4") { // Cantidad
                e.preventDefault();
                const n = prompt(`Nueva cantidad para ${carrito[indiceSeleccionado].nombre}:`, carrito[indiceSeleccionado].cantidad);
                if (n !== null && !isNaN(n) && n > 0) {
                    carrito[indiceSeleccionado].cantidad = parseFloat(n);
                    actualizarUI();
                }
            }
            if (e.key === "F5") { // Precio
                e.preventDefault();
                const p = prompt(`Cambiar precio de ${carrito[indiceSeleccionado].nombre}:`, carrito[indiceSeleccionado].precio);
                if (p !== null && !isNaN(p) && p >= 0) {
                    carrito[indiceSeleccionado].precio = parseFloat(p);
                    actualizarUI();
                }
            }
            if (e.key === "F6") { // Borrar
                e.preventDefault();
                carrito.splice(indiceSeleccionado, 1);
                indiceSeleccionado = carrito.length > 0 ? carrito.length - 1 : -1;
                actualizarUI();
            }
            if (e.key === "F9") { // Cobrar
                e.preventDefault();
                document.getElementById('btnCobrar').click();
            }
        });

        // --- MODAL Y PAGOS ---
        document.getElementById('btnCobrar').onclick = () => {
            if (carrito.length === 0) return;
            document.getElementById('totalModalUSD').innerText = `$ ${totalVentaUSD.toFixed(2)}`;
            document.getElementById('totalModalBS').innerText = `${(totalVentaUSD * tasaActual).toLocaleString('es-VE')} Bs.`;
            document.getElementById('modalPago').style.display = "block";
            
            // Limpiar inputs
            ['in-punto-bs', 'in-pagomovil-bs', 'in-efectivo-bs', 'in-divisas-usd'].forEach(id => document.getElementById(id).value = 0);
            calcularRestante();
        };

        document.getElementById('btnCerrarModal').onclick = () => document.getElementById('modalPago').style.display = "none";

        window.autoCompletar = (tipo) => {
            const p = parseFloat(document.getElementById('in-punto-bs').value) || 0;
            const pm = parseFloat(document.getElementById('in-pagomovil-bs').value) || 0;
            const ef = parseFloat(document.getElementById('in-efectivo-bs').value) || 0;
            const dv = parseFloat(document.getElementById('in-divisas-usd').value) || 0;

            const cubiertoUSD = dv + ((p + pm + ef) / tasaActual);
            const faltanteUSD = totalVentaUSD - cubiertoUSD;
            if (faltanteUSD <= 0) return;

            if (tipo === 'divisas') document.getElementById('in-divisas-usd').value = (dv + faltanteUSD).toFixed(2);
            else {
                const faltanteBS = (faltanteUSD * tasaActual).toFixed(2);
                if (tipo === 'punto') document.getElementById('in-punto-bs').value = (p + parseFloat(faltanteBS)).toFixed(2);
                if (tipo === 'pagomovil') document.getElementById('in-pagomovil-bs').value = (pm + parseFloat(faltanteBS)).toFixed(2);
                if (tipo === 'efectivo') document.getElementById('in-efectivo-bs').value = (ef + parseFloat(faltanteBS)).toFixed(2);
            }
            calcularRestante();
        };

        window.calcularRestante = () => {
            const p = parseFloat(document.getElementById('in-punto-bs').value) || 0;
            const pm = parseFloat(document.getElementById('in-pagomovil-bs').value) || 0;
            const ef = parseFloat(document.getElementById('in-efectivo-bs').value) || 0;
            const dv = parseFloat(document.getElementById('in-divisas-usd').value) || 0;
            
            const pagadoUSD = dv + ((p + pm + ef) / tasaActual);
            const dif = totalVentaUSD - pagadoUSD;
            const status = document.getElementById('pago-status');
            const btn = document.getElementById('btnConfirmarVenta');

            if (dif <= 0.01) {
                status.className = "status-badge status-complete";
                status.innerHTML = dif < -0.01 ? `CAMBIO: $ ${Math.abs(dif).toFixed(2)}` : "PAGO COMPLETO";
                btn.disabled = false;
            } else {
                status.className = "status-badge status-pending";
                status.innerHTML = `PENDIENTE: $ ${dif.toFixed(2)}`;
                btn.disabled = true;
            }
        };

        document.getElementById('btnConfirmarVenta').onclick = async () => {
            const pago = {
                punto: parseFloat(document.getElementById('in-punto-bs').value),
                pagomovil: parseFloat(document.getElementById('in-pagomovil-bs').value),
                efectivo_bs: parseFloat(document.getElementById('in-efectivo-bs').value),
                divisas: parseFloat(document.getElementById('in-divisas-usd').value),
                tasa: tasaActual
            };

            if (await procesarVentaFirebase(carrito, totalVentaUSD, pago)) {
                alert("Venta procesada con éxito");
                carrito = [];
                indiceSeleccionado = -1;
                actualizarUI();
                document.getElementById('modalPago').style.display = "none";
            }
        };

        // Inicialización
        document.addEventListener('productosActualizados', () => renderizarProductos(productosMaster));
        if (productosMaster.length > 0) renderizarProductos(productosMaster);
    </script>
</body>
</html>
