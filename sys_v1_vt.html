<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas | You Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --dark: #1E1E2D; --vinotinto: #800020; --blue: #3B82F6; --emerald: #10B981; --bg: #F4F7F9; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Header */
        .header-sales { background: var(--dark); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--vinotinto); }
        .tasa-badge { background: #2B2B40; padding: 5px 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; }

        .pos-container { display: flex; flex: 1; gap: 10px; padding: 10px; overflow: hidden; }

        /* Panel Izquierdo: Lista Compacta */
        .panel-search { flex: 1.3; background: white; border-radius: 15px; display: flex; flex-direction: column; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .search-box input { width: 100%; padding: 10px; border: 2px solid #F1F5F9; border-radius: 10px; outline: none; margin-bottom: 10px; box-sizing: border-box; }

        .product-grid { flex: 1; overflow-y: auto; }
        /* PRODUCTO EN UNA SOLA LINEA */
        .product-card { 
            display: grid; 
            grid-template-columns: 1fr 80px 80px 40px; 
            align-items: center; 
            padding: 8px 12px; 
            border-bottom: 1px solid #F1F5F9; 
            cursor: pointer; 
            font-size: 0.85rem;
        }
        .product-card:hover { background: #F0F7FF; }
        .p-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-stock { color: #94A3B8; text-align: center; font-size: 0.75rem; }
        .p-price { font-weight: 800; color: var(--emerald); text-align: right; }

        /* Panel Derecho: Carrito y Gran Total */
        .panel-cart { flex: 1; background: white; border-radius: 15px; display: flex; flex-direction: column; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .cart-list { flex: 1; overflow-y: auto; border-bottom: 2px solid #F1F5F9; }
        .cart-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #E2E8F0; font-size: 0.85rem; }

        /* SECCIÓN TOTALIZADORA GRANDE */
        .checkout-area { padding-top: 15px; background: #fff; }
        .big-total-card { 
            background: var(--dark); 
            color: white; 
            padding: 20px; 
            border-radius: 15px; 
            text-align: center; 
            margin-bottom: 10px;
            border-bottom: 5px solid var(--blue);
        }
        .label-total { font-size: 0.8rem; text-transform: uppercase; color: #94A3B8; letter-spacing: 1px; }
        .val-usd { font-size: 2.8rem; font-weight: 800; display: block; line-height: 1; margin: 5px 0; color: var(--white); }
        .val-bs { font-size: 1.3rem; font-weight: 600; color: var(--blue); }

        .btn-pay { 
            width: 100%; padding: 20px; border: none; border-radius: 15px; 
            background: var(--emerald); color: white; font-weight: 800; 
            font-size: 1.2rem; cursor: pointer; transition: 0.3s; 
        }
        .btn-pay:disabled { background: #CBD5E1; cursor: not-allowed; }

        @media (max-width: 800px) { .pos-container { flex-direction: column; overflow-y: auto; } }
    </style>
</head>
<body oncontextmenu="return false">

    <header class="header-sales">
        <div onclick="location.href='index.html'" style="cursor:pointer;"><b><i class="fas fa-chevron-left"></i> VENTAS</b></div>
        <div class="tasa-badge">Tasa: <span id="txt-tasa">0.00</span> Bs.</div>
    </header>

    <div class="pos-container">
        <div class="panel-search">
            <input type="text" id="inputBusqueda" placeholder="Buscar producto o código..." onkeyup="filtrarVenta()" autofocus>
            <div id="grid-productos" class="product-grid"></div>
        </div>

        <div class="panel-cart">
            <h4 style="margin:0 0 10px 0; color:var(--blue)">CARRITO</h4>
            <div id="lista-carrito" class="cart-list"></div>

            <div class="checkout-area">
                <div class="big-total-card">
                    <span class="label-total">Total a Cobrar</span>
                    <span id="total-usd" class="val-usd">$ 0.00</span>
                    <span id="total-bs" class="val-bs">0.00 Bs.</span>
                </div>
                <button id="btnVender" class="btn-pay" onclick="procesarVenta()" disabled>
                    <i class="fas fa-cash-register"></i> COBRAR AHORA
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, onSnapshot, doc, addDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const UID = "sUhfZI9Fy3M9UlInTYw2wFWZmB12";
        let tasaActual = 0;
        let masterStock = [];
        let carrito = [];

        onSnapshot(doc(db, "usuarios", UID, "configuracion", "tasa"), (snap) => {
            if (snap.exists()) {
                tasaActual = snap.data().valor;
                document.getElementById('txt-tasa').innerText = tasaActual.toLocaleString('es-VE');
                cargarInventario();
            }
        });

        function cargarInventario() {
            onSnapshot(collection(db, "usuarios", UID, "productos"), (snap) => {
                masterStock = [];
                snap.forEach(d => masterStock.push({ id: d.id, ...d.data() }));
                renderizarVenta(masterStock);
            });
        }

        window.renderizarVenta = (lista) => {
            const contenedor = document.getElementById('grid-productos');
            contenedor.innerHTML = "";
            lista.filter(p => p.stock > 0).forEach(p => {
                contenedor.innerHTML += `
                    <div class="product-card" onclick="sumarAlCarrito('${p.id}')">
                        <div class="p-name">${p.nombre}</div>
                        <div class="p-stock">Stk: ${p.stock}</div>
                        <div class="p-price">$${p.precio.toFixed(2)}</div>
                        <div style="text-align:right; color:var(--blue)"><i class="fas fa-plus-circle"></i></div>
                    </div>
                `;
            });
        };

        window.filtrarVenta = () => {
            const query = document.getElementById('inputBusqueda').value.toLowerCase();
            const filtrados = masterStock.filter(p => p.nombre.toLowerCase().includes(query) || p.codigo.toLowerCase().includes(query));
            renderizarVenta(filtrados);
        };

        window.sumarAlCarrito = (id) => {
            const p = masterStock.find(item => item.id === id);
            const existe = carrito.find(c => c.id === id);
            if (existe) {
                if (existe.cantidad < p.stock) existe.cantidad++;
                else alert("Sin stock");
            } else {
                carrito.push({ id: p.id, nombre: p.nombre, precio: p.precio, costo: p.costo, cantidad: 1 });
            }
            document.getElementById('inputBusqueda').value = "";
            actualizarUI();
        };

        window.quitarItem = (id) => {
            carrito = carrito.filter(c => c.id !== id);
            actualizarUI();
        };

        function actualizarUI() {
            const box = document.getElementById('lista-carrito');
            box.innerHTML = "";
            let subtotal = 0;
            carrito.forEach(c => {
                subtotal += (c.precio * c.cantidad);
                box.innerHTML += `
                    <div class="cart-item">
                        <div style="flex:1"><b>${c.nombre}</b> (x${c.cantidad})</div>
                        <div style="font-weight:700; margin:0 10px">$${(c.precio * c.cantidad).toFixed(2)}</div>
                        <i class="fas fa-times" onclick="quitarItem('${c.id}')" style="color:#EF4444; cursor:pointer"></i>
                    </div>
                `;
            });
            document.getElementById('total-usd').innerText = `$ ${subtotal.toFixed(2)}`;
            document.getElementById('total-bs').innerText = `${(subtotal * tasaActual).toLocaleString('es-VE')} Bs.`;
            document.getElementById('btnVender').disabled = carrito.length === 0;
        }

        window.procesarVenta = async () => {
            const btn = document.getElementById('btnVender');
            btn.disabled = true;
            try {
                const totalUSD = carrito.reduce((s, i) => s + (i.precio * i.cantidad), 0);
                await addDoc(collection(db, "usuarios", UID, "ventas"), {
                    fecha: new Date().toLocaleString(),
                    timestamp: Date.now(),
                    items: carrito,
                    totalUSD: totalUSD,
                    totalBS: totalUSD * tasaActual,
                    tasa: tasaActual
                });
                for (let item of carrito) {
                    await updateDoc(doc(db, "usuarios", UID, "productos", item.id), { stock: increment(-item.cantidad) });
                }
                alert("Cobro Exitoso");
                carrito = [];
                actualizarUI();
            } catch (e) { alert("Error"); }
            finally { btn.disabled = false; }
        };
    </script>
</body>
</html>
