<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS | You Control - Punto de Ventas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --midnight-dark: #001A3D; 
            --midnight-gradient: linear-gradient(135deg, #002D72 0%, #001A3D 100%);
            --electric-blue: #0052D4;
            --vinotinto: #800020; 
            --action-grey: #475569;
            --bg-body: #F1F5F9; 
            --white: #FFFFFF;
            --border-color: #E2E8F0;
        }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg-body); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: #1E293B; }
        
        .header-sales { 
            background: var(--midnight-gradient); 
            color: white; padding: 15px 30px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 4px solid var(--vinotinto); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .header-brand { font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; }
        .tasa-badge { background: rgba(255, 255, 255, 0.1); padding: 8px 18px; border-radius: 10px; font-weight: 800; border: 1px solid rgba(255,255,255,0.2); font-size: 0.9rem; }

        .pos-container { display: flex; flex: 1; gap: 20px; padding: 20px; overflow: hidden; }
        .panel-left, .panel-cart { background: var(--white); border-radius: 25px; display: flex; flex-direction: column; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
        .panel-left { flex: 1.4; min-width: 0; }
        .panel-cart { flex: 1; border-top: 8px solid var(--midnight-dark); }

        .search-container { position: relative; width: 100%; margin-bottom: 5px; }
        .search-input { width: 100%; padding: 14px 20px 14px 55px; border: 2px solid var(--border-color); border-radius: 50px; outline: none; font-size: 1rem; background: #F8FAFC; box-sizing: border-box; }
        .search-container i { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--action-grey); }

        .product-grid, .cart-list { flex: 1; overflow-y: auto; margin-top: 20px; }
        .product-card { display: grid; grid-template-columns: 1fr 120px 90px 40px; align-items: center; padding: 14px; border-bottom: 1px solid #F1F5F9; cursor: pointer; }
        .cart-item { padding: 15px; border: 1px solid #F1F5F9; border-radius: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .cart-item.selected { background: #F1F5F9; border-left: 5px solid var(--midnight-dark); }

        .action-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-top: 20px; border-top: 2px solid #F8FAFC; margin-top: 15px; }
        .btn-action { border: 1px solid var(--border-color); background: #F8FAFC; padding: 12px; border-radius: 15px; color: var(--action-grey); font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; }

        .btn-pay { border: none; border-radius: 20px; background: var(--midnight-gradient); color: white; font-weight: 800; cursor: pointer; transition: 0.3s; padding: 15px; }
        .btn-pay:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0, 45, 114, 0.3); }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,13,26,0.8); backdrop-filter: blur(8px); }
        .modal-content { background: white; margin: 5% auto; padding: 40px; border-radius: 30px; width: 90%; max-width: 450px; text-align: center; }
        
        .btn-action-metodo {
            border: 2px solid #E2E8F0; background: #F8FAFC; padding: 18px 10px; border-radius: 15px;
            color: #475569; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: 0.3s;
        }
        .btn-action-metodo.active { background: var(--midnight-gradient); color: white; border-color: var(--midnight-dark); box-shadow: 0 8px 15px rgba(0, 26, 61, 0.2); }
    </style>
</head>
<body oncontextmenu="return false">
    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

    <header class="header-sales">
        <div class="header-brand">YOU CONTROL <small style="opacity:0.7;">| PUNTO DE VENTAS</small></div>
        <div class="tasa-badge">TASA: <span id="txt-tasa">0.00</span> Bs.</div>
    </header>

    <div class="pos-container">
        <div class="panel-left">
            <div class="search-container">
                <i class="fas fa-barcode"></i>
                <input type="text" id="inputBusqueda" class="search-input" placeholder="Escanear o buscar producto..." autofocus>
            </div>
            <div id="grid-productos" class="product-grid"></div>
            <div class="action-bar">
                <button class="btn-action" id="btn-f5"><i class="fas fa-calculator"></i> CANTIDAD <small>[F5]</small></button>
                <button class="btn-action" id="btn-f4"><i class="fas fa-tag"></i> PRECIO <small>[F4]</small></button>
                <button class="btn-action" id="btn-f6"><i class="fas fa-trash-alt"></i> ELIMINAR <small>[F6]</small></button>
            </div>
        </div>

        <div class="panel-cart">
            <h3 style="margin:0 0 15px 0; color: var(--midnight-dark); font-size: 0.85rem; text-transform: uppercase;">Resumen de Venta</h3>
            <div id="lista-carrito" class="cart-list"></div>
            <div style="background:#F8FAFC; padding:15px; border-radius:20px; text-align:center; border:2px solid var(--border-color); margin-bottom:15px;">
                <span id="total-usd" style="font-size:2rem; font-weight:800; display:block;">$ 0.00</span>
                <span id="total-bs" style="font-size:1rem; opacity:0.7; font-weight:600;">0.00 Bs.</span>
            </div>
            <button id="btnCobrar" class="btn-pay">COBRAR <small style="display:block; font-size:0.65rem; opacity:0.8;">[F9]</small></button>
        </div>
    </div>

    <div id="modalPago" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--midnight-dark); margin-top: 0;">Confirmar Pago</h2>
            
            <div style="background: #F1F5F9; padding: 20px; border-radius: 20px; margin: 15px 0; border: 1px solid var(--border-color);">
                <div id="totalModal" style="font-size: 2.8rem; font-weight: 800; color: var(--midnight-dark);">$0.00</div>
                <div id="totalModalBs" style="font-size: 1.2rem; font-weight: 600; color: var(--action-grey); margin-top: 5px;">0.00 Bs.</div>
            </div>
            
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:12px;">
                <button id="btn-metodo-pv" class="btn-action-metodo" onclick="seleccionarMetodo('Punto de Venta', this)">
                    <i class="fas fa-credit-card"></i> PUNTO VENTAS
                </button>
                <button id="btn-metodo-pm" class="btn-action-metodo" onclick="seleccionarMetodo('Pago Movil', this)">
                    <i class="fas fa-mobile-alt"></i> PAGO MOVIL
                </button>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:25px;">
                <button id="btn-metodo-div" class="btn-action-metodo" onclick="seleccionarMetodo('Divisas', this)">
                    <i class="fas fa-dollar-sign"></i> DIVISAS
                </button>
                <button id="btn-metodo-bs" class="btn-action-metodo" onclick="seleccionarMetodo('Efectivo Bs', this)">
                    <i class="fas fa-money-bill-wave"></i> EFECTIVO BS
                </button>
            </div>

            <button id="btnConfirmarVenta" class="btn-pay" style="width:100%; padding: 20px; font-size: 1.1rem;">
                REGISTRAR VENTA <small style="display:block; font-size:0.7rem; opacity:0.8;">[F9]</small>
            </button>
            <p id="btnCerrarModal" style="margin-top:20px; cursor:pointer; color:#94A3B8; font-weight:600;">Regresar</p>
        </div>
    </div>

    <script type="module" src="./js/pos-db-motor.js"></script>
    <script type="module" src="./js/pos-core.js"></script>
</body>
</html>
