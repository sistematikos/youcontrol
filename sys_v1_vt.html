<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas | You Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --dark: #1E1E2D; --vinotinto: #800020; --blue: #3B82F6; --emerald: #10B981; --bg: #F4F7F9; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header-sales { background: var(--dark); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--vinotinto); }
        .tasa-badge { background: #2B2B40; padding: 5px 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; border: 1px solid #3f3f5a; }

        .pos-container { display: flex; flex: 1; gap: 12px; padding: 12px; overflow: hidden; }

        /* BUSCADOR PERSUASIVO */
        .panel-search { flex: 1.4; background: white; border-radius: 20px; display: flex; flex-direction: column; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        .search-wrapper { position: relative; margin-bottom: 25px; }
        .search-wrapper i { position: absolute; left: 20px; top: 18px; color: var(--blue); font-size: 1.2rem; }
        .search-input { 
            width: 100%; padding: 16px 20px 16px 55px; border: 2px solid #E2E8F0; 
            border-radius: 50px; outline: none; font-family: 'Poppins'; font-size: 1.1rem;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.1); transition: 0.3s;
            box-sizing: border-box;
        }
        .search-input:focus { border-color: var(--blue); box-shadow: 0 10px 20px -3px rgba(59, 130, 246, 0.2); background: #fff; }

        .product-grid { flex: 1; overflow-y: auto; }
        
        /* FILA COMPACTA REORGANIZADA */
        .product-card { 
            display: grid; 
            grid-template-columns: 1fr 100px 80px 80px 40px; 
            align-items: center; 
            padding: 12px 15px; 
            border-bottom: 1px solid #F1F5F9; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .product-card:hover { background: #F0F7FF; border-radius: 10px; transform: scale(1.01); }
        .p-name { font-weight: 600; font-size: 0.9rem; color: var(--dark); }
        .p-bs { font-weight: 700; color: var(--blue); text-align: right; font-size: 0.9rem; }
        .p-usd { font-weight: 800; color: var(--emerald); text-align: right; font-size: 0.9rem; }
        .p-stock { font-weight: 600; color: #94A3B8; text-align: right; font-size: 0.8rem; }

        /* CARRITO Y TOTALES */
        .panel-cart { flex: 1; background: white; border-radius: 20px; display: flex; flex-direction: column; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .cart-list { flex: 1; overflow-y: auto; }
        .cart-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #E2E8F0; font-size: 0.9rem; }

        .checkout-area { padding-top: 20px; }
        .big-total-card { 
            background: var(--dark); color: white; padding: 25px; border-radius: 20px; 
            text-align: center; margin-bottom: 12px; border-bottom: 6px solid var(--blue);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .val-usd { font-size: 3.2rem; font-weight: 800; display: block; line-height: 1; color: #fff; margin-bottom: 5px; }
        .val-bs { font-size: 1.4rem; font-weight: 600; color: var(--blue); }

        .btn-pay { 
            width: 100%; padding: 22px; border: none; border-radius: 18px; 
            background: var(--emerald); color: white; font-weight: 800; 
            font-size: 1.3rem; cursor: pointer; transition: 0.3s;
            box-shadow: 0 8px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-pay:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 20px rgba(16, 185, 129, 0.4); }
        .btn-pay:disabled { background: #CBD5E1; box-shadow: none; }

        @media (max-width: 850px) { .pos-container { flex-direction: column; overflow-y: auto; } .panel-cart { flex: none; height: auto; } }
    </style>
</head>
<body oncontextmenu="return false">

    <header class="header-sales">
        <div onclick="location.href='index.html'" style="cursor:pointer; font-weight: 800; letter-spacing: 1px;">
            <i class="fas fa-arrow-left"></i> YOU CONTROL
        </div>
        <div class="tasa-badge">Tasa: <span id="txt-tasa">0.00</span> Bs.</div>
    </header>

    <div class="pos-container">
        <div class="panel-search">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="inputBusqueda" class="search-input" placeholder="¿Qué vamos a vender hoy?" onkeyup="filtrarVenta()" autofocus>
            </div>
            
            <div id="grid-productos" class="product-grid">
                </div>
        </div>

        <div class="panel-cart">
            <h3 style="margin:0 0 15px 0; color:var(--dark); font-weight: 800;">RESUMEN</h3>
            <div id="lista-carrito" class="cart-list"></div>

            <div class="checkout-area">
                <div class="big-total-card">
                    <span style="color:#94A3B8; font-size: 0.8rem; font-weight: 600; text-transform: uppercase;">Monto Total</span>
                    <span id="total-usd" class="val-usd">$ 0.00</span>
                    <span id="total-bs" class="val-bs">0.00 Bs.</span>
                </div>
                <button id="btnVender" class="btn-pay" onclick="procesarVenta()" disabled>
                    <i class="fas fa-wallet"></i> COMPLETAR COBRO
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, onSnapshot, doc, addDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const UID = "sUhfZI9Fy3M9UlInTYw2wFWZmB12";
        let tasaActual = 0;
        let masterStock = [];
        let carrito = [];

        onSnapshot(doc(db, "usuarios", UID, "configuracion", "tasa"), (snap) => {
            if (snap.exists()) {
                tasaActual = snap.data().valor;
                document.getElementById('txt-tasa').innerText = tasaActual.toLocaleString('es-VE');
                cargarInventario();
            }
        });

        function cargarInventario() {
            onSnapshot(collection(db, "usuarios", UID, "productos"), (snap) => {
                masterStock = [];
                snap.forEach(d => masterStock.push({ id: d.id, ...d.data() }));
                renderizarVenta(masterStock);
            });
        }

        window.renderizarVenta = (lista) => {
            const contenedor = document.getElementById('grid-productos');
            contenedor.innerHTML = "";
            lista.filter(p => p.stock > 0).forEach(p => {
                const precioBs = (p.precio * tasaActual).toLocaleString('es-VE', {minimumFractionDigits: 2});
                contenedor.innerHTML += `
                    <div class="product-card" onclick="sumarAlCarrito('${p.id}')">
                        <div class="p-name">${p.nombre}</div>
                        <div class="p-bs">${precioBs} Bs.</div>
                        <div class="p-usd">$${p.precio.toFixed(2)}</div>
                        <div class="p-stock">${p.stock} <small>und</small></div>
                        <div style="text-align:right; color:var(--blue);"><i class="fas fa-plus-circle"></i></div>
                    </div>
                `;
            });
        };

        window.filtrarVenta = () => {
            const query = document.getElementById('inputBusqueda').value.toLowerCase();
            const filtrados = masterStock.filter(p => p.nombre.toLowerCase().includes(query) || p.codigo.toLowerCase().includes(query));
            renderizarVenta(filtrados);
        };

        window.sumarAlCarrito = (id) => {
            const p = masterStock.find(item => item.id === id);
            const existe = carrito.find(c => c.id === id);
            if (existe) {
                if (existe.cantidad < p.stock) existe.cantidad++;
                else alert("Stock insuficiente");
            } else {
                carrito.push({ id: p.id, nombre: p.nombre, precio: p.precio, costo: p.costo, cantidad: 1 });
            }
            document.getElementById('inputBusqueda').value = "";
            actualizarUI();
        };

        window.quitarItem = (id) => {
            carrito = carrito.filter(c => c.id !== id);
            actualizarUI();
        };

        function actualizarUI() {
            const box = document.getElementById('lista-carrito');
            box.innerHTML = "";
            let subtotal = 0;
            carrito.forEach(c => {
                const filaPrecio = c.precio * c.cantidad;
                subtotal += filaPrecio;
                box.innerHTML += `
                    <div class="cart-item">
                        <div style="flex:1"><b>${c.nombre}</b> (x${c.cantidad})</div>
                        <div style="font-weight:800; margin:0 15px">$${filaPrecio.toFixed(2)}</div>
                        <i class="fas fa-trash-alt" onclick="quitarItem('${c.id}')" style="color:#EF4444; cursor:pointer"></i>
                    </div>
                `;
            });
            document.getElementById('total-usd').innerText = `$ ${subtotal.toFixed(2)}`;
            document.getElementById('total-bs').innerText = `${(subtotal * tasaActual).toLocaleString('es-VE')} Bs.`;
            document.getElementById('btnVender').disabled = carrito.length === 0;
        }

        window.procesarVenta = async () => {
            const btn = document.getElementById('btnVender');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> PROCESANDO...';
            try {
                const totalUSD = carrito.reduce((s, i) => s + (i.precio * i.cantidad), 0);
                await addDoc(collection(db, "usuarios", UID, "ventas"), {
                    fecha: new Date().toLocaleString(),
                    timestamp: Date.now(),
                    items: carrito,
                    totalUSD: totalUSD,
                    totalBS: totalUSD * tasaActual,
                    tasa: tasaActual
                });
                for (let item of carrito) {
                    await updateDoc(doc(db, "usuarios", UID, "productos", item.id), { stock: increment(-item.cantidad) });
                }
                alert("Venta Exitosa");
                carrito = [];
                actualizarUI();
            } catch (e) { alert("Error en conexión"); }
            finally { 
                btn.disabled = false; 
                btn.innerHTML = '<i class="fas fa-wallet"></i> COMPLETAR COBRO';
            }
        };
    </script>
</body>
</html>
