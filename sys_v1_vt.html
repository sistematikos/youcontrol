<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>You Control - Punto de Ventas</title>
    <!-- Tus estilos CSS aquí -->
</head>
<body>
    <header class="header-sales">
        <div class="header-brand">YOU CONTROL - PUNTO DE VENTAS</div>
        <div class="tasa-badge">BCV: <span id="txt-tasa">0,00</span> Bs.</div>
    </header>

    <div class="pos-container">
        <!-- Panel Izquierdo: Buscador y Productos -->
        <div class="panel-left">
            <input type="text" id="inputBusqueda" placeholder="🔍 Buscar artículo...">
            <div id="grid-productos" class="product-grid">
                <!-- Se llena dinámicamente desde pos-core.js -->
            </div>
        </div>

        <!-- Panel Derecho: Carrito -->
        <div class="panel-cart">
            <div id="lista-carrito" class="cart-list"></div>
            <div class="summary-box">
                <span id="total-usd">$ 0.00</span>
                <span id="total-bs">0,00 Bs.</span>
            </div>
            <button class="btn-pay" onclick="window.abrirModalCobro()">PROCESAR COBRO [F9]</button>
        </div>
    </div>

    <!-- Modal de Pago (Oculto por defecto) -->
    <div id="modalPago" class="modal" style="display:none;">
        <div class="modal-content">
            <h2 id="totalModalUSD">$ 0.00</h2>
            <p id="totalModalBS">0,00 Bs</p>
            <input type="number" id="in-punto-bs" placeholder="Punto Bs" oninput="window.calcularRestante()">
            <input type="number" id="in-pagomovil-bs" placeholder="P. Móvil Bs" oninput="window.calcularRestante()">
            <input type="number" id="in-efectivo-bs" placeholder="Efectivo Bs" oninput="window.calcularRestante()">
            <input type="number" id="in-divisas-usd" placeholder="Divisas $" oninput="window.calcularRestante()">
            <button id="btnConfirmarVenta" onclick="window.registrarVenta()" disabled>CONFIRMAR VENTA</button>
        </div>
    </div>

    <!-- Carga del Motor -->
    <script type="module" src="./js/pos-core.js"></script>
</body>
</html>
