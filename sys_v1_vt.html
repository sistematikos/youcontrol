<style>
    /* Estilos para el Item Seleccionado en Carrito */
    .cart-item { 
        padding: 10px; 
        border-bottom: 1px solid #F1F5F9; 
        cursor: pointer; 
        transition: 0.3s;
        border-radius: 12px;
        margin-bottom: 5px;
    }
    .cart-item:hover { background: #F8FAFC; }
    .cart-item.active { background: #F0F7FF; border: 1px solid var(--primary-blue); }

    /* Panel de Controles del Item */
    .item-controls {
        display: none; /* Se activa con JS */
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed #CBD5E1;
    }
    .btn-ctrl {
        border: none;
        padding: 8px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.75rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }
    .btn-qty { background: #DBEAFE; color: var(--primary-blue); }
    .btn-prc { background: #FEF3C7; color: #D97706; }
    .btn-del { background: #FEE2E2; color: #EF4444; }

    /* Input invisible para edición rápida */
    .edit-input { width: 50px; border: 1px solid var(--primary-blue); border-radius: 5px; text-align: center; }
</style>

<script type="module">
    // ... (Firebase Import y Configuración igual) ...
    
    let carrito = [];
    let itemEditando = null;

    // --- FUNCIONES DEL CARRITO ---

    window.sumarAlCarrito = (id) => {
        const p = masterStock.find(item => item.id === id);
        const existe = carrito.find(c => c.id === id);
        if (existe) {
            existe.cantidad++;
        } else {
            // Creamos una copia para poder editar el precio sin afectar el inventario maestro
            carrito.push({ ...p, cantidad: 1, precioOriginal: p.precio });
        }
        actualizarUI();
    };

    window.toggleControles = (id) => {
        itemEditando = (itemEditando === id) ? null : id;
        actualizarUI();
    };

    window.cambiarCantidad = (id) => {
        const nuevaQty = prompt("Ingrese nueva cantidad:");
        if (nuevaQty && !isNaN(nuevaQty) && nuevaQty > 0) {
            const item = carrito.find(c => c.id === id);
            item.cantidad = parseFloat(nuevaQty);
            actualizarUI();
        }
    };

    window.cambiarPrecio = (id) => {
        const nuevoPrc = prompt("Ingrese nuevo precio unitario ($):");
        if (nuevoPrc && !isNaN(nuevoPrc) && nuevoPrc >= 0) {
            const item = carrito.find(c => c.id === id);
            item.precio = parseFloat(nuevoPrc);
            actualizarUI();
        }
    };

    window.eliminarItem = (id) => {
        carrito = carrito.filter(c => c.id !== id);
        itemEditando = null;
        actualizarUI();
    };

    function actualizarUI() {
        const box = document.getElementById('lista-carrito');
        box.innerHTML = "";
        let subtotal = 0;

        carrito.forEach(c => {
            const totalFila = c.precio * c.cantidad;
            subtotal += totalFila;
            const esActivo = itemEditando === c.id;

            box.innerHTML += `
                <div class="cart-item ${esActivo ? 'active' : ''}" onclick="toggleControles('${c.id}')">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <b style="font-size:0.9rem">${c.nombre}</b><br>
                            <small style="color:#64748B">${c.cantidad} x $${c.precio.toFixed(2)}</small>
                        </div>
                        <b style="color:var(--primary-blue)">$${totalFila.toFixed(2)}</b>
                    </div>
                    
                    <div class="item-controls" style="display: ${esActivo ? 'grid' : 'none'}">
                        <button class="btn-ctrl btn-qty" onclick="event.stopPropagation(); cambiarCantidad('${c.id}')">
                            <i class="fas fa-plus-minus"></i> Cant
                        </button>
                        <button class="btn-ctrl btn-prc" onclick="event.stopPropagation(); cambiarPrecio('${c.id}')">
                            <i class="fas fa-tag"></i> Precio
                        </button>
                        <button class="btn-ctrl btn-del" onclick="event.stopPropagation(); eliminarItem('${c.id}')">
                            <i class="fas fa-trash"></i> Borrar
                        </button>
                    </div>
                </div>
            `;
        });

        document.getElementById('total-usd').innerText = `$ ${subtotal.toFixed(2)}`;
        document.getElementById('total-bs').innerText = `${(subtotal * tasaActual).toLocaleString('es-VE')} Bs.`;
        document.getElementById('btnCobrar').disabled = carrito.length === 0;
    }

    // ... (El resto de la lógica de Procesar Venta se mantiene igual) ...
</script>
