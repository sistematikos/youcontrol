<style>
    .btn-pay {
        border: none;
        border-radius: 18px;
        background: var(--emerald);
        color: white;
        font-weight: 800;
        font-size: 1.1rem;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: 0.3s;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
    }

    .btn-pay:hover:not(:disabled) {
        background: #059669;
        transform: translateY(-2px);
    }

    .btn-pay:disabled {
        background: #94A3B8;
        cursor: not-allowed;
        box-shadow: none;
    }

    .btn-pay small {
        font-size: 0.7rem;
        font-weight: 400;
        opacity: 0.9;
        margin-top: 2px;
    }
</style>

<div class="checkout-footer">
    <div class="total-box">
        <span id="total-usd" style="font-size:1.8rem; font-weight:800; display:block;">$ 0.00</span>
        <span id="total-bs" style="font-size:0.9rem; opacity:0.9;">0.00 Bs.</span>
    </div>
    <button id="btnCobrar" class="btn-pay" onclick="abrirModalPago()" disabled>
        COBRAR
        <small>[F9]</small>
    </button>
</div>

<script>
    window.addEventListener('keydown', function(e) {
        // Bloqueamos F4, F5, F6 y ahora F9
        if (["F4", "F5", "F6", "F9"].includes(e.key)) {
            e.preventDefault();
        }

        // F9: Acción Principal (Cobrar / Guardar)
        if (e.key === "F9") {
            const btn = document.getElementById('btnCobrar');
            const modalPago = document.getElementById('modalPago');
            
            // Si el modal de pago está abierto, F9 actúa como "Registrar Venta"
            if (window.getComputedStyle(modalPago).display === 'block') {
                procesarVenta();
            } 
            // Si el modal está cerrado y hay productos, abre el modal de pago
            else if (carrito.length > 0) {
                abrirModalPago();
            }
        }

        // Mantener las otras teclas F4, F5, F6...
        if (carrito.length > 0) {
            if (e.key === "F4") ejecutarAccion('precio');
            if (e.key === "F5") ejecutarAccion('cantidad');
            if (e.key === "F6") ejecutarAccion('eliminar');
        }
    });

    // También actualizamos el botón de "REGISTRAR" dentro del modal de pago
    // para que el usuario vea que F9 también funciona allí.
    window.abrirModalPago = () => {
        const modal = document.getElementById('modalPago');
        modal.style.display = 'block';
        // Actualizamos el texto del botón dentro del modal
        const btnRegistrar = modal.querySelector('.btn-pay');
        if (btnRegistrar) {
            btnRegistrar.innerHTML = `REGISTRAR VENTA <small>[F9]</small>`;
        }
    };
</script>
