<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS | You Control - Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --midnight: #001A3D; --vinotinto: #800020; --electric: #0052D4; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #F1F5F9; overflow: hidden; }
        
        header { background: var(--midnight); color: white; padding: 12px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--vinotinto); }
        
        .main-container { display: grid; grid-template-columns: 1fr 420px; gap: 20px; padding: 20px; height: calc(100vh - 60px); box-sizing: border-box; }
        
        /* Paneles */
        .panel-left, .panel-right { background: white; border-radius: 25px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
        
        .search-bar { width: 100%; padding: 15px; border-radius: 50px; border: 2px solid #E2E8F0; margin-bottom: 20px; box-sizing: border-box; }
        
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; overflow-y: auto; }
        
        .product-card { border: 1px solid #E2E8F0; padding: 15px; border-radius: 15px; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .product-card:hover { border-color: var(--electric); background: #f8faff; }

        /* Totales */
        .total-box { background: #F8FAFC; padding: 20px; border-radius: 20px; text-align: center; border: 1px solid #E2E8F0; margin-top: auto; }
        .btn-cobrar { background: var(--midnight); color: white; border: none; width: 100%; padding: 18px; border-radius: 15px; font-weight: 800; cursor: pointer; font-size: 1.1rem; margin-top: 10px; }

        /* Modal Integrado */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 400px; padding: 30px; border-radius: 25px; }
        .input-pago { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; text-align: right; font-size: 1.1rem; }
        .status-badge { padding: 10px; border-radius: 10px; text-align: center; font-weight: bold; margin: 15px 0; }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .status-complete { background: #DCFCE7; color: #166534; }
    </style>
</head>
<body>

<header>
    <strong>YOU CONTROL</strong>
    <div style="background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 8px;">
        TASA: <span id="val-tasa">0.00</span> Bs.
    </div>
</header>

<div class="main-container">
    <div class="panel-left">
        <input type="text" class="search-bar" id="inputBusqueda" placeholder="Buscar producto...">
        <div id="grid-productos" class="grid-productos"></div>
    </div>

    <div class="panel-right">
        <h3 style="margin:0 0 20px 0;">Carrito</h3>
        <div id="lista-carrito" style="flex-grow:1; overflow-y:auto;"></div>
        <div class="total-box">
            <h1 id="total-usd" style="margin:0;">$ 0.00</h1>
            <p id="total-bs" style="color:#64748B; margin:5px 0 15px 0;">0,00 Bs.</p>
            <button class="btn-cobrar" id="btnCobrar">COBRAR [F9]</button>
        </div>
    </div>
</div>

<!-- Modal de Pago Integrado -->
<div id="modalPago" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center; margin-top:0;">Finalizar Pago</h3>
        <div style="background:#f1f5f9; padding:15px; border-radius:15px; text-align:center;">
            <div id="totalModalUSD" style="font-size:1.5rem; font-weight:800;">$ 0.00</div>
            <div id="totalModalBS" style="font-size:0.9rem;">0,00 Bs.</div>
        </div>
        
        <div style="margin-top:20px;">
            <label><small>DIVISAS $</small></label>
            <input type="number" id="in-divisas-usd" class="input-pago" oninput="calcularRestante()" onclick="this.select()">
            <label><small>PAGO MÓVIL BS</small></label>
            <input type="number" id="in-pagomovil-bs" class="input-pago" oninput="calcularRestante()" onclick="this.select()">
        </div>

        <div id="pago-status" class="status-badge status-pending">FALTAN: $ 0.00</div>

        <button class="btn-cobrar" id="btnConfirmarVenta" disabled>CONFIRMAR VENTA</button>
        <button onclick="cerrarModal()" style="width:100%; border:none; background:none; color:#64748B; margin-top:10px; cursor:pointer;">Cancelar</button>
    </div>
</div>

<audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
<script type="module" src="./js/pos-core.js"></script>
</body>
</html>
