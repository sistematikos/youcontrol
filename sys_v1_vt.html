<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS | You Control - Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --midnight-dark: #001A3D; 
            --vinotinto: #800020;
            --electric-blue: #0052D4;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #F1F5F9; }
        header { background: var(--midnight-dark); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--vinotinto); }
        .main-container { display: grid; grid-template-columns: 1fr 400px; gap: 20px; padding: 20px; height: calc(100vh - 80px); }
        .panel-left { background: white; border-radius: 25px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .search-bar { width: 100%; padding: 15px; border-radius: 50px; border: 2px solid #E2E8F0; margin-bottom: 20px; box-sizing: border-box; }
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; overflow-y: auto; }
        .product-card { border: 1px solid #E2E8F0; padding: 15px; border-radius: 15px; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; }
        .product-card:hover { border-color: var(--electric-blue); background: #F8FAFC; }
        .panel-right { background: white; border-radius: 25px; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .total-box { background: #F8FAFC; padding: 30px; border-radius: 20px; text-align: center; margin-top: auto; }
        .btn-cobrar { background: var(--midnight-dark); color: white; border: none; width: 100%; padding: 20px; border-radius: 15px; font-weight: 800; cursor: pointer; font-size: 1.1rem; margin-top: 15px; }
    </style>
</head>
<body>

<header>
    <div><strong>YOU CONTROL</strong> | SISTEMATIKOS</div>
    <div style="background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 10px;">
        TASA: <span id="top-tasa">0.00</span> Bs.
    </div>
</header>

<div class="main-container">
    <div class="panel-left">
        <input type="text" class="search-bar" placeholder="Buscar producto..." id="inputBusqueda">
        <div id="grid-productos" class="grid-productos">
            <!-- Productos cargados dinámicamente -->
        </div>
    </div>

    <div class="panel-right">
        <h3 style="margin-top:0;">Carrito de Venta</h3>
        <div id="lista-carrito" style="flex-grow:1; overflow-y:auto;">
            <!-- Items del carrito -->
        </div>
        
        <div class="total-box">
            <div id="total-usd" style="font-size: 2.5rem; font-weight: 800;">$ 0.00</div>
            <div id="total-bs" style="color: #64748B;">0,00 Bs.</div>
            <button class="btn-cobrar" id="btnCobrar">COBRAR VENTA [F9]</button>
        </div>
    </div>
</div>

<audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

<script type="module" src="./js/pos-core.js"></script>
</body>
</html>
