<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS | You Control - Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-dark: #001A3D; 
            --electric-blue: #0052D4;
            --vinotinto: #800020; 
            --action-grey: #475569;
            --bg-body: #F1F5F9; 
            --white: #FFFFFF;
            --border-color: #E2E8F0;
        }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg-body); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: #1E293B; }
        
        /* Bloqueo de Licencia */
        #capaBloqueo { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: #000D1A; align-items: center; justify-content: center; }
        .licencia-card { background: white; padding: 40px; border-radius: 30px; width: 90%; max-width: 450px; text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.6); }

        /* Header */
        .header-sales { 
            background: var(--primary-dark); color: white; padding: 15px 30px; 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 4px solid var(--vinotinto); box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .tasa-badge { background: rgba(255, 255, 255, 0.05); padding: 8px 18px; border-radius: 10px; font-weight: 800; border: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }

        .pos-container { display: flex; flex: 1; gap: 20px; padding: 20px; overflow: hidden; }

        /* Panel Izquierdo */
        .panel-left { flex: 1.4; background: var(--white); border-radius: 25px; display: flex; flex-direction: column; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); min-width: 0; }
        
        /* Contenedor del buscador corregido para no sobresalir */
        .search-container {
            position: relative;
            width: 100%;
            margin-bottom: 5px;
        }

        .search-input { 
            width: 100%; 
            padding: 14px 20px 14px 55px; 
            border: 2px solid var(--border-color); 
            border-radius: 50px; 
            outline: none; 
            font-size: 1rem; 
            transition: 0.3s; 
            background: #F8FAFC; 
            box-sizing: border-box; /* Previene que sobresalga */
            display: block;
        }
        .search-input:focus { border-color: var(--electric-blue); background: white; box-shadow: 0 0 15px rgba(0,82,212,0.1); }
        
        .search-container i {
            position: absolute; 
            left: 22px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: var(--action-grey); 
            font-size: 1.1rem;
            pointer-events: none;
        }
        
        .product-grid { flex: 1; overflow-y: auto; margin-top: 20px; }
        .product-card { display: grid; grid-template-columns: 1fr 100px 90px 40px; align-items: center; padding: 14px; border-bottom: 1px solid #F1F5F9; cursor: pointer; transition: 0.2s; }
        .product-card:hover { background: #F8FAFC; border-radius: 12px; }

        /* Botones de Acción (Estilo Gris Profesional) */
        .action-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-top: 20px; border-top: 2px solid #F8FAFC; margin-top: 15px; }
        .btn-action { border: 1px solid var(--border-color); background: #F8FAFC; padding: 15px; border-radius: 15px; color: var(--action-grey); font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; transition: 0.3s; }
        .btn-action:hover { background: var(--action-grey); color: white; transform: translateY(-2px); }
        .btn-action i { margin-bottom: 6px; font-size: 1.1rem; }
        .btn-action small { font-weight: 400; font-size: 0.6rem; opacity: 0.7; margin-top: 2px; }

        /* Panel Derecho (Carrito) */
        .panel-cart { flex: 1; background: var(--white); border-radius: 25px; display: flex; flex-direction: column; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); border-top: 8px solid var(--primary-dark); }
        .cart-list { flex: 1; overflow-y: auto; margin-bottom: 20px; }
        .cart-item { padding: 15px; border: 1px solid #F1F5F9; border-radius: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; }
        .cart-item.selected { background: #F1F5F9; border-left: 5px solid var(--primary-dark); border-color: var(--border-color); }
        
        .checkout-footer { display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px; }
        .total-box { background: #F8FAFC; color: var(--primary-dark); padding: 15px; border-radius: 20px; text-align: center; border: 2px solid var(--border-color); }
        
        /* Botón F9 Persuasivo */
        .btn-pay { border: none; border-radius: 20px; background: linear-gradient(135deg, #002D72 0%, #001A3D 100%); color: white; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.4s; box-shadow: 0 6px 15px rgba(0, 26, 61, 0.2); }
        .btn-pay:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0, 45, 114, 0.3); }
        .btn-pay:disabled { background: #CBD5E1; cursor: not-allowed; box-shadow: none; }
        .btn-pay small { display: block; font-size: 0.65rem; font-weight: 400; text-transform: uppercase; letter-spacing: 1px; margin-top: 3px; opacity: 0.8; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,13,26,0.8); backdrop-filter: blur(8px); }
        .modal-content { background: white; margin: 8% auto; padding: 40px; border-radius: 30px; width: 90%; max-width: 420px; text-align: center; }
    </style>
</head>
<body oncontextmenu="return false">

    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

    <div id="capaBloqueo">
        <div class="licencia-card">
            <h2 style="color: var(--primary-dark); margin-bottom: 10px;">Activar Licencia</h2>
            <p style="font-size: 0.9rem; color: var(--action-grey); margin-bottom: 20px;">Sistematikos - Frank Hernandez</p>
            <textarea id="inputToken" placeholder="Pegue el código de activación aquí..." style="width:100%; height:120px; border-radius:15px; padding:15px; border:2px solid #E2E8F0; resize:none; font-family:monospace; font-size:0.8rem;"></textarea>
            <button class="btn-pay" style="width:100%; margin-top:20px; padding:18px;" onclick="validarYActivar()">ACTIVAR SISTEMA <small>[F9]</small></button>
        </div>
    </div>

    <header class="header-sales">
        <div id="nombreEmpresa" style="font-weight: 800; font-size: 1.2rem; letter-spacing: 1px;">YOU CONTROL</div>
        <div class="tasa-badge">TASA OFICIAL: <span id="txt-tasa">0.00</span> Bs.</div>
    </header>

    <div class="pos-container">
        <div class="panel-left">
            <div class="search-container">
                <i class="fas fa-barcode"></i>
                <input type="text" id="inputBusqueda" class="search-input" placeholder="Escanear código o buscar..." onkeyup="filtrarVenta()" autofocus>
            </div>
            
            <div id="grid-productos" class="product-grid"></div>

            <div class="action-bar">
                <button class="btn-action" onclick="ejecutarAccion('cantidad')">
                    <i class="fas fa-calculator"></i> CANTIDAD <small>[F5]</small>
                </button>
                <button class="btn-action" onclick="ejecutarAccion('precio')">
                    <i class="fas fa-tag"></i> PRECIO <small>[F4]</small>
                </button>
                <button class="btn-action" onclick="ejecutarAccion('eliminar')">
                    <i class="fas fa-trash-alt"></i> ELIMINAR <small>[F6]</small>
                </button>
            </div>
        </div>

        <div class="panel-cart">
            <h3 style="margin:0 0 15px 0; color: var(--primary-dark); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Resumen de Venta</h3>
            <div id="lista-carrito" class="cart-list"></div>
            
            <div class="checkout-footer">
                <div class="total-box">
                    <span id="total-usd" style="font-size:1.8rem; font-weight:800; display:block;">$ 0.00</span>
                    <span id="total-bs" style="font-size:0.9rem; opacity:0.7; font-weight:600;">0.00 Bs.</span>
                </div>
                <button id="btnCobrar" class="btn-pay" onclick="gestionarF9()">
                    COBRAR
                    <small>[F9]</small>
                </button>
            </div>
        </div>
    </div>

    <div id="modalPago" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--primary-dark); margin:0;">Confirmar Pago</h2>
            <div id="totalModal" style="font-size: 2.5rem; font-weight: 800; margin: 20px 0;">$0.00</div>
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:25px;">
                <button id="pay-div" class="btn-action" onclick="setMetodo('Divisas')" style="padding:20px; background:#F1F5F9;">DIVISAS</button>
                <button id="pay-bs" class="btn-action" onclick="setMetodo('Bolivares')" style="padding:20px; background:#F1F5F9;">BOLÍVARES</button>
            </div>
            
            <button class="btn-pay" style="width:100%; padding:20px;" onclick="procesarVenta()">
                REGISTRAR VENTA
                <small>[F9]</small>
            </button>
            <p onclick="cerrarModal()" style="margin-top:20px; cursor:pointer; color:#94A3B8; font-weight:600;">Regresar</p>
        </div>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, onSnapshot, doc, addDoc, updateDoc, increment, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const UID = "sUhfZI9Fy3M9UlInTYw2wFWZmB12";
        let tasaActual = 0, masterStock = [], carrito = [], metodoPago = "Divisas", idSeleccionado = null;

        window.addEventListener('keydown', (e) => {
            if (["F4", "F5", "F6", "F9"].includes(e.key)) e.preventDefault();
            if (e.key === "F4") ejecutarAccion('precio');
            if (e.key === "F5") ejecutarAccion('cantidad');
            if (e.key === "F6") ejecutarAccion('eliminar');
            if (e.key === "F9") gestionarF9();
        });

        window.gestionarF9 = () => {
            const modal = document.getElementById('modalPago');
            if (window.getComputedStyle(modal).display === 'block') {
                procesarVenta();
            } else if (carrito.length > 0) {
                abrirModalPago();
            }
        };

        window.ejecutarAccion = (tipo) => {
            if (!idSeleccionado) return;
            if (tipo === 'cantidad') cambiarCantidad(idSeleccionado);
            if (tipo === 'precio') cambiarPrecio(idSeleccionado);
            if (tipo === 'eliminar') eliminarItem(idSeleccionado);
        };

        window.filtrarVenta = () => {
            const input = document.getElementById('inputBusqueda');
            const query = input.value.trim();
            if (!query) { renderizarVenta(masterStock); return; }

            const p = masterStock.find(p => p.codigo === query);
            if (p) {
                document.getElementById('beepSound').play();
                sumarAlCarrito(p.id);
                input.value = "";
            } else {
                const filtrados = masterStock.filter(p => p.nombre.toLowerCase().includes(query.toLowerCase()));
                renderizarVenta(filtrados);
            }
        };

        window.sumarAlCarrito = (id) => {
            const p = masterStock.find(item => item.id === id);
            if (!p || p.stock <= 0) return;
            const existe = carrito.find(c => c.id === id);
            if (existe) existe.cantidad++;
            else carrito.push({ ...p, cantidad: 1, costoBase: p.costo || 0 });
            
            idSeleccionado = id;
            actualizarUI();
            document.getElementById('inputBusqueda').focus();
        };

        function actualizarUI() {
            const box = document.getElementById('lista-carrito');
            box.innerHTML = ""; let sub = 0;
            carrito.forEach(c => {
                const total = c.precio * c.cantidad; sub += total;
                const sel = idSeleccionado === c.id;
                box.innerHTML += `
                    <div class="cart-item ${sel ? 'selected' : ''}" onclick="idSeleccionado='${c.id}'; actualizarUI();">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span><b style="color:var(--electric-blue);">${c.cantidad}x</b> ${c.nombre}</span>
                            <b style="font-size:1.1rem;">$${total.toFixed(2)}</b>
                        </div>
                    </div>`;
            });
            document.getElementById('total-usd').innerText = `$ ${sub.toFixed(2)}`;
            document.getElementById('total-bs').innerText = `${(sub * tasaActual).toLocaleString('es-VE')} Bs.`;
            document.getElementById('btnCobrar').disabled = carrito.length === 0;
            box.scrollTop = box.scrollHeight;
        }

        window.setMetodo = (m) => {
            metodoPago = m;
            document.getElementById('pay-div').style.background = m === 'Divisas' ? '#001A3D' : '#F1F5F9';
            document.getElementById('pay-div').style.color = m === 'Divisas' ? 'white' : '#475569';
            document.getElementById('pay-bs').style.background = m === 'Bolivares' ? '#001A3D' : '#F1F5F9';
            document.getElementById('pay-bs').style.color = m === 'Bolivares' ? 'white' : '#475569';
        };

        window.cambiarCantidad = (id) => {
            const item = carrito.find(c => c.id === id);
            const n = prompt(`Cantidad para ${item.nombre}:`, item.cantidad);
            if (n && !isNaN(n) && n > 0) { item.cantidad = parseFloat(n); actualizarUI(); }
        };

        window.cambiarPrecio = (id) => {
            const item = carrito.find(c => c.id === id);
            const p = prompt(`Precio para ${item.nombre} (Costo: $${item.costoBase}):`, item.precio);
            if (p && !isNaN(p)) {
                if (parseFloat(p) < item.costoBase) alert("Precio por debajo del costo.");
                else { item.precio = parseFloat(p); actualizarUI(); }
            }
        };

        window.eliminarItem = (id) => {
            carrito = carrito.filter(c => c.id !== id);
            idSeleccionado = carrito.length > 0 ? carrito[carrito.length-1].id : null;
            actualizarUI();
        };

        window.abrirModalPago = () => {
            document.getElementById('totalModal').innerText = document.getElementById('total-usd').innerText;
            document.getElementById('modalPago').style.display = 'block';
            setMetodo('Divisas');
        };

        window.cerrarModal = () => document.getElementById('modalPago').style.display = 'none';

        window.procesarVenta = async () => {
            try {
                const btn = document.querySelector('#modalPago .btn-pay');
                btn.disabled = true; btn.innerText = "REGISTRANDO...";
                
                await addDoc(collection(db, "usuarios", UID, "ventas"), {
                    fecha: new Date().toLocaleString(),
                    items: carrito,
                    total: carrito.reduce((s,i) => s+(i.precio*i.cantidad), 0),
                    metodo: metodoPago,
                    tasa: tasaActual
                });

                for (let i of carrito) {
                    await updateDoc(doc(db, "usuarios", UID, "productos", i.id), { stock: increment(-i.cantidad) });
                }

                alert("Venta Completada");
                carrito = []; idSeleccionado = null; actualizarUI(); cerrarModal();
                btn.disabled = false; btn.innerHTML = `REGISTRAR VENTA <small>[F9]</small>`;
            } catch (e) { alert("Error de conexión"); btn.disabled = false; }
        };

        onSnapshot(doc(db, "usuarios", UID, "configuracion", "tasa"), (s) => {
            if (s.exists()) { 
                tasaActual = s.data().valor; 
                document.getElementById('txt-tasa').innerText = tasaActual.toLocaleString('es-VE'); 
            }
        });

        onSnapshot(collection(db, "usuarios", UID, "productos"), (s) => {
            masterStock = []; s.forEach(d => masterStock.push({id: d.id, ...d.data()}));
            renderizarVenta(masterStock);
        });

        window.renderizarVenta = (l) => {
            const g = document.getElementById('grid-productos'); g.innerHTML = "";
            l.forEach(p => {
                g.innerHTML += `<div class="product-card" onclick="sumarAlCarrito('${p.id}')">
                    <b>${p.nombre}</b>
                    <span style="text-align:right; font-weight:700;">$${p.precio.toFixed(2)}</span>
                    <span style="text-align:right; color:#94A3B8; font-size:0.8rem;">Stock: ${p.stock}</span>
                    <i class="fas fa-plus-circle" style="text-align:right; color:var(--electric-blue)"></i>
                </div>`;
            });
        };
    </script>
</body>
</html>
