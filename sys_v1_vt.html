<audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

<script type="module">
    import { db } from './js/firebase-config.js';
    import { collection, onSnapshot, doc, addDoc, updateDoc, increment, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const UID = "sUhfZI9Fy3M9UlInTYw2wFWZmB12";
    let tasaActual = 0, masterStock = [], carrito = [], metodoPago = "Divisas", idSeleccionado = null;

    // --- LÓGICA DE ESCÁNER Y BÚSQUEDA ---
    window.filtrarVenta = () => {
        const input = document.getElementById('inputBusqueda');
        const query = input.value.trim();

        if (!query) {
            renderizarVenta(masterStock);
            return;
        }

        // 1. Intentar encontrar coincidencia exacta (Código de Barras)
        const coincidenciaExacta = masterStock.find(p => p.codigo === query || p.id === query);

        if (coincidenciaExacta) {
            // Suena el BEEP
            document.getElementById('beepSound').play();
            
            // Agregar al carrito
            sumarAlCarrito(coincidenciaExacta.id);
            
            // Limpiar buscador y mantener el foco para el siguiente escaneo
            input.value = "";
            input.focus();
        } else {
            // 2. Si no es código de barras, filtrar por nombre (Búsqueda manual)
            const filtrados = masterStock.filter(p => 
                p.nombre.toLowerCase().includes(query.toLowerCase())
            );
            renderizarVenta(filtrados);
        }
    };

    // --- ACCESO RÁPIDO POR TECLADO ---
    window.addEventListener('keydown', function(e) {
        // Bloqueamos funciones nativas del navegador
        if (["F4", "F5", "F6"].includes(e.key)) {
            e.preventDefault();
        }

        // Si el carrito está vacío, no hacemos nada
        if (carrito.length === 0 && ["F4", "F5", "F6"].includes(e.key)) return;

        // F4: Cambiar Precio
        if (e.key === "F4") cambiarPrecio(idSeleccionado);
        
        // F5: Cambiar Cantidad
        if (e.key === "F5") cambiarCantidad(idSeleccionado);
        
        // F6: Eliminar Item
        if (e.key === "F6") eliminarItem(idSeleccionado);

        // ENTER: Cobrar
        if (e.key === "Enter" && carrito.length > 0) {
            const modal = document.getElementById('modalPago');
            if (window.getComputedStyle(modal).display === 'none') {
                abrirModalPago();
            }
        }
    });

    // --- GESTIÓN DEL CARRITO ---
    window.sumarAlCarrito = (id) => {
        const p = masterStock.find(item => item.id === id);
        if (!p || p.stock <= 0) return;

        const existe = carrito.find(c => c.id === id);
        if (existe) {
            existe.cantidad++;
        } else {
            // Insertamos al principio o manejamos como el más reciente
            carrito.push({ ...p, cantidad: 1, costoBase: p.costo || 0 });
        }
        
        // El último producto ingresado es el seleccionado por defecto para F4, F5, F6
        idSeleccionado = id;
        actualizarUI();
    };

    window.seleccionarParaEditar = (id) => {
        idSeleccionado = id;
        actualizarUI();
    };

    function actualizarUI() {
        const box = document.getElementById('lista-carrito');
        box.innerHTML = ""; 
        let subtotal = 0;

        // Renderizamos de forma que el último aparezca resaltado si es el idSeleccionado
        carrito.forEach(c => {
            const totalItem = c.precio * c.cantidad;
            subtotal += totalItem;
            const esSeleccionado = idSeleccionado === c.id;

            box.innerHTML += `
                <div class="cart-item ${esSeleccionado ? 'selected' : ''}" 
                     onclick="seleccionarParaEditar('${c.id}')"
                     style="border: 1px solid #EEE; padding: 10px; border-radius: 10px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; ${esSeleccionado ? 'background: #EBF4FF; border-color: #0052D4;' : ''}">
                    <div class="item-row" style="display: flex; justify-content: space-between;">
                        <span><b style="color: #0052D4;">${c.cantidad}x</b> ${c.nombre}</span>
                        <span style="font-weight: 800;">$${totalItem.toFixed(2)}</span>
                    </div>
                </div>`;
        });

        document.getElementById('total-usd').innerText = `$ ${subtotal.toFixed(2)}`;
        document.getElementById('total-bs').innerText = `${(subtotal * tasaActual).toLocaleString('es-VE')} Bs.`;
        document.getElementById('btnCobrar').disabled = carrito.length === 0;
        
        // Hacer scroll automático al último producto agregado
        box.scrollTop = box.scrollHeight;
    }

    // --- ACCIONES DE EDICIÓN ---
    window.cambiarCantidad = (id) => {
        const item = carrito.find(c => c.id === id);
        if(!item) return;
        const n = prompt(`Nueva cantidad para: ${item.nombre}`, item.cantidad);
        if (n && !isNaN(n) && n > 0) {
            item.cantidad = parseFloat(n);
            actualizarUI();
        }
    };

    window.cambiarPrecio = (id) => {
        const item = carrito.find(c => c.id === id);
        if(!item) return;
        const p = prompt(`Nuevo precio para: ${item.nombre} (Costo: $${item.costoBase})`, item.precio);
        if (p && !isNaN(p)) {
            const nuevoPrc = parseFloat(p);
            if (nuevoPrc < item.costoBase) {
                alert("¡Error! El precio no puede ser menor al costo de adquisición.");
            } else {
                item.precio = nuevoPrc;
                actualizarUI();
            }
        }
    };

    window.eliminarItem = (id) => {
        if(!id) return;
        carrito = carrito.filter(c => c.id !== id);
        idSeleccionado = carrito.length > 0 ? carrito[carrito.length - 1].id : null;
        actualizarUI();
    };

    // ... Resto de tus funciones de Firebase y Cobro ...
</script>
