<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS | You Control - Pago Mixto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --midnight-dark: #001A3D; 
            --midnight-gradient: linear-gradient(135deg, #002D72 0%, #001A3D 100%);
            --electric-blue: #0052D4;
            --vinotinto: #800020; 
            --bg-body: #F1F5F9; 
            --white: #FFFFFF;
            --border-color: #E2E8F0;
            --action-grey: #475569;
        }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg-body); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header-sales { background: var(--midnight-gradient); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--vinotinto); }
        .tasa-badge { background: rgba(255, 255, 255, 0.1); padding: 8px 18px; border-radius: 10px; font-weight: 800; border: 1px solid rgba(255,255,255,0.2); }
        
        .shortcuts-bar { display: flex; gap: 15px; padding: 10px 30px; background: #e2e8f0; font-size: 0.75rem; font-weight: 600; color: #475569; }

        .pos-container { display: flex; flex: 1; gap: 20px; padding: 20px; overflow: hidden; }
        .panel-left, .panel-cart { background: var(--white); border-radius: 25px; display: flex; flex-direction: column; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
        .panel-left { flex: 1.4; }
        .panel-cart { flex: 1; border-top: 8px solid var(--midnight-dark); }

        .product-grid, .cart-list { flex: 1; overflow-y: auto; margin-top: 20px; }
        .product-card { display: grid; grid-template-columns: 1fr 100px 40px; align-items: center; padding: 14px; border-bottom: 1px solid #F1F5F9; cursor: pointer; }
        .item-selected { border: 2px solid var(--electric-blue) !important; background: #EBF4FF !important; border-radius: 15px; }

        /* MODAL CENTRADO */
        .modal { 
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,13,26,0.85); 
            backdrop-filter: blur(10px); 
            justify-content: center; /* Centrado Horizontal */
            align-items: center;     /* Centrado Vertical */
        }
        .modal-content { 
            background: white; 
            padding: 30px; 
            border-radius: 30px; 
            width: 90%; 
            max-width: 480px; 
            text-align: center; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .btn-action-metodo {
            border: 2px solid #E2E8F0; background: #F8FAFC; padding: 15px 5px; border-radius: 15px;
            color: var(--action-grey); font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 0.7rem;
        }
        
        .input-pago-group { display: flex; align-items: center; background: #F8FAFC; border: 2px solid #E2E8F0; border-radius: 15px; padding: 10px 20px; margin-bottom: 10px; }
        .input-pago-group input { border: none; background: transparent; outline: none; width: 100%; font-size: 1.3rem; font-weight: 700; text-align: right; color: var(--midnight-dark); }
        
        .status-badge { padding: 12px; border-radius: 12px; font-weight: 800; margin: 15px 0; }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .status-complete { background: #D1FAE5; color: #065F46; }

        .btn-pay { border: none; border-radius: 20px; background: var(--midnight-gradient); color: white; font-weight: 800; cursor: pointer; padding: 18px; width: 100%; }
        .btn-pay:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body oncontextmenu="return false">
    <audio id="beepSound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

    <header class="header-sales">
        <div class="header-brand">YOU CONTROL <small>| SISTEMATIKOS</small></div>
        <div class="tasa-badge">TASA: <span id="txt-tasa">0,00</span> Bs.</div>
    </header>

    <div class="shortcuts-bar">
        <span>F4: CANTIDAD</span> | <span>F5: PRECIO</span> | <span>F6: BORRAR</span> | <span>F9: COBRAR</span>
    </div>

    <div class="pos-container">
        <div class="panel-left">
            <input type="text" id="inputBusqueda" style="width:100%; padding:15px; border-radius:50px; border:2px solid var(--border-color); box-sizing: border-box;" placeholder="Buscar producto...">
            <div id="grid-productos" class="product-grid"></div>
        </div>

        <div class="panel-cart">
            <div id="lista-carrito" class="cart-list"></div>
            <div style="background:#F8FAFC; padding:20px; border-radius:20px; text-align:center; border:2px solid var(--border-color); margin-bottom:15px;">
                <span id="total-usd" style="font-size:2.5rem; font-weight:800; display:block;">$ 0.00</span>
                <span id="total-bs" style="font-size:1.1rem; opacity:0.7; font-weight:600;">0,00 Bs.</span>
            </div>
            <button id="btnCobrar" class="btn-pay">COBRAR [F9]</button>
        </div>
    </div>

    <!-- MODAL DE PAGO -->
    <div id="modalPago" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--midnight-dark); margin: 0 0 15px 0;">Confirmar Cobro</h2>
            
            <div style="background: var(--midnight-dark); color: white; padding: 20px; border-radius: 20px; margin-bottom: 20px;">
                <small style="opacity: 0.8;">MONTO TOTAL</small>
                <div id="totalModalUSD" style="font-size: 2.8rem; font-weight: 800;">$ 0.00</div>
                <div id="totalModalBS" style="font-size: 1.1rem; opacity: 0.8;">0,00 Bs.</div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px;">
                <button class="btn-action-metodo" onclick="autoCompletar('punto')"><i class="fas fa-credit-card"></i> PUNTO</button>
                <button class="btn-action-metodo" onclick="autoCompletar('pagomovil')"><i class="fas fa-mobile-alt"></i> P. MOVIL</button>
                <button class="btn-action-metodo" onclick="autoCompletar('divisas')"><i class="fas fa-dollar-sign"></i> DIVISAS</button>
                <button class="btn-action-metodo" onclick="autoCompletar('efectivo')"><i class="fas fa-money-bill-wave"></i> EFEC. BS</button>
            </div>

            <div class="input-pago-group"><label style="font-size:0.6rem; width:80px;">PUNTO BS</label><input type="number" id="in-punto-bs" value="0" step="0.01" oninput="calcularRestante()" onclick="this.select()"></div>
            <div class="input-pago-group"><label style="font-size:0.6rem; width:80px;">P.MOVIL BS</label><input type="number" id="in-pagomovil-bs" value="0" step="0.01" oninput="calcularRestante()" onclick="this.select()"></div>
            <div class="input-pago-group"><label style="font-size:0.6rem; width:80px;">EFEC. BS</label><input type="number" id="in-efectivo-bs" value="0" step="0.01" oninput="calcularRestante()" onclick="this.select()"></div>
            <div class="input-pago-group" style="border-color: var(--electric-blue);"><label style="font-size:0.6rem; width:80px; color:var(--electric-blue);">DIVISAS $</label><input type="number" id="in-divisas-usd" value="0" step="0.01" oninput="calcularRestante()" onclick="this.select()"></div>

            <div id="pago-status" class="status-badge status-pending">PENDIENTE: <span id="txt-restante">$ 0.00</span></div>
            <button id="btnConfirmarVenta" class="btn-pay" disabled>REGISTRAR VENTA</button>
            <p id="btnCerrarModal" style="margin-top:20px; cursor:pointer; color:var(--action-grey); font-size:0.8rem; font-weight:600;">Cerrar y Volver</p>
        </div>
    </div>

    <script type="module" src="./js/pos-core.js"></script>
</body>
</html>
