<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU CONTROL - POS PROFESIONAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #006aff; --bg-main: #f1f5f9; --border-color: #cbd5e1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .navbar { background: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); }
        .main-container { display: grid; grid-template-columns: 1fr 400px; gap: 20px; padding: 20px; height: calc(100vh - 60px); }
        
        /* Paneles */
        .left-panel { display: flex; flex-direction: column; gap: 15px; }
        .search-box { position: relative; background: white; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); }
        .product-grid { flex: 1; background: white; border-radius: 8px; overflow-y: auto; padding: 15px; border: 1px solid var(--border-color); }
        
        .right-panel { background: white; border-radius: 8px; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .cart-list { flex: 1; overflow-y: auto; padding: 10px; }
        .footer-totals { padding: 20px; border-top: 2px solid var(--border-color); background: #f8fafc; }
        
        /* Resultados Flotantes */
        .resultados-flotantes { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid var(--primary-color); border-radius: 0 0 8px 8px; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: none; max-height: 200px; overflow-y: auto; }
        
        .btn-pay { width: 100%; padding: 15px; background: var(--primary-color); color: white; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <header class="navbar">
        <div style="font-weight: 800; color: var(--primary-color);">YOU CONTROL POS</div>
        <div id="status-bar">Modo: Normal</div>
    </header>

    <main class="main-container">
        <section class="left-panel">
            <div class="search-box">
                <label>Cliente (F3)</label>
                <input type="text" id="buscar-cliente-pos" placeholder="Nombre o RIF..." style="width:100%; padding:8px;">
                <div class="resultados-flotantes" id="resultados-cliente-pos"></div>
            </div>
            <div class="search-box">
                <label>Producto (F2)</label>
                <input type="text" id="buscar-producto-pos" placeholder="Código o nombre..." style="width:100%; padding:8px;">
                <div class="resultados-flotantes" id="resultados-producto-pos"></div>
            </div>
            <div class="product-grid" id="grid-productos"></div>
        </section>

        <section class="right-panel">
            <div style="padding:15px; border-bottom:1px solid #eee; font-weight:bold;">Detalle de Venta</div>
            <div class="cart-list" id="lista-carrito"></div>
            <div class="footer-totals">
                <div id="total-usd" style="font-size:24px; font-weight:800; color:var(--primary-color); text-align:right;">$ 0.00</div>
                <div id="total-bs" style="text-align:right; color:#64748b;">0,00 Bs.</div>
                <button class="btn-pay" id="btnConfirmarVenta" onclick="window.abrirModalCobro()">PROCESAR PAGO [F9]</button>
            </div>
        </section>
    </main>

    <div id="modalPago" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:9999;">
        <div style="background:white; padding:20px; border-radius:8px; width:400px;">
            <h3>Registrar Cobro</h3>
            <button onclick="window.registrarVenta()" style="width:100%; padding:15px; margin-top:20px; background:green; color:white; border:none; border-radius:6px;">CONFIRMAR VENTA</button>
        </div>
    </div>

    <script type="module" src="js/pos-core.js"></script>
    <script>
        window.abrirModalCobro = () => document.getElementById('modalPago').style.display = 'flex';
        document.addEventListener('keydown', (e) => {
            if(e.key === 'F9') window.abrirModalCobro();
            if(e.key === 'F2') document.getElementById('buscar-producto-pos').focus();
        });
    </script>
</body>
</html>
