<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Control | Validación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary-blue: #002D72; --electric-blue: #0052D4; --bg: #001432; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .licencia-modal { background: white; padding: 40px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        textarea { width: 100%; height: 100px; border-radius: 12px; padding: 12px; border: 2px solid #E2E8F0; font-family: monospace; margin-bottom: 20px; box-sizing: border-box; }
        .btn-act { background: var(--electric-blue); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 700; cursor: pointer; }
        .oculto { display: none !important; }
    </style>
</head>
<body>

    <div id="pantallaCarga" style="color:white; text-align:center;">
        <i class="fas fa-circle-notch" style="font-size:3rem; animation: spin 1s linear infinite;"></i>
        <p>Verificando Licencia...</p>
    </div>

    <div id="capaSeguridad" class="oculto">
        <div class="licencia-modal">
            <h2>You Control</h2>
            <p>Introduce tu clave de activación</p>
            <textarea id="tokenInput" placeholder="Pega el token aquí..."></textarea>
            <button class="btn-act" onclick="procesarActivacion()">ACTIVAR SISTEMA</button>
            <p id="msgError" style="color:red; display:none; font-size:0.8rem; margin-top:10px;">Error: Licencia inválida o límite alcanzado.</p>
        </div>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ID de hardware estable para móviles
        const getHardwareID = () => btoa(navigator.userAgent + navigator.language);

        window.procesarActivacion = async () => {
            const rawToken = document.getElementById('tokenInput').value.trim();
            const btn = document.querySelector('.btn-act');
            if (!rawToken) return;
            
            btn.disabled = true;
            btn.innerText = "VERIFICANDO...";
            
            try {
                const data = JSON.parse(atob(rawToken));
                const hwID = getHardwareID();
                const docRef = doc(db, "licencias", data.activation_id);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    const dbData = snap.data();
                    if (!dbData.equipos.includes(hwID) && dbData.equipos.length >= dbData.limite) {
                        throw new Error("Límite alcanzado");
                    }
                    if (!dbData.equipos.includes(hwID)) {
                        await updateDoc(docRef, { equipos: [...dbData.equipos, hwID] });
                    }
                } else {
                    await setDoc(docRef, { cliente: data.n, limite: data.l, equipos: [hwID], fecha: new Date().toISOString() });
                }

                localStorage.setItem('licencia_youcontrol', rawToken);
                localStorage.setItem('youcontrol_empresa_id', data.activation_id);
                localStorage.setItem('licencia_validada', 'true');
                window.location.replace("sys_v1_menu.html");
            } catch (e) {
                document.getElementById('msgError').style.display = 'block';
                btn.disabled = false;
                btn.innerText = "ACTIVAR SISTEMA";
            }
        };

        // Lógica de carga
        window.addEventListener('load', () => {
            if (localStorage.getItem('licencia_youcontrol')) {
                window.location.replace("sys_v1_menu.html");
            } else {
                document.getElementById('pantallaCarga').classList.add('oculto');
                document.getElementById('capaSeguridad').classList.remove('oculto');
            }
        });
    </script>
</body>
</html>
