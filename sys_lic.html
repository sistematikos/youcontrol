<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>You Control | Activación</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary-blue: #002D72; --electric-blue: #0052D4; --bg: #001432; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .licencia-modal { background: white; padding: 30px; border-radius: 24px; width: 85%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        textarea { width: 100%; height: 80px; border-radius: 12px; padding: 12px; border: 2px solid #E2E8F0; font-family: monospace; margin-bottom: 20px; box-sizing: border-box; resize: none; font-size: 0.9rem; }
        .btn-act { background: var(--electric-blue); color: white; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-act:disabled { background: #94A3B8; }
        .oculto { display: none !important; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="pantallaCarga" style="color:white; text-align:center;">
        <i class="fas fa-circle-notch" style="font-size:3rem; animation: spin 1s linear infinite;"></i>
        <p>Verificando seguridad...</p>
    </div>

    <div id="capaSeguridad" class="oculto">
        <div class="licencia-modal">
            <h2 style="color:var(--primary-blue);">You Control</h2>
            <p style="font-size: 0.9rem; color: #64748b;">Introduce tu clave de activación</p>
            <textarea id="tokenInput" placeholder="Pega el token aquí..."></textarea>
            <button class="btn-act" onclick="procesarActivacion()">ACTIVAR SISTEMA</button>
            <p id="msgError" style="color:red; display:none; font-size:0.75rem; margin-top:15px;"></p>
        </div>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const getHardwareID = () => btoa(navigator.userAgent + navigator.language);

        window.procesarActivacion = async () => {
            const rawToken = document.getElementById('tokenInput').value.trim();
            const btn = document.querySelector('.btn-act');
            const msgError = document.getElementById('msgError');
            
            if (!rawToken) return;
            
            btn.disabled = true;
            btn.innerText = "VERIFICANDO...";
            msgError.style.display = 'none';
            
            try {
                const data = JSON.parse(atob(rawToken));
                const hwID = getHardwareID();
                const docRef = doc(db, "licencias", data.activation_id);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    const dbData = snap.data();
                    // Limpieza y validación de array de equipos
                    const equipos = Array.isArray(dbData.equipos) ? dbData.equipos.filter(e => e && e.length > 0) : [];
                    
                    if (!equipos.includes(hwID) && equipos.length >= dbData.limite) {
                        throw new Error("Límite de dispositivos alcanzado.");
                    }
                    if (!equipos.includes(hwID)) {
                        await updateDoc(docRef, { equipos: [...equipos, hwID] });
                    }
                } else {
                    // Creación inicial si no existe
                    await setDoc(docRef, { 
                        cliente: data.n, 
                        limite: data.l, 
                        equipos: [hwID], 
                        fecha: new Date().toISOString() 
                    });
                }

                localStorage.setItem('licencia_youcontrol', rawToken);
                localStorage.setItem('youcontrol_empresa_id', data.activation_id);
                localStorage.setItem('licencia_validada', 'true');
                
                window.location.replace("sys_v1_menu.html");
                
            } catch (e) {
                msgError.innerText = "Error: " + e.message;
                msgError.style.display = 'block';
                btn.disabled = false;
                btn.innerText = "ACTIVAR SISTEMA";
            }
        };

        window.addEventListener('load', () => {
            if (localStorage.getItem('licencia_validada') === 'true') {
                window.location.replace("sys_v1_menu.html");
            } else {
                document.getElementById('pantallaCarga').classList.add('oculto');
                document.getElementById('capaSeguridad').classList.remove('oculto');
            }
        });
    </script>
</body>
</html>
