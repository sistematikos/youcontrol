<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>YOU CONTROL | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --light-bg: #F1F5F9; 
            --blue-electric: #3B82F6; 
            --menu-bg: #FFFFFF; /* Colores claros para el menú */
            --text-color: #1E293B;
        }
        body { font-family: 'Poppins', sans-serif; background: var(--light-bg); margin: 0; padding-bottom: 50px; }
        .main-wrapper { width: 92%; max-width: 1200px; margin: 20px auto; }

        /* Menú cascada claro alineado al banner */
        .erp-navbar { background: var(--menu-bg); padding: 10px 20px; display: flex; gap: 30px; border-radius: 12px 12px 0 0; border: 1px solid #E2E8F0; }
        .dropdown { cursor: pointer; font-size: 0.8rem; font-weight: 600; color: var(--text-color); padding: 10px; }
        .dropdown:hover { color: var(--blue-electric); }
        .dropdown-content { display: none; position: absolute; background: white; min-width: 180px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 8px; z-index: 1000; }
        .dropdown-content a { color: var(--text-color); padding: 10px; text-decoration: none; display: block; font-size: 0.8rem; }
        .dropdown:hover .dropdown-content { display: block; }

        /* Banner más corto */
        .banner { width: 100%; height: 120px; overflow: hidden; border-radius: 0 0 12px 12px; border: 1px solid #E2E8F0; }
        .banner img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Grid de tarjetas originales */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { background: white; padding: 20px; border-radius: 12px; text-align: center; border: 2px solid #E2E8F0; text-decoration: none; color: var(--text-color); }
        
        /* Colores de tarjetas específicos */
        .card-clientes { border-top: 5px solid #10B981; } /* Verde */
        .card-productos { border-top: 5px solid #F59E0B; } /* Naranja */
        .card-ingreso { border-top: 5px solid #8B5CF6; } /* Morado */
        .card-ventas { border-top: 5px solid #06B6D4; } /* Cian */
        
        .license-card { position: fixed; bottom: 30px; left: 30px; background: white; padding: 20px; border-radius: 12px; border-left: 6px solid var(--blue-electric); box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 250px; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <nav class="erp-navbar">
        <div class="dropdown">ARCHIVO ▼
            <div class="dropdown-content"><a href="sys_config.html">Configuración</a></div>
        </div>
        <div class="dropdown">REPORTES ▼
            <div class="dropdown-content"><a href="sys_v4_reportes.html">Estadísticas</a></div>
        </div>
        <div class="dropdown">OPERACIONES ▼
            <div class="dropdown-content"><a href="sys_v5_anular.html">Anulaciones</a><a href="sys_v1_dep.html">Departamentos</a></div>
        </div>
    </nav>

    <div class="banner"><img src="img/youcontrol.png" alt="Banner"></div>

    <div class="grid-container">
        <a href="#" class="card card-clientes"><i class="fas fa-users"></i><p>CLIENTES</p></a>
        <a href="sys_v3_ficha.html" class="card card-productos"><i class="fas fa-box"></i><p>PRODUCTOS TERMINADOS</p></a>
        <a href="sys_v3_comp.html" class="card card-ingreso"><i class="fas fa-cart-plus"></i><p>INGRESO</p></a>
        <a href="sys_v1_vt.html" class="card card-ventas"><i class="fas fa-cash-register"></i><p>VENTAS (POS)</p></a>
    </div>
</div>

<div class="license-card" id="lblEmpresa">
    <h4 style="margin:0;"><i class="fas fa-shield-alt"></i> Licencia Activa</h4>
    <p style="margin:5px 0 0; font-size: 0.8rem;" id="emp-data">Cargando...</p>
</div>

</body>
</html>
