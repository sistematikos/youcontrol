<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU CONTROL | ERP System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --navy: #002A54;
            --bg-gray: #E0E7FF;
            --white: #FFFFFF;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-gray); margin: 0; }
        
        /* Barra superior tipo ERP */
        .erp-navbar { background: var(--navy); color: var(--white); padding: 10px 20px; display: flex; gap: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .dropdown { position: relative; display: inline-block; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
        .dropdown-content { display: none; position: absolute; background-color: var(--white); min-width: 180px; box-shadow: 0px 8px 16px rgba(0,0,0,0.2); z-index: 1000; border: 1px solid #ccc; }
        .dropdown-content a { color: #333; padding: 12px 15px; text-decoration: none; display: block; border-bottom: 1px solid #eee; font-size: 0.85rem; }
        .dropdown-content a:hover { background-color: var(--navy); color: var(--white); }
        .dropdown:hover .dropdown-content { display: block; }
        
        /* Banner y área principal */
        .banner-container { width: 92%; max-width: 1200px; margin: 30px auto; background: var(--white); padding: 20px; border-radius: 8px; border: 1px solid #ccc; text-align: center; }
        .banner-info { color: var(--navy); font-size: 1.2rem; font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false">

    <!-- Menú tipo ERP -->
    <nav class="erp-navbar">
        <div class="dropdown">Archivo ▼
            <div class="dropdown-content">
                <a href="sys_config.html">Configuración</a>
                <a href="index_menu.html">Inicio</a>
            </div>
        </div>
        <div class="dropdown">Inventario ▼
            <div class="dropdown-content">
                <a href="sys_v1_inv.html">Existencias</a>
                <a href="sys_v1_dep.html">Departamentos</a>
                <a href="sys_v3_ficha.html">Ficha Productos</a>
            </div>
        </div>
        <div class="dropdown">Operaciones ▼
            <div class="dropdown-content">
                <a href="sys_v3_comp.html">Compras</a>
                <a href="sys_v1_vt.html">Ventas (POS)</a>
                <a href="sys_v5_anular.html">Anulaciones</a>
            </div>
        </div>
        <div class="dropdown">Reportes ▼
            <div class="dropdown-content">
                <a href="sys_v4_reportes.html">Estadísticas</a>
            </div>
        </div>
    </nav>

    <!-- Banner Empresa -->
    <div class="banner-container">
        <div class="banner-info" id="lblEmpresa">Cargando datos de empresa...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "youcontrol-1d60a.firebaseapp.com",
            projectId: "youcontrol-1d60a",
            storageBucket: "youcontrol-1d60a.appspot.com",
            messagingSenderId: "812100760013",
            appId: "1:812100760013:web:7574906aa285555faf5484"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function cargarDatosEmpresa() {
            const empresaID = localStorage.getItem('youcontrol_empresa_id');
            const lblEmpresa = document.getElementById('lblEmpresa');
            if (empresaID) {
                try {
                    const docSnap = await getDoc(doc(db, "empresas_config", empresaID));
                    if (docSnap.exists()) {
                        const d = docSnap.data();
                        lblEmpresa.innerHTML = `SISTEMA ADMINISTRATIVO: ${d.nombre || 'N/A'} | RIF: ${d.rif || 'N/A'}`;
                    }
                } catch (e) { lblEmpresa.innerText = "Error de conexión"; }
            }
        }
        cargarDatosEmpresa();
    </script>
</body>
</html>
