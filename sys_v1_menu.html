<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Control - Menú Principal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/estilos_globales.css"> <style>
        /* --- ESTILOS DEL BANNER CORPORATIVO PREMIUM --- */
        .banner-menu-container {
            width: 100%;
            max-width: 1200px;
            margin: 25px auto 15px auto;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            position: relative;
            background: linear-gradient(135deg, #004687 0%, #002A54 100%); /* Respaldo de marca */
        }

        .banner-menu-img {
            width: 100%;
            height: auto;
            max-height: 260px; /* Altura perfecta para que no robe espacio de trabajo */
            object-fit: cover; /* Mantiene la proporción sin deformarse */
            display: block;
        }

        .banner-tag-version {
            position: absolute;
            bottom: 15px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            padding: 5px 14px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* --- CONTENEDOR DE MÓDULOS --- */
        .main-menu-content {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
            box-sizing: border-box;
        }

        .seccion-titulo {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #1E293B;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #E2E8F0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-modulos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }

        /* --- TARJETAS DEL MENÚ --- */
        .tarjeta-modulo {
            background: #ffffff;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 24px;
            text-decoration: none;
            color: #334155;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .tarjeta-modulo:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 70, 135, 0.12);
            border-color: #004687;
        }

        .icono-modulo {
            font-size: 2rem;
            color: #004687;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .tarjeta-modulo:hover .icono-modulo {
            transform: scale(1.1);
        }

        .tarjeta-modulo h3 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
            font-weight: 600;
            color: #0F172A;
        }

        .tarjeta-modulo p {
            margin: 0;
            font-size: 0.9rem;
            color: #64748B;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="main-menu-content">
        
        <div class="banner-menu-container">
            <img src="youcontrol.png" alt="You Control Banner" class="banner-menu-img">
            <div class="banner-tag-version">v3.0 Pro</div>
        </div>

        <h2 class="seccion-titulo">
            <i class="fas fa-th-large" style="color: #004687;"></i> 
            Módulos del Sistema
        </h2>
        
        <div class="grid-modulos">
            
            <a href="sys_v1_inv.html" class="tarjeta-modulo">
                <i class="fas fa-boxes icono-modulo"></i>
                <h3>Inventario General</h3>
                <p>Administración de stock, costos, márgenes de ganancia y consulta de precios en tiempo real.</p>
            </a>

            <a href="sys_v3_comp.html" class="tarjeta-modulo">
                <i class="fas fa-truck-loading icono-modulo"></i>
                <h3>Entrada de Mercancía</h3>
                <p>Asentar ingresos de stock al almacén de forma predictiva y actualizar costos al instante.</p>
            </a>

            </div>
    </div>

</body>
</html>
