<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU CONTROL | Panel Administrativo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0A192F;         /* Azul profundo corporativo */
            --bg-gradient: linear-gradient(135deg, #F1F5F9 0%, #E2E8F0 100%);
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --blue-sistematikos: #0284C7; /* Azul claro/eléctrico profesional */
            --vinotinto: #800020;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* Navbar Superior Profesional */
        .header-core {
            background-color: var(--bg-dark);
            color: white;
            text-align: center;
            padding: 35px 20px;
            border-bottom: 4px solid var(--vinotinto);
            box-shadow: 0 4px 20px rgba(10, 25, 47, 0.15);
        }

        .header-core h1 {
            margin: 0;
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .header-core p {
            margin: 8px 0 0 0;
            font-size: 0.8rem;
            color: #94A3B8;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Contenedor Principal */
        .menu-container {
            max-width: 1240px;
            width: 90%;
            margin: auto;
            padding: 40px 0;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-flex-row {
            display: flex;
            flex-direction: row;
            gap: 25px;
            width: 100%;
            justify-content: space-between;
        }

        /* Tarjetas con Sombras Suaves (Soft Shadows) y Efecto Persuasivo */
        .menu-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 45px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-dark);
            /* Sombra elegante multinivel */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 
                        0 10px 15px -3px rgba(0, 0, 0, 0.03),
                        0 20px 25px -5px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.8);
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Hover dinámico persuasivo */
        .menu-card:hover {
            transform: translateY(-8px);
            background: #FFFFFF;
            border-color: rgba(2, 132, 199, 0.3);
            box-shadow: 0 20px 25px -5px rgba(2, 132, 199, 0.1), 
                        0 10px 10px -5px rgba(2, 132, 199, 0.04);
        }

        .menu-card i {
            font-size: 2.8rem;
            color: var(--blue-sistematikos);
            margin-bottom: 22px;
            transition: transform 0.3s ease;
        }

        .menu-card:hover i {
            transform: scale(1.1);
        }

        .menu-card span {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: block;
            text-transform: uppercase;
            color: #0F172A;
        }

        .menu-card .module-id {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 12px;
            font-weight: 500;
            letter-spacing: 1px;
            background: #F1F5F9;
            padding: 4px 10px;
            border-radius: 50px;
        }

        @media (max-width: 900px) {
            .menu-flex-row {
                flex-direction: column;
            }
        }

        /* Footer de Licenciamiento */
        .footer-core {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .license-info {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(226, 232, 240, 0.8);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 500;
            color: #334155;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            margin-bottom: 15px;
        }

        .license-info strong {
            color: var(--blue-sistematikos);
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #CBD5E1;
            padding: 6px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Poppins';
            font-weight: 500;
            color: var(--text-muted);
            transition: 0.2s;
            font-size: 0.75rem;
        }

        .btn-logout:hover {
            background: #FFFFFF;
            color: #EF4444;
            border-color: #FCA5A5;
        }
    </style>
</head>
<body oncontextmenu="return false">

    <header class="header-core">
        <h1>YOU CONTROL ADMINISTRATIVO - MENU PRINCIPAL</h1>
        <p>Terminal de Gestión v3.0</p>
    </header>

    <main class="menu-container">
        <div class="menu-flex-row">
            
            <a href="sys_v1_inv.html" class="menu-card">
                <i class="fas fa-boxes-stacked"></i>
                <span>Inventario</span>
                <div class="module-id">SYS_101_INV</div>
            </a>

            <a href="sys_v3_comp.html" class="menu-card">
                <i class="fas fa-cart-plus"></i>
                <span>Entrada Mercancía</span>
                <div class="module-id">SYS_102_COMP</div>
            </a>

            <a href="sys_v1_vt.html" class="menu-card">
                <i class="fas fa-cash-register"></i>
                <span>Ventas (POS)</span>
                <div class="module-id">SYS_202_POS</div>
            </a>

            <a href="sys_v1_reportes.html" class="menu-card">
                <i class="fas fa-chart-line"></i>
                <span>Reportes</span>
                <div class="module-id">NODE_505_STATS</div>
            </a>

        </div>
    </main>

    <footer class="footer-core">
        <div>
            <div class="license-info">
                <i class="fas fa-certificate" style="color: #10B981; margin-right: 6px;"></i> 
                Licencia registrada a nombre de: <strong id="lblEmpresa">Cargando...</strong>
            </div>
        </div>
        <div style="margin-bottom: 12px; font-weight: 500; font-size: 0.75rem; opacity: 0.8;">
            Desarrollado por Sistematikos - Frank Hernandez &copy; 2026
        </div>
        <button class="btn-logout" onclick="location.href='index.html'"><i class="fas fa-power-off"></i> Cerrar Sesión</button>
    </footer>

    <script>
        function renderizarLicenciatario() {
            const token = localStorage.getItem('licencia_youcontrol');
            if (!token) {
                location.href = "index.html";
                return;
            }
            try {
                const data = JSON.parse(atob(token));
                // Inyecta el nombre real de la empresa decodificado en la etiqueta inferior
                document.getElementById('lblEmpresa').innerText = data.n || "Cliente Autorizado";
            } catch(e) {
                location.href = "index.html";
            }
        }
        renderizarLicenciatario();
    </script>
</body>
</html>
