<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU CONTROL | Menú Principal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1E1E2F;
            --bg-body: #F4F6F9;
            --text-dark: #1E293B;
            --text-muted: #94A3B8;
            --blue-sistematikos: #3B82F6;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Superior Modificado */
        .header-core {
            background-color: var(--bg-dark);
            color: white;
            text-align: center;
            padding: 30px 20px;
            border-bottom: 4px solid #800020; /* Franja Vinotinto */
        }

        .header-core h1 {
            margin: 0;
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header-core p {
            margin: 6px 0 0 0;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Contenedor Flex para asegurar alineación 100% Horizontal */
        .menu-container {
            max-width: 1200px;
            width: 95%;
            margin: auto;
            padding: 40px 0;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-flex-row {
            display: flex;
            flex-direction: row; /* Fuerza el flujo horizontal */
            gap: 20px;
            width: 100%;
            justify-content: space-between;
        }

        /* Tarjetas Ajustadas para Fila Horizontal */
        .menu-card {
            background: white;
            border-radius: 24px;
            padding: 40px 15px;
            text-align: center;
            text-decoration: none;
            color: var(--text-dark);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s;
            flex: 1; /* Hace que los 4 botones midan exactamente lo mismo */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
            box-sizing: border-box;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.1);
            border-color: var(--blue-sistematikos);
        }

        .menu-card i {
            font-size: 3rem;
            color: var(--blue-sistematikos);
            margin-bottom: 18px;
        }

        .menu-card span {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: block;
            text-transform: uppercase;
            line-height: 1.3;
        }

        .menu-card .module-id {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Responsive: Solo si la pantalla es muy pequeña se adaptará */
        @media (max-width: 768px) {
            .menu-flex-row {
                flex-direction: column;
            }
        }

        /* Footer */
        .footer-core {
            text-align: center;
            padding: 25px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-logout {
            background: white;
            border: 1px solid #E2E8F0;
            padding: 8px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Poppins';
            font-weight: 600;
            color: #64748B;
            transition: 0.2s;
            margin-top: 15px;
        }
        .btn-logout:hover {
            background: #F8FAFC;
            color: #EF4444;
            border-color: #FCA5A5;
        }
    </style>
</head>
<body oncontextmenu="return false">

    <header class="header-core">
        <h1>YOU CONTROL ADMINISTRATIVO - MENU PRINCIPAL</h1>
        <p>TERMINAL DE GESTIÓN v3.0</p>
    </header>

    <main class="menu-container">
        <div class="menu-flex-row">
            
            <a href="sys_v1_inv.html" class="menu-card">
                <i class="fas fa-boxes-stacked"></i>
                <span>Inventario</span>
                <div class="module-id">ID: SYS_101_INV</div>
            </a>

            <a href="sys_v3_comp.html" class="menu-card">
                <i class="fas fa-cart-plus"></i>
                <span>Entrada Mercancía</span>
                <div class="module-id">ID: SYS_102_COMP</div>
            </a>

            <a href="sys_v1_vt.html" class="menu-card">
                <i class="fas fa-cash-register"></i>
                <span>Ventas (POS)</span>
                <div class="module-id">ID: SYS_202_POS</div>
            </a>

            <a href="sys_v1_reportes.html" class="menu-card">
                <i class="fas fa-chart-line"></i>
                <span>Reportes</span>
                <div class="module-id">ID: NODE_505_STATS</div>
            </a>

        </div>
    </main>

    <footer class="footer-core">
        <div style="margin-bottom: 10px;">
            <i class="fas fa-lock"></i> Entorno Seguro Activado para Frank Hernandez
        </div>
        <button class="btn-logout" onclick="location.href='index.html'">Cerrar Sesión</button>
    </footer>

</body>
</html>
