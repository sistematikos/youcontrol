<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1E1E2F;
            --bg-body: #F4F6F9;
            --text-dark: #1E293B;
            --text-muted: #94A3B8;
            --blue-sistematikos: #3B82F6;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Superior */
        .header-core {
            background-color: var(--bg-dark);
            color: white;
            text-align: center;
            padding: 25px 20px;
            border-bottom: 4px solid #800020; /* Detalle vinotinto de marca */
        }

        .header-core h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .header-core p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Grid del Menú Principal Organizado */
        .menu-container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
            flex-grow: 1;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            justify-content: center;
        }

        /* Estilo Exacto de Tarjeta Sistematikos */
        .menu-card {
            background: white;
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            text-decoration: none;
            color: var(--text-dark);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .menu-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.1);
        }

        .menu-card i {
            font-size: 3rem;
            color: var(--blue-sistematikos);
            margin-bottom: 20px;
        }

        .menu-card span {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: block;
            text-transform: uppercase;
        }

        .menu-card .module-id {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Footer */
        .footer-core {
            text-align: center;
            padding: 25px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-logout {
            background: white;
            border: 1px solid #E2E8F0;
            padding: 8px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Poppins';
            font-weight: 600;
            color: #64748B;
            transition: 0.2s;
            margin-top: 15px;
        }
        .btn-logout:hover {
            background: #F8FAFC;
            color: #EF4444;
        }
    </style>
</head>
<body oncontextmenu="return false">

    <header class="header-core">
        <h1>SISTEMATIKOS CORE</h1>
        <p>Terminal de Gestión v3.0</p>
    </header>

    <main class="menu-container">
        <div class="menu-grid">
            
            <a href="sys_v1_inv.html" class="menu-card">
                <i class="fas fa-boxes-stacked"></i>
                <span>Inventario</span>
                <div class="module-id">ID: SYS_101_INV</div>
            </a>

            <a href="sys_v3_comp.html" class="menu-card">
                <i class="fas fa-cart-plus"></i>
                <span>Entrada Mercancía</span>
                <div class="module-id">ID: SYS_102_COMP</div>
            </a>

            <a href="sys_v1_vt.html" class="menu-card">
                <i class="fas fa-cash-register"></i>
                <span>Ventas (POS)</span>
                <div class="module-id">ID: SYS_202_POS</div>
            </a>

            <a href="sys_v1_reportes.html" class="menu-card">
                <i class="fas fa-chart-line"></i>
                <span>Reportes</span>
                <div class="module-id">ID: NODE_505_STATS</div>
            </a>

            <a href="index_atletas.html" class="menu-card">
                <i class="fas fa-users"></i>
                <span>Atletas</span>
                <div class="module-id">ID: NODE_808_DATA</div>
            </a>

        </div>
    </main>

    <footer class="footer-core">
        <div style="margin-bottom: 10px;">
            <i class="fas fa-lock"></i> Entorno Seguro Activado para Frank Hernandez
        </div>
        <button class="btn-logout" onclick="location.href='index.html'">Cerrar Sesión</button>
    </footer>

</body>
</html>
