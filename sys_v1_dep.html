<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESTIÓN DEPARTAMENTOS | YOU CONTROL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F1F5F9; --sky: #0EA5E9; --emerald: #10B981; --border: #E2E8F0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); padding: 20px; color: #1E293B; margin: 0; }
        .layout { max-width: 600px; margin: auto; }
        
        /* Estilos idénticos de la Cabecera */
        .header { 
            background: #ffffff; padding: 0 20px; border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; height: 70px; 
        }
        .btn-back { 
            background: #F1F5F9; color: #1E293B; padding: 8px 15px; 
            border-radius: 8px; text-decoration: none; font-size: 0.8rem; 
            font-weight: 700; border: 1px solid var(--border); 
            display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
        }
        .btn-back:hover { background: #E2E8F0; }
        .logo-header { height: 90%; width: auto; object-fit: contain; }

        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; }
        input:read-only { background-color: #F8FAFC; cursor: not-allowed; }
        .btn-save { background: var(--sky); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #F1F5F9; }
        .badge { background: #E0F2FE; color: var(--sky); padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 0.8rem; }
    </style>

    <!-- Script para limpiar caché al regresar al menú principal -->
    <script>
        function volverAlMenu(e) {
            e.preventDefault();
            window.location.href = 'sys_v1_menu.html?refresh=' + new Date().getTime();
        }
    </script>
</head>
<body>
    <main class="layout">
        <header class="header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="#" class="btn-back" onclick="volverAlMenu(event)">
                    <i class="fas fa-arrow-left"></i> VOLVER
                </a>
                <h2 style="margin: 0; font-size: 1.2rem; font-weight: 700; color: #1E293B;">Configurar Departamentos</h2>
            </div>
            <img src="img/logo.png" class="logo-header" alt="Logo">
        </header>

        <section class="card">
            <input type="text" id="cod-dep" placeholder="Código único (Ej: D01)">
            <input type="text" id="nombre-dep" placeholder="Nombre (Ej: Partes Eléctricas)">
            <button class="btn-save" onclick="guardarDep()">GUARDAR DEPARTAMENTO</button>
        </section>

        <section class="card">
            <div id="contenedor-deps">Cargando departamentos...</div>
        </section>
    </main>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, setDoc, doc, onSnapshot, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const USER_ID = localStorage.getItem('youcontrol_empresa_id');

        // Guardar o Actualizar
        window.guardarDep = async () => {
            const cod = document.getElementById('cod-dep').value.trim().toUpperCase();
            const nom = document.getElementById('nombre-dep').value.trim();
            if (!cod || !nom) return alert("Completa el código y el nombre");
            
            await setDoc(doc(db, "usuarios", USER_ID, "departamentos", cod), { 
                codigo: cod, 
                nombre: nom 
            });
            
            // Limpiar y desbloquear
            document.getElementById('cod-dep').value = "";
            document.getElementById('cod-dep').readOnly = false;
            document.getElementById('nombre-dep').value = "";
        };

        // Editar: Carga los datos en los inputs y bloquea el código
        window.editar = (cod, nombre) => {
            document.getElementById('cod-dep').value = cod;
            document.getElementById('cod-dep').readOnly = true;
            document.getElementById('nombre-dep').value = nombre;
            document.getElementById('nombre-dep').focus();
        };

        // Eliminar
        window.eliminar = async (id) => { 
            if(confirm('¿Borrar este departamento?')) await deleteDoc(doc(db, "usuarios", USER_ID, "departamentos", id)); 
        };

        // Renderizar Lista
        onSnapshot(query(collection(db, "usuarios", USER_ID, "departamentos"), orderBy("codigo")), (snap) => {
            const cont = document.getElementById('contenedor-deps');
            cont.innerHTML = "";
            snap.forEach(d => {
                const dep = d.data();
                cont.innerHTML += `
                    <div class="list-item">
                        <div>
                            <span class="badge">${dep.codigo}</span>
                            <span style="margin-left:10px;">${dep.nombre}</span>
                        </div>
                        <div>
                            <i class="fas fa-edit" style="color:#0EA5E9; cursor:pointer; margin-right:15px;" 
                               onclick="editar('${dep.codigo}', '${dep.nombre}')"></i>
                            <i class="fas fa-trash-alt" style="color:#F87171; cursor:pointer;" 
                               onclick="eliminar('${d.id}')"></i>
                        </div>
                    </div>`;
            });
        });
    </script>
</body>
</html>
