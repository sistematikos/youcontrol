<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEPARTAMENTOS | YOU CONTROL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: #F8FAFC;
            --text-dark: #1E293B;
            --sky: #0EA5E9; 
            --emerald: #10B981; 
            --border: #E2E8F0;
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-gradient); margin: 0; padding: 10px 0; min-height: 100vh; font-size: 0.75rem; }
        .layout-width { width: 90%; max-width: 800px; margin: 0 auto; } /* Layout más centrado y compacto */
        
        .header-panel { background: #ffffff; padding: 0 15px; border-radius: 10px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; height: 55px; }
        .btn-back { background: #F1F5F9; color: var(--text-dark); padding: 5px 12px; border-radius: 6px; text-decoration: none; font-size: 0.7rem; font-weight: 700; border: 1px solid var(--border); }
        .logo-header { height: 70%; width: auto; }
        
        .card-search { background: white; padding: 15px; border-radius: 10px; border: 1px solid var(--border); border-left: 4px solid var(--sky); margin-bottom: 15px; display: flex; gap: 10px; }
        .card-list { background: white; padding: 15px; border-radius: 10px; border: 1px solid var(--border); border-left: 4px solid var(--emerald); }
        
        input#nombre-dep { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.8rem; }
        .btn-save { background: var(--sky); color: white; border: none; padding: 0 15px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.75rem; }
        
        h3 { font-size: 0.85rem; margin-top: 0; margin-bottom: 10px; color: var(--text-dark); }
        .list-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #F1F5F9; align-items: center; }
        .list-item:last-child { border-bottom: none; }
        .list-item span { font-size: 0.8rem; }
    </style>
</head>
<body>
    <main class="layout-width">
        <header class="header-panel">
            <div style="display: flex; align-items: center; gap: 10px;">
                <a href="sys_v1_menu.html" class="btn-back"><i class="fas fa-arrow-left"></i> VOLVER</a>
                <h1 style="font-size: 0.95rem; margin: 0;">Gestión de Departamentos</h1>
            </div>
            <img src="img/logo.png" class="logo-header">
        </header>

        <section class="card-search">
            <input type="text" id="nombre-dep" placeholder="Ej: Partes Eléctricas">
            <button class="btn-save" onclick="guardarDep()">GUARDAR</button>
        </section>

        <section class="card-list">
            <h3>Departamentos Creados</h3>
            <div id="contenedor-deps"></div>
        </section>
    </main>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const USER_ID = localStorage.getItem('youcontrol_empresa_id');

        window.guardarDep = async () => {
            const input = document.getElementById('nombre-dep');
            if (!input.value.trim()) return;
            await addDoc(collection(db, "usuarios", USER_ID, "departamentos"), { nombre: input.value.trim() });
            input.value = "";
        };

        onSnapshot(query(collection(db, "usuarios", USER_ID, "departamentos"), orderBy("nombre")), (snap) => {
            const cont = document.getElementById('contenedor-deps');
            cont.innerHTML = "";
            snap.forEach(d => {
                const dep = d.data();
                cont.innerHTML += `
                    <div class="list-item">
                        <span>${dep.nombre.toUpperCase()}</span>
                        <i class="fas fa-trash-alt" style="color:#F87171; cursor:pointer;" onclick="eliminar('${d.id}')"></i>
                    </div>`;
            });
        });

        window.eliminar = async (id) => { if(confirm('¿Borrar departamento?')) await deleteDoc(doc(db, "usuarios", USER_ID, "departamentos", id)); };
    </script>
</body>
</html>
