<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTRADA DE MERCANCÍA | YOU CONTROL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #F1F5F9 0%, #E2E8F0 100%);
            --text-dark: #1E293B;
            --emerald: #10B981; --sky: #0EA5E9; --amber: #F59E0B; --rose: #F43F5E;
            --border: #E2E8F0;
        }
        body { font-family: 'Poppins', sans-serif; background: var(--bg-gradient); margin: 0; padding: 20px 0; min-height: 100vh; color: var(--text-dark); }
        .layout-width { width: 92%; max-width: 1200px; margin: 0 auto; }

        .header-panel { background: #ffffff; padding: 15px 30px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; height: 80px; }
        .btn-back { background: #F1F5F9; color: var(--text-dark); padding: 8px 16px; border-radius: 12px; text-decoration: none; font-size: 0.8rem; font-weight: 700; border: 1px solid var(--border); }
        
        /* TARJETAS CON BORDE IZQUIERDO */
        .grid-top { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.04); position: relative; border-left: 6px solid var(--border); }
        .border-sky { border-left-color: var(--sky); }
        .border-emerald { border-left-color: var(--emerald); }
        .border-amber { border-left-color: var(--amber); }

        input { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box; }
        .btn-add { background: var(--text-dark); color: white; padding: 12px; border: none; border-radius: 10px; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-save { background: var(--emerald); color: white; padding: 12px 30px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; }
        #dropdown-resultados { position: absolute; background: white; width: calc(100% - 40px); border: 1px solid var(--border); z-index: 1000; border-radius: 12px; display: none; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <main class="layout-width">
        <header class="header-panel">
            <div style="display: flex; align-items: center; gap: 20px;">
                <a href="index_menu.html" class="btn-back"><i class="fas fa-arrow-left"></i> VOLVER</a>
                <h1 style="font-size: 1.4rem; margin: 0;">Entrada de Mercancía</h1>
            </div>
            <img src="img/logo.png" style="height: 60px;">
        </header>

        <div class="grid-top">
            <section class="card border-sky">
                <h3>Datos Producto</h3>
                <div id="aviso-no-registrado" style="color: var(--rose); font-size: 0.75rem; font-weight: 700; display: none; margin-bottom: 5px;">
                    <i class="fas fa-exclamation-circle"></i> Producto no registrado
                </div>
                <input type="text" id="buscador-dinamico" placeholder="Código o Nombre..." autocomplete="off">
                <div id="dropdown-resultados"></div>
                <input type="text" id="comp-sku" placeholder="SKU">
                <input type="text" id="comp-nombre" placeholder="Nombre">
                <input type="number" id="comp-cantidad" placeholder="Cantidad">
                <button class="btn-add" onclick="window.agregarALista()">AGREGAR A LISTA</button>
            </section>

            <section class="card border-emerald">
                <h3>Costos y Precios</h3>
                <input type="number" id="comp-costo" placeholder="Costo USD">
                <input type="number" id="comp-ganancia" placeholder="% Ganancia">
                <input type="number" id="comp-precio" placeholder="Precio $">
                <input type="text" id="comp-precio-bs" placeholder="Precio Bs." oninput="window.calcularDesdeBs()">
            </section>
        </div>

        <section class="card border-amber">
            <h3>Lista de Ingreso</h3>
            <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem;">
                <thead><tr style="color: #64748B; border-bottom: 2px solid #F1F5F9;"><th style="padding:10px;">SKU</th><th>Producto</th><th>Cant.</th><th>Precio</th><th>X</th></tr></thead>
                <tbody id="tabla-items-compra"></tbody>
            </table>
            <div style="text-align: center; margin-top: 20px;">
                <button class="btn-save" onclick="window.procesarIngresoMercancia()">GUARDAR COMPRA</button>
            </div>
        </section>
    </main>
    <script type="module" src="./js/sys_v3_comp.js"></script>
</body>
</html>
