<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada de Mercancía | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #F8FAFC; 
            --primary: #3B82F6; 
            --text: #1E293B; 
            --border: #E2E8F0; 
            --emerald: #10B981; 
            --indigo: #6366F1; 
            --slate-dark: #0F172A;
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding-bottom: 50px; 
            color: var(--text); 
        }
        .container { 
            padding: 15px; 
            max-width: 1300px; 
            margin: auto; 
        }
        
        .header-table { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
        }
        
        /* Layout de dos columnas optimizado y flexible */
        .workspace-grid {
            display: grid;
            grid-template-columns: minmax(360px, 460px) 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 992px) {
            .workspace-grid {
                grid-template-columns: 1fr;
            }
        }

        .compra-card { 
            background: white; 
            padding: 22px; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            box-sizing: border-box;
        }
        
        /* Contenedor relativo del Buscador Avanzado */
        .search-wrapper {
            position: relative;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .search-box { 
            background: #EEF2F6; 
            padding: 12px; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            border: 1px solid #CBD5E1; 
            box-sizing: border-box;
        }
        .search-box input { 
            flex: 1; 
            padding: 11px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            font-family: 'Poppins'; 
            font-size: 1rem; 
            outline: none; 
            font-weight: 600; 
            box-sizing: border-box;
            width: 100%;
        }
        .search-box input:focus { 
            border-color: var(--indigo); 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); 
        }

        /* Lista de sugerencias predictivas flotante */
        .search-results-dropdown {
            position: absolute;
            top: 102%;
            left: 0;
            right: 0;
            background: #FFFFFF !important; 
            border-radius: 12px;
            border: 1px solid #CBD5E1;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-height: 260px;
            overflow-y: auto;
            z-index: 9999; 
            display: none;
            padding: 0;
        }

        .search-item {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
            border-bottom: 1px solid #F1F5F9;
            background: #FFFFFF;
        }
        .search-item:last-child { border: none; border-radius: 0 0 12px 12px; }
        .search-item:hover { background: #F1F5F9; }

        .search-item .item-info { display: flex; flex-direction: column; }
        .search-item .item-name { font-weight: 600; color: var(--text); }
        .search-item .item-meta { font-size: 0.75rem; color: #64748B; }
        .search-item .item-stock {
            background: #E2E8F0;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Aviso flotante de no existencia */
        .no-products-alert {
            padding: 15px;
            text-align: center;
            background: #FFF7ED; 
            color: #C2410C;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
            border-radius: 12px;
        }
        .no-products-alert:hover { background: #FFEDD5; }

        /* Grid del Formulario */
        .form-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
        }
        .form-group { display: flex; flex-direction: column; gap: 6px; box-sizing: border-box; }
        .form-group.full { grid-column: span 2; }
        .form-group label { 
            font-size: 0.80rem; 
            font-weight: 600; 
            color: #64748B; 
            text-transform: uppercase; 
        }
        .form-group input { 
            padding: 10px 12px; 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            font-family: 'Poppins'; 
            font-size: 0.95rem; 
            background: #F8FAFC; 
            color: var(--text); 
            box-sizing: border-box; 
            width: 100%; 
        }
        .form-grid .form-group input:focus { 
            border-color: var(--primary); 
            background: white; 
            outline: none; 
        }
        .form-group input[readonly] { 
            background: #E2E8F0; 
            color: #64748B; 
            cursor: not-allowed; 
            font-weight: 600; 
        }

        .precio-bs-box { 
            background: #ecfdf5; 
            border: 1px solid #a7f3d0; 
            color: #065f46; 
            font-weight: 800; 
            font-size: 1.05rem; 
            text-align: center; 
        }

        /* Botones de acción */
        .btn-add-item {
            background: var(--indigo);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            width: 100%;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            box-sizing: border-box;
        }
        .btn-add-item:hover { background: #4f46e5; }

        .btn-save-compra { 
            background: var(--emerald); 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 800; 
            font-size: 1.1rem; 
            width: 100%; 
            margin-top: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            transition: 0.2s; 
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); 
            box-sizing: border-box;
        }
        .btn-save-compra:hover { background: #059669; transform: translateY(-1px); }
        
        .btn-back { 
            border: none; 
            background: none; 
            color: var(--primary); 
            cursor: pointer; 
            font-weight: bold; 
            margin-bottom: 15px; 
            display: flex; 
            align-items: center; 
            gap: 5px; 
            font-size: 0.9rem; 
        }

        /* Estilos de la Tabla de Ítems en cola */
        .table-container {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            box-sizing: border-box;
            width: 100%;
        }
        
        .table-review {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        
        .table-review th {
            background: #F1F5F9;
            color: #475569;
            text-transform: uppercase;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 12px 10px;
            text-align: left;
            border-bottom: 2px solid var(--border);
        }
        
        .table-review td {
            padding: 12px 10px;
            border-bottom: 1px solid #F1F5F9;
            color: var(--text);
            vertical-align: middle;
        }

        .table-review tr:last-child td {
            border: none;
        }

        #status-bar-comp { 
            width: 100%; 
            padding: 10px; 
            border-radius: 10px; 
            font-size: 14px; 
            font-weight: 600; 
            text-align: center; 
            margin-bottom: 15px; 
            display: none; 
            box-sizing: border-box; 
        }
        .status-loading { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
        .status-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .status-error { background: #fecdd3; color: #9f1239; border: 1px solid #fda4af; }
    </style>
</head>
<body oncontextmenu="return false">
    <div class="container">
        <button class="btn-back" onclick="location.href='sys_v1_menu.html'">
            <i class="fas fa-arrow-left"></i> VOLVER AL MENÚ
        </button>

        <div class="header-table">
            <h3><i class="fas fa-boxes-stacked" style="color: var(--indigo);"></i> ENTRADA DE MERCANCÍA</h3>
            <span style="font-size: 0.85rem; color: #64748B; font-weight: 600; background: #E2E8F0; padding: 4px 10px; border-radius: 6px;">
                Tasa de hoy: <span id="txt-tasa">1,00</span> Bs.
            </span>
        </div>

        <div id="status-bar-comp"></div>

        <div class="workspace-grid">
            
            <div class="compra-card">
                <div class="search-wrapper">
                    <div class="search-box">
                        <i class="fas fa-magnifying-glass" style="font-size: 1.2rem; color: #64748B;"></i>
                        <input type="text" id="buscador-dinamico" placeholder="Buscar código, SKU o descripción...">
                    </div>
                    <div id="dropdown-resultados" class="search-results-dropdown"></div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>SKU / Código Interno</label>
                        <input type="text" id="comp-sku" placeholder="Ej: PIÑ-01" required>
                    </div>
                    <div class="form-group">
                        <label>Código de Barras</label>
                        <input type="text" id="comp-barras" placeholder="Código de barras...">
                    </div>
                    <div class="form-group full">
                        <label>Descripción del Producto</label>
                        <input type="text" id="comp-nombre" placeholder="Descripción completa del artículo..." required>
                    </div>
                    <div class="form-group">
                        <label>Costo USD ($)</label>
                        <input type="number" step="0.01" id="comp-costo" value="0.00">
                    </div>
                    <div class="form-group">
                        <label>% Ganancia</label>
                        <input type="number" step="0.1" id="comp-ganancia" value="0.0">
                    </div>
                    <div class="form-group">
                        <label>Precio USD ($)</label>
                        <input type="number" step="0.01" id="comp-precio" value="0.00">
                    </div>
                    <div class="form-group">
                        <label>Precio Venta Bs.</label>
                        <input type="text" id="comp-precio-bs" class="precio-bs-box" value="0,00 Bs." readonly>
                    </div>
                    <div class="form-group">
                        <label>Stock Actual</label>
                        <input type="number" id="comp-stock-viejo" value="0" readonly>
                    </div>
                    <div class="form-group">
                        <label style="color: var(--indigo); font-weight: 800;">Cantidad Entrante</label>
                        <input type="number" id="comp-cantidad" value="0" style="border: 2px solid var(--indigo); font-weight: bold; background: #F5F3FF;">
                    </div>
                    <div class="form-group full">
                        <label>Fecha de Registro</label>
                        <input type="date" id="comp-fecha">
                    </div>
                </div>

                <button class="btn-add-item" type="button" onclick="window.agregarItemALista()">
                    <i class="fas fa-plus-circle"></i> AGREGAR A LA LISTA
                </button>
            </div>

            <div class="table-container">
                <h4 style="margin-top: 0; margin-bottom: 15px; color: var(--slate-dark); font-weight: 600; display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-list-check" style="color: var(--primary);"></i> Artículos en esta Entrada
                </h4>
                
                <table class="table-review">
                    <thead>
                        <tr>
                            <th>Código / SKU</th>
                            <th>Descripción</th>
                            <th style="text-align: center;">Cant.</th>
                            <th style="text-align: right;">Costo U.</th>
                            <th style="text-align: right;">P. Venta</th>
                            <th style="text-align: center;">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-items-compra">
                        <tr>
                            <td colspan="6" style="text-align:center; color:#64748B; padding:20px;">
                                No hay artículos agregados a la entrada.
                            </td>
                        </tr>
                    </tbody>
                </table>

                <button class="btn-save-compra" id="btnGuardarCompra" onclick="window.procesarCompraCompleta()">
                    <i class="fas fa-cloud-arrow-up"></i> GUARDAR ENTRADA (F9)
                </button>
            </div>

        </div>
    </div>

    <script type="module" src="./js/sys_v3_comp.js"></script>
</body>
</html>
