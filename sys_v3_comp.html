<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Entrada de Mercancía</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #F1F5F9; padding: 20px; }
        .layout { max-width: 800px; margin: auto; }
        .header-panel { background: #fff; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #E2E8F0; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-action { background: #1E293B; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; cursor: pointer; }
        .btn-save { background: #10B981; color: white; padding: 15px; border: none; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; }
        #dropdown-resultados { border: 1px solid #ccc; background: white; display: none; position: absolute; z-index: 10; width: 95%; }
    </style>
</head>
<body>
    <div class="layout">
        <header class="header-panel">
            <h1>Entrada de Mercancía</h1>
            <img src="img/logo.png" style="height:40px;">
        </header>

        <section class="card">
            <h3>1. Búsqueda e Ingreso</h3>
            <input type="text" id="buscador-dinamico" placeholder="Buscar producto...">
            <div id="dropdown-resultados"></div>
            <input type="text" id="comp-sku" placeholder="SKU">
            <input type="text" id="comp-nombre" placeholder="Nombre">
            <input type="number" id="comp-costo" placeholder="Costo USD">
            <input type="number" id="comp-cantidad" placeholder="Cantidad">
            <button class="btn-action" onclick="window.agregarALista()">AGREGAR A LISTA</button>
        </section>

        <section class="card">
            <h3>2. Ajuste de Precios</h3>
            <input type="number" id="comp-precio" placeholder="Precio USD">
            <input type="text" id="comp-precio-bs" placeholder="Precio Bs." readonly>
            <input type="number" id="comp-ganancia" placeholder="Ganancia %">
            <span id="txt-tasa" style="display:none;"></span>
        </section>

        <section class="card">
            <h3>3. Lista y Guardar</h3>
            <table style="width:100%; border-collapse: collapse;">
                <tbody id="tabla-items-compra"></tbody>
            </table>
            <button class="btn-save" onclick="window.procesarIngresoMercancia()">GUARDAR ENTRADA</button>
        </section>
    </div>
    <script type="module" src="./js/sys_v3_comp.js"></script>
</body>
</html>
