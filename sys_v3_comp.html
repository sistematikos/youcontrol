<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ENTRADA DE MERCANCÍA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: sans-serif; background: #F1F5F9; padding: 20px; }
        .layout { max-width: 1000px; margin: auto; }
        .header-panel { background: #fff; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .grid-top { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid #E2E8F0; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-add { background: #1E293B; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-save { background: #10B981; color: white; padding: 15px; border: none; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; }
        .table-container { width: 100%; border-collapse: collapse; margin-top: 10px; }
        /* Ocultar inputs auxiliares necesarios para el JS */
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="layout">
        <header class="header-panel">
            <h1>Entrada de Mercancía</h1>
            <img src="img/logo.png" style="height:40px;">
        </header>

        <div class="grid-top">
            <section class="card">
                <h3>Datos Producto</h3>
                <input type="text" id="buscador-dinamico" placeholder="Código o Nombre...">
                <div id="dropdown-resultados"></div>
                <input type="text" id="comp-sku" placeholder="SKU">
                <input type="text" id="comp-nombre" placeholder="Nombre">
                <input type="number" id="comp-cantidad" placeholder="Cantidad">
                
                <input type="text" id="comp-barras" class="hidden">
                <input type="text" id="comp-stock-viejo" class="hidden">
                <input type="date" id="comp-fecha" class="hidden">
                
                <button class="btn-add" onclick="window.agregarALista()">AGREGAR A LISTA</button>
            </section>

            <section class="card">
                <h3>Costos y Precios</h3>
                <input type="number" id="comp-costo" placeholder="Costo USD" step="0.01">
                <input type="number" id="comp-ganancia" placeholder="% Ganancia" step="0.1">
                <input type="number" id="comp-precio" placeholder="Precio $" step="0.01">
                <input type="text" id="comp-precio-bs" placeholder="Precio Bs." readonly>
            </section>
        </div>

        <section class="card">
            <h3>Lista de Ingreso</h3>
            <table class="table-container">
                <thead><tr><th>SKU</th><th>Producto</th><th>Cant.</th><th>Precio</th><th>X</th></tr></thead>
                <tbody id="tabla-items-compra"></tbody>
            </table>
            <br>
            <button class="btn-save" onclick="window.procesarIngresoMercancia()">GUARDAR ENTRADA DE MERCANCÍA</button>
        </section>
    </div>
    <script type="module" src="./js/sys_v3_comp.js"></script>
</body>
</html>
