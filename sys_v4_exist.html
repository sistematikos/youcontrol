<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOU CONTROL | Reporte de Existencia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #F1F5F9 0%, #E2E8F0 100%);
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --emerald: #10B981;
            --sky: #0EA5E9;
            --amber: #F59E0B;
            --rose: #F43F5E;
        }

        body { font-family: 'Poppins', sans-serif; background: var(--bg-gradient); margin: 0; padding: 20px 0; min-height: 100vh; color: var(--text-dark); }
        .layout-width { width: 92%; max-width: 1200px; margin: 0 auto; box-sizing: border-box; }

        /* HEADER PANEL (Estilo Reporte Ventas) */
        .header-panel { background: #ffffff; padding: 20px 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05); border: 1px solid #E2E8F0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .btn-back { background: #F1F5F9; color: var(--text-dark); padding: 8px 16px; border-radius: 12px; text-decoration: none; font-size: 0.8rem; font-weight: 700; border: 1px solid #E2E8F0; display: flex; align-items: center; gap: 8px; }
        .page-title { font-size: 1.4rem; font-weight: 700; color: var(--text-dark); margin: 0; }

        /* BUSCADOR */
        .search-panel { background: #ffffff; padding: 10px 15px; border-radius: 14px; border: 1px solid #E2E8F0; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 10px; width: fit-content; margin-bottom: 20px; }
        .search-panel input { border: none; outline: none; font-size: 0.9rem; width: 250px; }

        /* GRID KPIs */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .kpi-card { background: #ffffff; border-radius: 14px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 6px solid #0284C7; }
        .p-label { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
        .p-val { font-size: 1.4rem; font-weight: 800; color: var(--text-dark); margin-top: 5px; }

        /* TABLA */
        .table-panel { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.05); border: 1px solid #E2E8F0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { color: var(--text-muted); padding: 12px; text-align: left; text-transform: uppercase; font-size: 0.7rem; border-bottom: 2px solid #F1F5F9; }
        td { padding: 12px; border-bottom: 1px solid #F1F5F9; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
    </style>
</head>
<body>

    <main class="layout-width">
        <header class="header-panel">
            <div class="header-left">
                <a href="sys_v4_reportes.html" class="btn-back"><i class="fas fa-arrow-left"></i> VOLVER</a>
                <h1 class="page-title">Reporte de Existencia</h1>
            </div>
        </header>

        <div class="search-panel">
            <i class="fas fa-search" style="color: var(--text-muted);"></i>
            <input type="text" id="input-busqueda" placeholder="Buscar producto...">
        </div>

        <div class="kpi-grid">
            <div class="kpi-card" style="border-left-color: var(--sky);"><div class="p-label">Costo Total</div><div class="p-val" id="tot-costo">$ 0.00</div></div>
            <div class="kpi-card" style="border-left-color: var(--emerald);"><div class="p-label">Valor Venta (PVP)</div><div class="p-val" id="tot-pvp">$ 0.00</div></div>
            <div class="kpi-card" style="border-left-color: var(--amber);"><div class="p-label">Margen Est.</div><div class="p-val" id="tot-ganancia">$ 0.00</div></div>
            <div class="kpi-card" style="border-left-color: var(--rose);"><div class="p-label">Alertas</div><div class="p-val" id="tot-alertas">0</div></div>
        </div>

        <div class="table-panel">
            <table>
                <thead>
                    <tr>
                        <th>Código</th><th>Descripción</th><th class="text-center">Stock</th><th>Costo</th><th>PVP</th><th class="text-right">Inversión</th><th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-existencia">
                    <tr><td colspan="7" class="text-center" style="padding: 20px;">Cargando inventario...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="./js/sys_v4_exist.js"></script>
</body>
</html>
