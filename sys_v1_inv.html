<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F8FAFC; --primary: #3B82F6; --text: #1E293B; --border: #E2E8F0; --emerald: #10B981; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; color: var(--text); }
        
        .container { padding: 15px; max-width: 1100px; margin: auto; }
        .header-table { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        .table-responsive { overflow-x: auto; background: white; border-radius: 15px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        
        th { background: #F1F5F9; padding: 15px; text-align: left; font-size: 0.75rem; text-transform: uppercase; color: #64748B; }
        td { padding: 10px; border-bottom: 1px solid var(--border); }

        .input-table {
            width: 100%; border: 1px solid transparent; padding: 10px;
            border-radius: 8px; font-size: 0.9rem; transition: 0.2s;
            box-sizing: border-box; background: #F1F5F9;
        }
        .input-table:focus { outline: none; border-color: var(--primary); background: white; }
        .input-table[readonly] { background: #E2E8F0; color: #64748B; cursor: not-allowed; }
        
        .p-barcode { font-family: 'Courier New', monospace; font-weight: bold; color: var(--primary); }

        .btn-add { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .btn-save { background: var(--emerald); color: white; border: none; padding: 18px; border-radius: 15px; cursor: pointer; font-weight: 800; width: 100%; margin-top: 25px; font-size: 1.1rem; }
        .btn-remove { color: #EF4444; background: #FEE2E2; border: none; cursor: pointer; padding: 8px; border-radius: 8px; }

        .btn-back { border: none; background: none; color: var(--primary); cursor: pointer; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        .loading-overlay { text-align: center; padding: 20px; color: var(--primary); font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false">

    <div class="container">
        <button class="btn-back" onclick="location.href='index.html'">
            <i class="fas fa-arrow-left"></i> VOLVER AL MENÚ
        </button>

        <div class="header-table">
            <h3><i class="fas fa-boxes-stacked"></i> GESTIÓN DE INVENTARIO</h3>
            <button class="btn-add" onclick="window.agregarFila()"><i class="fas fa-plus"></i> NUEVO ITEM</button>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 20%;">Cód. / SKU</th>
                        <th style="width: 40%;">Descripción</th>
                        <th style="width: 15%;">Precio $</th>
                        <th style="width: 15%;">Stock</th>
                        <th style="width: 10%; text-align: center;">Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla">
                    <tr><td colspan="5" class="loading-overlay"><i class="fas fa-spinner fa-spin"></i> Cargando productos...</td></tr>
                </tbody>
            </table>
        </div>

        <button class="btn-save" id="btnGuardarTodo" onclick="window.guardarInventario()">
            <i class="fas fa-sync-alt"></i> SINCRONIZAR CON FIREBASE
        </button>
    </div>

    <script type="module" src="./js/sys_v1_inv.js"></script>
</body>
</html>
