<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVENTARIO | YOU CONTROL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F1F5F9; --sky: #0EA5E9; --emerald: #10B981; --border: #E2E8F0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #1E293B; }
        .layout-width { max-width: 1200px; margin: 0 auto; }
        .header-panel { background: #fff; padding: 0 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; height: 70px; margin-bottom: 15px; }
        .btn-back { background: #F1F5F9; color: #1E293B; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 0.8rem; font-weight: 700; border: 1px solid var(--border); }
        .card-container { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; min-width: 1000px; border-collapse: collapse; font-size: 0.85rem; }
        th { color: #64748B; padding: 12px; text-align: left; border-bottom: 2px solid var(--border); }
        td { padding: 12px; border-bottom: 1px solid #F1F5F9; }
        input, select { width: 90%; padding: 5px; border: 1px solid var(--border); border-radius: 4px; }
        .btn-act { cursor: pointer; border: none; background: none; font-size: 1.1rem; margin: 0 5px; }
    </style>
</head>
<body>
    <main class="layout-width">
        <header class="header-panel">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="sys_v1_menu.html" class="btn-back"><i class="fas fa-arrow-left"></i> VOLVER</a>
                <h1 style="font-size: 1.2rem; margin: 0;">Inventario</h1>
            </div>
            <img src="img/logo.png" style="height: 60%;" onerror="this.style.display='none'">
        </header>

        <section class="card-container" style="border-left: 6px solid var(--sky);">
            <input type="text" id="buscador-inv" placeholder="🔍 Buscar por Nombre, SKU o Barras...">
        </section>

        <section class="card-container" style="border-left: 6px solid var(--emerald);">
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Barras</th><th>SKU</th><th>Producto</th><th>Depto</th><th>Costo</th><th>%</th><th>Precio ($)</th><th>Precio (Bs)</th><th>Stock</th><th>Acción</th></tr>
                    </thead>
                    <tbody id="cuerpo-tabla"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, onSnapshot, doc, deleteDoc, updateDoc, getDocs, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const USER_ID = localStorage.getItem('youcontrol_empresa_id') || "sUhfZI9Fy3M9UlInTYw2wFWZmB12";
        const cuerpoTabla = document.getElementById('cuerpo-tabla');
        let tasaActual = 1.00;

        async function init() {
            const userDoc = await getDoc(doc(db, "usuarios", USER_ID));
            if (userDoc.exists()) tasaActual = parseFloat(userDoc.data().tasa_bcv) || 1.00;

            onSnapshot(collection(db, "usuarios", USER_ID, "productos"), (snap) => {
                cuerpoTabla.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    cuerpoTabla.innerHTML += `
                        <tr data-id="${d.id}">
                            <td>${p.barras || ''}</td>
                            <td>${p.sku || ''}</td>
                            <td>${p.nombre || ''}</td>
                            <td>${p.departamento || 'N/A'}</td>
                            <td>$${parseFloat(p.costo || 0).toFixed(2)}</td>
                            <td>${p.ganancia || 0}%</td>
                            <td>$${parseFloat(p.precio || 0).toFixed(2)}</td>
                            <td>${(parseFloat(p.precio || 0) * tasaActual).toFixed(2)} Bs</td>
                            <td>${p.stock || 0}</td>
                            <td>
                                <button class="btn-act" onclick="window.editarProducto('${d.id}')">✏️</button>
                                <button class="btn-act" onclick="window.eliminarProducto('${d.id}', '${p.nombre}')">🗑️</button>
                            </td>
                        </tr>`;
                });
            });
        }

        window.calc = (origen) => {
            let costo = parseFloat(document.getElementById('e-costo').value) || 0;
            let ganancia = parseFloat(document.getElementById('e-ganancia').value) || 0;
            let precio = parseFloat(document.getElementById('e-precio').value) || 0;
            let bs = parseFloat(document.getElementById('e-bs').value) || 0;

            if (origen === 'costo' || origen === 'ganancia') {
                precio = costo + (costo * (ganancia / 100));
                document.getElementById('e-precio').value = precio.toFixed(2);
                document.getElementById('e-bs').value = (precio * tasaActual).toFixed(2);
            } else if (origen === 'precio') {
                ganancia = costo > 0 ? ((precio - costo) / costo) * 100 : 0;
                document.getElementById('e-ganancia').value = ganancia.toFixed(1);
                document.getElementById('e-bs').value = (precio * tasaActual).toFixed(2);
            } else if (origen === 'bs') {
                precio = bs / tasaActual;
                ganancia = costo > 0 ? ((precio - costo) / costo) * 100 : 0;
                document.getElementById('e-precio').value = precio.toFixed(2);
                document.getElementById('e-ganancia').value = ganancia.toFixed(1);
            }
        };

        window.editarProducto = async (id) => {
            const fila = document.querySelector(`tr[data-id="${id}"]`);
            const c = fila.cells;
            const deptoSnap = await getDocs(collection(db, "usuarios", USER_ID, "departamentos"));
            let opciones = '';
            deptoSnap.forEach(d => {
                const n = d.data().nombre;
                opciones += `<option value="${n}" ${n === c[3].innerText ? 'selected' : ''}>${n}</option>`;
            });

            fila.innerHTML = `
                <td><input type="text" id="e-barras" value="${c[0].innerText}"></td>
                <td><input type="text" id="e-sku" value="${c[1].innerText}"></td>
                <td><input type="text" id="e-nombre" value="${c[2].innerText}"></td>
                <td><select id="e-depto">${opciones}</select></td>
                <td><input type="number" id="e-costo" value="${c[4].innerText.replace('$','')}" oninput="window.calc('costo')"></td>
                <td><input type="number" id="e-ganancia" value="${c[5].innerText.replace('%','')}" oninput="window.calc('ganancia')"></td>
                <td><input type="number" id="e-precio" value="${c[6].innerText.replace('$','')}" oninput="window.calc('precio')"></td>
                <td><input type="number" id="e-bs" value="${c[7].innerText.replace(' Bs','')}" oninput="window.calc('bs')"></td>
                <td><input type="number" id="e-stock" value="${c[8].innerText}"></td>
                <td><button class="btn-act" onclick="window.guardarEdicion('${id}')">💾</button></td>
            `;
        };

        window.guardarEdicion = async (id) => {
            await updateDoc(doc(db, "usuarios", USER_ID, "productos", id), {
                barras: document.getElementById('e-barras').value,
                sku: document.getElementById('e-sku').value,
                nombre: document.getElementById('e-nombre').value,
                departamento: document.getElementById('e-depto').value,
                costo: parseFloat(document.getElementById('e-costo').value),
                ganancia: parseFloat(document.getElementById('e-ganancia').value),
                precio: parseFloat(document.getElementById('e-precio').value),
                stock: parseInt(document.getElementById('e-stock').value)
            });
            alert("Producto actualizado");
        };

        window.eliminarProducto = async (id, nombre) => {
            if(confirm(`¿Eliminar ${nombre}?`)) await deleteDoc(doc(db, "usuarios", USER_ID, "productos", id));
        };

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
