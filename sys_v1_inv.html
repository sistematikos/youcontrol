<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INVENTARIO | YOU CONTROL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F1F5F9; --sky: #0EA5E9; --emerald: #10B981; --border: #E2E8F0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #1E293B; }
        .layout-width { max-width: 1200px; margin: 0 auto; }
        .header-panel { background: #fff; padding: 0 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; height: 70px; margin-bottom: 15px; }
        .card-container { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .table-container { width: 100%; overflow-x: auto; }
        table { width: 100%; min-width: 900px; border-collapse: collapse; font-size: 0.85rem; }
        th { color: #64748B; padding: 12px; text-align: left; border-bottom: 2px solid var(--border); }
        td { padding: 12px; border-bottom: 1px solid #F1F5F9; }
        input[type="text"], input[type="number"] { width: 90%; padding: 5px; border: 1px solid var(--border); border-radius: 4px; }
        .btn-act { cursor: pointer; border: none; background: none; font-size: 1.1rem; margin: 0 5px; }
    </style>
</head>
<body>
    <main class="layout-width">
        <header class="header-panel">
            <div style="display: flex; align-items: center; gap: 15px;">
                <a href="sys_v1_menu.html" style="text-decoration:none; color:#1E293B;"><i class="fas fa-arrow-left"></i> VOLVER</a>
                <h1 style="font-size: 1.2rem; margin: 0;">Inventario</h1>
            </div>
            <img src="img/logo.png" style="height: 60%;" onerror="this.style.display='none'">
        </header>

        <div id="status-bar-inv" style="padding:10px; border-radius:8px; margin-bottom:10px; display:none;"></div>

        <section class="card-container" style="border-left: 6px solid var(--sky);">
            <input type="text" id="buscador-inv" placeholder="🔍 Buscar por Nombre, SKU o Barras...">
        </section>

        <section class="card-container" style="border-left: 6px solid var(--emerald);">
            <div class="table-container">
                <table>
                    <thead>
                        <tr><th>Barras</th><th>SKU</th><th>Producto</th><th>Depto</th><th>Costo</th><th>%</th><th>Precio</th><th>Stock</th><th>Acción</th></tr>
                    </thead>
                    <tbody id="cuerpo-tabla"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, onSnapshot, doc, deleteDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const USER_ID = localStorage.getItem('youcontrol_empresa_id') || "sUhfZI9Fy3M9UlInTYw2wFWZmB12";
        const cuerpoTabla = document.getElementById('cuerpo-tabla');

        // Renderizado y Edición
        onSnapshot(collection(db, "usuarios", USER_ID, "productos"), (snap) => {
            cuerpoTabla.innerHTML = "";
            snap.forEach(d => {
                const p = d.data();
                cuerpoTabla.innerHTML += `
                    <tr data-id="${d.id}">
                        <td>${p.barras || ''}</td>
                        <td>${p.sku || ''}</td>
                        <td>${p.nombre || ''}</td>
                        <td>${p.departamento || 'N/A'}</td>
                        <td>$${parseFloat(p.costo || 0).toFixed(2)}</td>
                        <td>${p.ganancia || 0}%</td>
                        <td>$${parseFloat(p.precio || 0).toFixed(2)}</td>
                        <td>${p.stock || 0}</td>
                        <td>
                            <button class="btn-act" onclick="window.editarProducto('${d.id}')">✏️</button>
                            <button class="btn-act" onclick="window.eliminarProducto('${d.id}', '${p.nombre}')">🗑️</button>
                        </td>
                    </tr>`;
            });
        });

        window.editarProducto = (id) => {
            const fila = document.querySelector(`tr[data-id="${id}"]`);
            const celdas = fila.cells;
            fila.innerHTML = `
                <td><input type="text" id="edit-barras-${id}" value="${celdas[0].innerText}"></td>
                <td><input type="text" id="edit-sku-${id}" value="${celdas[1].innerText}"></td>
                <td><input type="text" id="edit-nombre-${id}" value="${celdas[2].innerText}"></td>
                <td><input type="text" id="edit-depto-${id}" value="${celdas[3].innerText}"></td>
                <td><input type="number" id="edit-costo-${id}" value="${parseFloat(celdas[4].innerText.replace('$',''))}"></td>
                <td><input type="number" id="edit-ganancia-${id}" value="${parseFloat(celdas[5].innerText)}"></td>
                <td><input type="number" id="edit-precio-${id}" value="${parseFloat(celdas[6].innerText.replace('$',''))}"></td>
                <td><input type="number" id="edit-stock-${id}" value="${parseInt(celdas[7].innerText)}"></td>
                <td><button class="btn-act" onclick="window.guardarEdicion('${id}')">💾</button></td>
            `;
        };

        window.guardarEdicion = async (id) => {
            await updateDoc(doc(db, "usuarios", USER_ID, "productos", id), {
                barras: document.getElementById(`edit-barras-${id}`).value,
                sku: document.getElementById(`edit-sku-${id}`).value,
                nombre: document.getElementById(`edit-nombre-${id}`).value,
                departamento: document.getElementById(`edit-depto-${id}`).value,
                costo: parseFloat(document.getElementById(`edit-costo-${id}`).value),
                ganancia: parseFloat(document.getElementById(`edit-ganancia-${id}`).value),
                precio: parseFloat(document.getElementById(`edit-precio-${id}`).value),
                stock: parseInt(document.getElementById(`edit-stock-${id}`).value)
            });
            alert("Producto actualizado");
        };

        window.eliminarProducto = async (id, nombre) => {
            if(confirm(`¿Eliminar ${nombre}?`)) await deleteDoc(doc(db, "usuarios", USER_ID, "productos", id));
        };
    </script>
</body>
</html>
