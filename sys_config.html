<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configuración | You Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #F1F5F9; font-family: 'Poppins', sans-serif; padding: 20px; color: #1E293B; }
        .config-container { max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 24px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        h2 { color: #002D72; margin-bottom: 25px; }
        h3 { font-size: 0.9rem; color: #64748B; margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { 
            width: 100%; padding: 12px; border: 2px solid #E2E8F0; border-radius: 12px; 
            font-family: inherit; font-size: 1rem; box-sizing: border-box; transition: 0.2s;
        }
        input:focus { outline: none; border-color: #0052D4; }
        .btn-act { 
            background: #0052D4; color: white; border: none; padding: 16px; border-radius: 12px; 
            font-weight: 700; width: 100%; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(0, 82, 212, 0.25);
        }
        .btn-act:hover { background: #0041a8; transform: translateY(-2px); }
        a { color: #0052D4; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="config-container">
        <h2><i class="fas fa-cog"></i> Configuración del Sistema</h2>
        
        <div class="card">
            <h3>Tasa BCV</h3>
            <input type="number" id="inputTasa" step="0.01">
        </div>

        <div class="card">
            <h3>Usuarios Autorizados</h3>
            <input type="text" id="inputUsuarios" placeholder="ej: admin, vendedor1, vendedor2">
        </div>

        <div class="card">
            <h3>Formato de Factura</h3>
            <select id="selectFactura">
                <option value="ticket">Ticket (Pos)</option>
                <option value="carta">Carta (A4)</option>
                <option value="media_carta">Media Carta</option>
            </select>
        </div>
        
        <button onclick="guardarConfig()" class="btn-act">GUARDAR CAMBIOS</button>
        <div style="text-align: center; margin-top: 20px;">
            <a href="sys_v1_menu.html">← Volver al Menú</a>
        </div>
    </div>

    <script type="module">
        // ... (Tu lógica de Firebase sigue intacta)
    </script>
</body>
</html>
