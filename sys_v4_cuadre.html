<main class="layout-width">
    <header class="header-panel">
        <h1 class="page-title">Cuadre de Caja Diario</h1>
        <div class="date-selector">
            <input type="date" id="filtro-fecha">
        </div>
    </header>

    <div class="payment-grid" id="grid-totales">
        <div class="pay-card card-efec-dolar">
            <div class="pay-info"><span class="p-label">Efectivo USD</span><span class="p-val" id="tot-usd">$ 0.00</span></div>
        </div>
        <div class="pay-card card-efec-bs">
            <div class="pay-info"><span class="p-label">Efectivo Bs</span><span class="p-val" id="tot-bs">Bs. 0,00</span></div>
        </div>
        <div class="pay-card card-punto">
            <div class="pay-info"><span class="p-label">Punto</span><span class="p-val" id="tot-punto">Bs. 0,00</span></div>
        </div>
        <div class="pay-card card-pago-movil">
            <div class="pay-info"><span class="p-label">Pago Móvil</span><span class="p-val" id="tot-pmovil">Bs. 0,00</span></div>
        </div>
    </div>

    <div class="table-panel">
        <table>
            <thead>
                <tr><th>Hora</th><th>Ref</th><th>Método</th><th>Monto</th></tr>
            </thead>
            <tbody id="tabla-cuerpo"></tbody>
        </table>
    </div>
</main>
