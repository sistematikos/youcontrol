<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Maestro | Gestión Fiscal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #F1F5F9; padding: 20px; display: flex; justify-content: center; }
        .admin-card { background: #fff; width: 100%; max-width: 500px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid #002A54; }
        h2 { color: #002A54; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #E2E8F0; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #002A54; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 15px; }
        button:disabled { background: #94A3B8; cursor: not-allowed; }
        #status { margin-top: 15px; text-align: center; font-weight: 500; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Gestión Fiscal: Firestore</h2>
    <input type="text" id="empresaID" placeholder="ID de Empresa (Ej: YC-2026-001)">
    <input type="text" id="nombreEmpresa" placeholder="Nombre de la Empresa">
    <input type="text" id="rif" placeholder="RIF">
    <input type="text" id="dir" placeholder="Dirección">
    <input type="text" id="tel" placeholder="Teléfono">
    <input type="email" id="email" placeholder="Correo Electrónico">
    <button id="btnGuardar">Guardar en Firestore</button>
    <div id="status"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    // --- COPIA AQUÍ TUS CREDENCIALES EXACTAS DE FIREBASE ---
    const firebaseConfig = {
        apiKey: "TU_API_KEY_COMPLETA_AQUI", 
        authDomain: "youcontrol-1d60a.firebaseapp.com",
        projectId: "youcontrol-1d60a",
        storageBucket: "youcontrol-1d60a.appspot.com",
        messagingSenderId: "812100760013",
        appId: "1:812100760013:web:7574906aa285555faf5484"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const btn = document.getElementById('btnGuardar');
    const status = document.getElementById('status');

    btn.addEventListener('click', async () => {
        const id = document.getElementById('empresaID').value;
        if (!id) {
            alert("El ID de empresa es obligatorio");
            return;
        }

        btn.disabled = true;
        status.innerText = "Guardando, espera un momento...";
        status.style.color = "#0284C7";

        try {
            await setDoc(doc(db, "empresas_config", id), {
                await setDoc(doc(db, "empresas_config", id), {
    nombre: document.getElementById('nombreEmpresa').value, // Nuevo campo
    rif: document.getElementById('rif').value,
    direccion: document.getElementById('dir').value,
    telefono: document.getElementById('tel').value,
    email: document.getElementById('email').value,
    timestamp: new Date().toISOString()
});
                        
            status.innerText = "¡Datos guardados con éxito!";
            status.style.color = "green";
        } catch (e) {
            console.error("Error detallado:", e);
            status.innerText = "Error: " + e.message;
            status.style.color = "red";
        } finally {
            btn.disabled = false;
        }
    });
</script>

</body>
</html>
