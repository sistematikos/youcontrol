<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Maestro | Gestión Fiscal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #F1F5F9; padding: 20px; display: flex; justify-content: center; }
        .admin-card { background: #fff; width: 100%; max-width: 500px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid #002A54; }
        h2 { color: #002A54; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #E2E8F0; border-radius: 8px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        #btnGuardar { background: #002A54; color: white; }
        #btnBuscar { background: #64748B; color: white; }
        #status { margin-top: 15px; text-align: center; font-weight: 500; color: #10B981; }
        .preview-logo { width: 100px; height: 100px; object-fit: contain; margin: 10px auto; display: block; border: 1px solid #E2E8F0; border-radius: 8px; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Gestión Fiscal</h2>
    <input type="text" id="busqueda" placeholder="Buscar por ID o Nombre de Empresa">
    <div class="btn-group">
        <button id="btnBuscar">Buscar</button>
        <button id="btnGuardar">Guardar Cambios</button>
    </div>
    
    <div style="text-align: center; margin-top: 15px;">
        <label style="font-size: 0.7rem; color: #64748B;">LOGO ASOCIADO (Automático según ID):</label>
        <img id="previewLogo" class="preview-logo" onerror="this.style.display='none'">
    </div>

    <input type="text" id="empresaID" placeholder="ID de Empresa" readonly style="background:#F8FAFC;">
    <input type="text" id="nombreEmpresa" placeholder="Nombre de la Empresa">
    <input type="text" id="rif" placeholder="RIF">
    <input type="text" id="dir" placeholder="Dirección">
    <input type="text" id="tel" placeholder="Teléfono">
    <input type="email" id="email" placeholder="Correo Electrónico">
    
    <div id="status"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "TU_API_KEY_COMPLETA_AQUI", 
        authDomain: "youcontrol-1d60a.firebaseapp.com",
        projectId: "youcontrol-1d60a",
        storageBucket: "youcontrol-1d60a.appspot.com",
        messagingSenderId: "812100760013",
        appId: "1:812100760013:web:7574906aa285555faf5484"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function llenarFormulario(id, data) {
        document.getElementById('empresaID').value = id;
        document.getElementById('nombreEmpresa').value = data.nombre || "";
        document.getElementById('rif').value = data.rif || "";
        document.getElementById('dir').value = data.direccion || "";
        document.getElementById('tel').value = data.telefono || "";
        document.getElementById('email').value = data.email || "";
        
        // Construcción automática de URL de logo basada en el ID
        const logoUrl = `https://raw.githubusercontent.com/sistematikos/youcontrol/main/img/${id}.png`;
        document.getElementById('previewLogo').src = logoUrl;
        document.getElementById('status').innerText = "Datos y logo cargados.";
    }

    document.getElementById('btnBuscar').addEventListener('click', async () => {
        const busqueda = document.getElementById('busqueda').value.trim();
        if (!busqueda) return alert("Escribe un ID o nombre");
        
        const docSnap = await getDoc(doc(db, "empresas_config", busqueda));
        if (docSnap.exists()) {
            llenarFormulario(busqueda, docSnap.data());
        } else {
            const q = query(collection(db, "empresas_config"), where("nombre", "==", busqueda));
            const querySnapshot = await getDocs(q);
            if (!querySnapshot.empty) {
                querySnapshot.forEach((d) => llenarFormulario(d.id, d.data()));
            } else {
                alert("No encontrado.");
            }
        }
    });

    document.getElementById('btnGuardar').addEventListener('click', async () => {
        const id = document.getElementById('empresaID').value;
        if (!id) return alert("Busca una empresa primero");

        try {
            await setDoc(doc(db, "empresas_config", id), {
                nombre: document.getElementById('nombreEmpresa').value,
                rif: document.getElementById('rif').value,
                direccion: document.getElementById('dir').value,
                telefono: document.getElementById('tel').value,
                email: document.getElementById('email').value
            }, { merge: true });
            document.getElementById('status').innerText = "✅ Cambios guardados.";
        } catch (e) { alert("Error: " + e.message); }
    });
</script>

</body>
</html>
