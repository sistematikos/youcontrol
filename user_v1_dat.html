<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Maestro | Gestión Fiscal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #F1F5F9; padding: 20px; }
        .admin-card { background: #fff; max-width: 600px; margin: 0 auto; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid #002A54; }
        h2 { color: #002A54; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #E2E8F0; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #002A54; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        button:hover { background: #0284C7; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Gestión Fiscal: Firestore</h2>
    <input type="text" id="empresaID" placeholder="ID de Empresa (Ej: YC-2026-001)">
    <input type="text" id="rif" placeholder="RIF">
    <input type="text" id="dir" placeholder="Dirección">
    <input type="text" id="tel" placeholder="Teléfono">
    <input type="email" id="email" placeholder="Correo Electrónico">
    <button onclick="guardarDatos()">Guardar en Firestore</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    const firebaseConfig = { 
        // COPIA AQUÍ TUS CREDENCIALES DE FIREBASE DESDE LA CONSOLA
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.guardarDatos = async () => {
        const id = document.getElementById('empresaID').value;
        if (!id) return alert("Ingrese un ID de empresa");

        try {
            // Guardamos en la colección 'empresas_config' usando el ID como documento
            await setDoc(doc(db, "empresas_config", id), {
                rif: document.getElementById('rif').value,
                direccion: document.getElementById('dir').value,
                telefono: document.getElementById('tel').value,
                email: document.getElementById('email').value,
                fecha_actualizacion: new Date().toISOString()
            });
            alert("¡Datos guardados correctamente en Firestore!");
        } catch (e) {
            console.error(e);
            alert("Error al guardar: " + e.message);
        }
    };
</script>

</body>
</html>
