<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Maestro | Gestión Fiscal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #F1F5F9; padding: 20px; display: flex; justify-content: center; }
        .admin-card { background: #fff; width: 100%; max-width: 500px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 5px solid #002A54; }
        h2 { color: #002A54; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #E2E8F0; border-radius: 8px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        #btnGuardar { background: #002A54; color: white; }
        #btnBuscar { background: #64748B; color: white; }
        #btnSubirLogo { background: #10B981; color: white; width: 100%; margin-top: 5px; }
        #status { margin-top: 15px; text-align: center; font-weight: 500; font-size: 0.9rem; }
        .preview-logo { width: 80px; height: 80px; object-fit: contain; margin: 10px auto; display: none; border: 1px solid #E2E8F0; }
    </style>
</head>
<body>

<div class="admin-card">
    <h2>Gestión Fiscal</h2>
    <input type="text" id="empresaID" placeholder="ID de Empresa (Ej: YC-2026-001)">
    <div class="btn-group">
        <button id="btnBuscar">Buscar Datos</button>
        <button id="btnGuardar">Guardar Cambios</button>
    </div>
    
    <input type="text" id="nombreEmpresa" placeholder="Nombre de la Empresa">
    <input type="text" id="rif" placeholder="RIF">
    <input type="text" id="dir" placeholder="Dirección">
    <input type="text" id="tel" placeholder="Teléfono">
    <input type="email" id="email" placeholder="Correo Electrónico">
    
    <div style="margin-top: 15px; border-top: 1px solid #E2E8F0; padding-top: 15px;">
        <label style="font-size: 0.8rem; color: #64748B;">Logo corporativo:</label>
        <img id="previewLogo" class="preview-logo">
        <input type="file" id="inputLogo" accept="image/*">
        <button id="btnSubirLogo">SUBIR LOGO</button>
    </div>
    
    <div id="status"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "TU_API_KEY_COMPLETA_AQUI", 
        authDomain: "youcontrol-1d60a.firebaseapp.com",
        projectId: "youcontrol-1d60a",
        storageBucket: "youcontrol-1d60a.appspot.com",
        messagingSenderId: "812100760013",
        appId: "1:812100760013:web:7574906aa285555faf5484"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // Buscar
    document.getElementById('btnBuscar').addEventListener('click', async () => {
        const id = document.getElementById('empresaID').value;
        if (!id) return alert("Escribe un ID");
        
        const docSnap = await getDoc(doc(db, "empresas_config", id));
        if (docSnap.exists()) {
            const d = docSnap.data();
            document.getElementById('nombreEmpresa').value = d.nombre || "";
            document.getElementById('rif').value = d.rif || "";
            document.getElementById('dir').value = d.direccion || "";
            document.getElementById('tel').value = d.telefono || "";
            document.getElementById('email').value = d.email || "";
            
            const preview = document.getElementById('previewLogo');
            if (d.logoUrl) {
                preview.src = d.logoUrl;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
            document.getElementById('status').innerText = "Datos cargados.";
        } else {
            alert("Nueva empresa, puedes configurarla.");
        }
    });

    // Guardar texto
    document.getElementById('btnGuardar').addEventListener('click', async () => {
        const id = document.getElementById('empresaID').value;
        if (!id) return alert("ID obligatorio");
        try {
            await setDoc(doc(db, "empresas_config", id), {
                nombre: document.getElementById('nombreEmpresa').value,
                rif: document.getElementById('rif').value,
                direccion: document.getElementById('dir').value,
                telefono: document.getElementById('tel').value,
                email: document.getElementById('email').value
            }, { merge: true });
            document.getElementById('status').innerText = "¡Guardado exitosamente!";
        } catch (e) { alert("Error: " + e.message); }
    });

    // Subir Logo
    document.getElementById('btnSubirLogo').addEventListener('click', async () => {
        const id = document.getElementById('empresaID').value;
        const file = document.getElementById('inputLogo').files[0];
        if (!id || !file) return alert("ID y archivo son obligatorios");

        const status = document.getElementById('status');
        status.innerText = "Subiendo...";
        try {
            const storageRef = ref(storage, `logos/${id}/logo.png`);
            await uploadBytes(storageRef, file);
            const url = await getDownloadURL(storageRef);
            await setDoc(doc(db, "empresas_config", id), { logoUrl: url }, { merge: true });
            document.getElementById('previewLogo').src = url;
            document.getElementById('previewLogo').style.display = 'block';
            status.innerText = "✅ Logo actualizado";
        } catch (e) { status.innerText = "Error: " + e.message; }
    });
</script>

</body>
</html>
