<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Configuración de Tasa | You Control</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #002d72; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-act { width: 100%; padding: 12px; background: #0052d4; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .back-link { margin-top: 20px; color: #0052d4; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="card">
        <h2>$ Tasa BCV</h2>
        <label>Valor actual de la tasa:</label>
        <input type="number" id="inputTasa" step="0.01" placeholder="0.00">
        <button class="btn-act" onclick="guardarTasa()">GUARDAR NUEVA TASA</button>
    </div>

    <a href="sys_config.html" class="back-link">← Volver a Configuración</a>

    <script type="module">
        import { db } from './js/firebase-config.js'; 
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Referencia a la colección 'configuracion', documento 'tasa'
        // Obtén el ID del usuario igual que en tus otros archivos
const USER_ID = localStorage.getItem('youcontrol_empresa_id'); 

// Apuntamos al documento del usuario, donde quieres guardar el campo
const tasaRef = doc(db, "usuarios", USER_ID); 

async function cargarTasa() {
    try {
        const snap = await getDoc(tasaRef);
        if (snap.exists() && snap.data().tasa_bcv) {
            document.getElementById('inputTasa').value = snap.data().tasa_bcv;
        }
    } catch (error) {
        console.error("Error al cargar tasa:", error);
    }
}

window.guardarTasa = async () => {
    const valor = document.getElementById('inputTasa').value;
    if (!valor) return alert("Ingresa un valor");

    try {
        // Usamos setDoc con {merge: true} para solo actualizar ese campo sin borrar lo demás
        await setDoc(tasaRef, { 
            tasa_bcv: parseFloat(valor) 
        }, { merge: true });
        
        alert("Tasa guardada en el perfil del usuario.");
        window.location.href = "sys_config.html";
    } catch (e) {
        alert("Error: " + e.message);
    }
};
    </script>
</body>
</html>
