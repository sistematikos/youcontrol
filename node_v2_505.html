<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --navy: #0F172A; --electric: #3B82F6; --emerald: #10B981; --dark-slate: #1E293B; }
        body { font-family: 'Poppins', sans-serif; background: var(--navy); margin: 0; padding-bottom: 90px; color: white; }
        
        .header-mini { padding: 15px; text-align: center; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .container { padding: 10px; max-width: 800px; margin: auto; }

        /* Grid de 2 columnas fijas para teléfonos */
        .grid-catalog { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
        }

        /* Tarjeta de 3 líneas exactas */
        .card-prod { 
            background: var(--dark-slate); 
            border-radius: 12px; 
            padding: 10px; 
            display: flex; 
            flex-direction: column;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* LÍNEA 1: Nombre y Tilde */
        .line-1 { display: flex; justify-content: space-between; align-items: center; }
        .line-1 h3 { margin: 0; font-size: 0.85rem; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .check-icon { color: var(--emerald); font-size: 0.9rem; display: none; }

        /* LÍNEA 2: Precios $ y Bs */
        .line-2 { display: flex; align-items: baseline; gap: 5px; }
        .price-usd { font-size: 1.1rem; font-weight: 800; color: white; }
        .price-bs { font-size: 0.7rem; color: var(--emerald); font-weight: 600; }

        /* LÍNEA 3: Controles +/- */
        .line-3 { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: rgba(0,0,0,0.3); 
            border-radius: 8px; 
            padding: 3px;
        }
        .btn-qty { 
            background: #334155; 
            border: none; 
            color: white;
            width: 30px; 
            height: 30px; 
            border-radius: 6px; 
            cursor: pointer;
            font-weight: bold;
        }
        .qty-val { font-weight: 800; font-size: 0.9rem; }

        /* Botón de Pedido Flotante */
        #cart-footer { 
            position: fixed; bottom: 15px; left: 15px; right: 15px;
            background: var(--emerald); color: white; 
            padding: 12px; border-radius: 15px; 
            display: none; justify-content: space-between; align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-weight: bold;
        }
    </style>
</head>
<body oncontextmenu="return false">
    <header class="header-mini">
        <h2 style="margin:0; font-size: 1rem;">CATÁLOGO</h2>
        <small style="opacity: 0.6;">Tasa: <span id="tasa-cliente">0.00</span> Bs.</small>
    </header>

    <main class="container">
        <div class="grid-catalog" id="contenedor-catalogo"></div>
    </main>

    <div id="cart-footer" onclick="enviarPedido()">
        <span>ENVIAR PEDIDO (<span id="cart-count">0</span>)</span>
        <span>$ <span id="cart-total">0.00</span></span>
    </div>

    <script type="module" src="js/catalogo.js"></script>
</body>
</html>
