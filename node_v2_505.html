<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --navy: #0F172A; --electric: #3B82F6; --emerald: #10B981; --dark-slate: #1E293B; }
        body { font-family: 'Poppins', sans-serif; background: var(--navy); margin: 0; padding-bottom: 90px; color: white; }
        
        .header-mini { padding: 15px; text-align: center; background: rgba(0,0,0,0.2); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .container { padding: 10px; max-width: 800px; margin: auto; }

        .grid-catalog { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }

        .card-prod { 
            background: var(--dark-slate); 
            border-radius: 15px; 
            padding: 12px; 
            display: flex; 
            flex-direction: column;
            gap: 10px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }

        /* LÍNEA 1: Nombre centrado con tilde flotante */
        .line-1 { position: relative; padding: 0 5px; }
        .line-1 h3 { margin: 0; font-size: 0.85rem; text-transform: uppercase; line-height: 1.2; }
        .check-icon { color: var(--emerald); font-size: 0.8rem; position: absolute; top: -5px; right: -5px; display: none; }

        /* LÍNEA 2: Precios centrados (Bs más grande) */
        .line-2 { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            gap: 2px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            padding: 5px 0;
        }
        .price-usd { font-size: 0.9rem; font-weight: 400; opacity: 0.8; }
        .price-bs { font-size: 1.15rem; color: var(--emerald); font-weight: 800; }

        /* LÍNEA 3: Controles */
        .line-3 { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 5px;
        }
        .btn-qty { 
            background: #334155; border: none; color: white;
            width: 32px; height: 32px; border-radius: 8px; 
            cursor: pointer; font-weight: bold; font-size: 1.2rem;
        }
        .qty-val { font-weight: 800; font-size: 1.1rem; min-width: 25px; }

        #cart-footer { 
            position: fixed; bottom: 15px; left: 15px; right: 15px;
            background: var(--emerald); color: white; 
            padding: 14px; border-radius: 18px; 
            display: none; justify-content: space-between; align-items: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-weight: bold; z-index: 100;
        }
    </style>
</head>
<body oncontextmenu="return false">
    <header class="header-mini">
        <h2 style="margin:0; font-size: 1.1rem;">CATÁLOGO DIGITAL</h2>
        <small style="opacity: 0.6;">Tasa: <span id="tasa-cliente">0.00</span> Bs.</small>
    </header>

    <main class="container">
        <div class="grid-catalog" id="contenedor-catalogo"></div>
    </main>

    <div id="cart-footer" onclick="enviarPedido()">
        <span>ENVIAR PEDIDO (<span id="cart-count">0</span>)</span>
        <span>$ <span id="cart-total">0.00</span></span>
    </div>

    <script type="module" src="js/catalogo.js"></script>
</body>
</html>
