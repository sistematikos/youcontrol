<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --navy: #0F172A; --electric: #3B82F6; --emerald: #10B981; }
        body { font-family: 'Poppins', sans-serif; background: #F1F5F9; margin: 0; padding-bottom: 100px; }
        
        .header-catalog { background: var(--navy); color: white; padding: 15px; text-align: center; }
        .container { max-width: 1200px; margin: auto; padding: 10px; }
        
        /* Grid ajustado para más densidad */
        .grid-catalog { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
            gap: 12px; 
        }

        /* Tarjeta Compacta */
        .card-prod { 
            background: white; 
            border-radius: 15px; 
            padding: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            display: flex; 
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
        }

        /* Línea superior: Nombre + Check */
        .title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 5px; }
        .title-row h3 { margin: 0; font-size: 0.95rem; line-height: 1.2; color: var(--navy); }
        .check-icon { color: var(--emerald); font-size: 0.8rem; display: none; } /* Se activa con JS */

        /* Línea de Precios: Lado a lado */
        .price-row { 
            display: flex; 
            align-items: baseline; 
            gap: 8px; 
            margin: 8px 0; 
            border-top: 1px solid #f1f5f9;
            padding-top: 5px;
        }
        .price-usd { font-size: 1.1rem; font-weight: 800; color: var(--navy); }
        .price-bs { font-size: 0.75rem; color: #64748b; font-weight: 600; }

        /* Controles pequeños */
        .qty-control { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            background: #f8fafc; 
            border-radius: 10px; 
            padding: 4px;
        }
        .btn-qty { 
            background: white; 
            border: 1px solid #e2e8f0; 
            width: 28px; 
            height: 28px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1rem;
        }
        .qty-val { font-weight: 800; font-size: 0.9rem; }

        /* Footer flotante más pequeño */
        #cart-footer { 
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 400px; background: var(--navy); 
            color: white; padding: 12px 20px; border-radius: 20px; 
            display: none; justify-content: space-between; align-items: center; 
            z-index: 1000; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body oncontextmenu="return false">
    <header class="header-catalog">
        <h2 style="margin:0; font-size: 1.2rem;">CATÁLOGO</h2>
        <small style="opacity: 0.8;">Tasa: <span id="tasa-cliente">0.00</span> Bs.</small>
    </header>

    <main class="container">
        <div class="grid-catalog" id="contenedor-catalogo"></div>
    </main>

    <div id="cart-footer">
        <div style="font-size: 1rem; font-weight: 800;">$ <span id="cart-total">0.00</span></div>
        <button onclick="enviarPedido()" style="background:var(--emerald); color:white; border:none; padding:8px 15px; border-radius:10px; font-weight:bold; cursor:pointer;">
            ENVIAR (<span id="cart-count">0</span>)
        </button>
    </div>

    <script type="module" src="js/catalogo.js"></script>
</body>
</html>
