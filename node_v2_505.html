<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo Digital | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --bg-light: #F8FAFC; --card-bg: #FFFFFF; --electric: #3B82F6; --emerald: #10B981; --border: #E2E8F0; }
        
        /* Fix para Safari iOS */
        html, body { height: 100%; -webkit-overflow-scrolling: touch; font-family: 'Poppins', sans-serif; background: var(--bg-light); margin: 0; padding-bottom: 150px; }

        .app-header { background: white; padding: 15px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .tasa-box { background: #F1F5F9; padding: 5px 12px; border-radius: 8px; text-align: right; }
        .tasa-val { font-size: 0.9rem; font-weight: 800; color: var(--electric); }
        
        .search-bar { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 12px; box-sizing: border-box; font-size: 16px; }

        .container { padding: 15px; }
        .grid-catalog { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .card-prod { background: white; border-radius: 12px; padding: 12px; border: 1px solid var(--border); border-left: 6px solid var(--emerald); display: flex; flex-direction: column; gap: 5px; }
        .line-1 h3 { font-size: 0.8rem; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .price-bs { font-size: 1rem; font-weight: 900; color: var(--emerald); }
        
        #cart-footer { position: fixed; bottom: 20px; left: 5%; width: 90%; background: white; padding: 15px; border-radius: 20px; display: none; align-items: center; justify-content: space-between; box-shadow: 0 10px 20px rgba(0,0,0,0.2); z-index: 1000; }
        .btn-whatsapp { background: var(--emerald); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; }
        
        #loader { text-align: center; padding: 40px; color: #64748B; }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-top">
            <img src="img/logo.png" style="height:30px;">
            <div class="tasa-box"><span id="tasa-cliente">0.00</span> Bs</div>
        </div>
        <input type="text" id="buscador-prod" placeholder="🔍 Buscar..." class="search-bar">
    </header>

    <div id="loader">Cargando productos...</div>
    <main class="container"><div class="grid-catalog" id="contenedor-catalogo"></div></main>

    <div id="cart-footer">
        <div>Total: $<span id="cart-total-usd">0.00</span></div>
        <button class="btn-whatsapp" onclick="enviarPedido()">Pedir (<span id="cart-count">0</span>)</button>
    </div>

    <script type="module" src="js/catalogo.js"></script>
</body>
</html>
