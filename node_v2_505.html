<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital | Sistematikos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --navy: #0F172A; --electric: #3B82F6; --emerald: #10B981; --dark-slate: #1E293B; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--navy); 
            margin: 0; 
            padding-bottom: 120px; 
            color: white; 
        }
        
        .header-mini { 
            padding: 15px; 
            text-align: center; 
            background: rgba(0,0,0,0.2); 
            border-bottom: 2px solid var(--electric); 
        }

        .container { padding: 12px; max-width: 800px; margin: auto; }

        /* Grid de 2 columnas para móviles */
        .grid-catalog { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }

        /* Tarjeta de 3 niveles centrada */
        .card-prod { 
            background: var(--dark-slate); 
            border-radius: 18px; 
            padding: 15px 10px; 
            display: flex; 
            flex-direction: column;
            gap: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
            position: relative;
        }

        /* LÍNEA 1: Nombre */
        .line-1 h3 { 
            margin: 0; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            line-height: 1.2; 
            font-weight: 600;
        }
        .check-icon { 
            color: var(--emerald); 
            font-size: 0.9rem; 
            position: absolute; 
            top: 8px; 
            right: 8px; 
            display: none; 
        }

        /* LÍNEA 2: Precios (Bs Resaltado) */
        .line-2 { 
            display: flex; 
            flex-direction: column; 
            gap: 2px;
        }
        .price-usd { font-size: 0.85rem; opacity: 0.6; font-weight: 400; }
        .price-bs { font-size: 1.2rem; color: var(--emerald); font-weight: 800; }

        /* LÍNEA 3: Controles +/- */
        .line-3 { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 10px;
        }
        .btn-qty { 
            background: #334155; 
            border: none; 
            color: white;
            width: 34px; 
            height: 34px; 
            border-radius: 10px; 
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-val { font-weight: 800; font-size: 1.1rem; min-width: 25px; }

        /* Carrito con Total Arriba */
        #cart-footer { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 85%; 
            max-width: 350px; 
            background: #1e293be6; 
            backdrop-filter: blur(10px);
            color: white; 
            padding: 20px; 
            border-radius: 25px; 
            display: none; 
            flex-direction: column;
            align-items: center; 
            gap: 15px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); 
            z-index: 1000; 
            border: 2px solid var(--emerald);
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp {
            from { bottom: -150px; opacity: 0; }
            to { bottom: 20px; opacity: 1; }
        }

        .cart-info { text-align: center; }
        .cart-info small { font-size: 0.7rem; opacity: 0.6; letter-spacing: 1px; }
        .cart-total-big { font-size: 2rem; font-weight: 900; margin-top: -5px; }

        .btn-whatsapp { 
            background: var(--emerald); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 15px; 
            border-radius: 15px; 
            font-weight: 800; 
            font-size: 1rem;
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px;
        }
    </style>
</head>
<body oncontextmenu="return false">

    <header class="header-mini">
        <h2 style="margin:0; font-size: 1rem; letter-spacing: 1px;">CATÁLOGO DE PRODUCTOS</h2>
        <div style="font-size: 0.8rem; color: var(--emerald); font-weight: bold; margin-top: 4px;">
            TASA: <span id="tasa-cliente">0.00</span> Bs.
        </div>
    </header>

    <main class="container">
        <div class="grid-catalog" id="contenedor-catalogo">
            </div>
    </main>

    <div id="cart-footer">
        <div class="cart-info">
            <small>TOTAL A PAGAR</small>
            <div class="cart-total-big">$ <span id="cart-total">0.00</span></div>
        </div>
        <button class="btn-whatsapp" onclick="enviarPedido()">
            <i class="fab fa-whatsapp"></i> ENVIAR PEDIDO (<span id="cart-count">0</span>)
        </button>
    </div>

    <script type="module" src="js/catalogo.js"></script>
</body>
</html>
