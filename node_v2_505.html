<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital | You Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #0F172A; 
            --accent-blue: #2563EB;
            --accent-orange: #EA580C;
            --emerald: #10B981; 
            --bg-body: #F1F5F9; 
            --card-bg: #FFFFFF;
            --text-main: #0F172A; 
            --text-muted: #64748B;
            --border: #E2E8F0; 
            --shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg-body); 
            color: var(--text-main);
            margin: 0; 
            padding-bottom: 140px; 
        }
        
        .page-wrapper { 
            max-width: 800px; 
            margin: 0 auto; 
            width: 100%; 
            box-sizing: border-box; 
        }

        /* --- CINTILLA SUPERIOR YOU CONTROL --- */
        .youcontrol-badge {
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: #F8FAFC;
            text-align: center;
            padding: 8px 15px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .app-header { 
            padding: 15px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            background: rgba(241, 245, 249, 0.95);
            backdrop-filter: blur(10px);
        }
        
        .header-grid { 
            display: grid; 
            grid-template-columns: 100px 1fr 1fr; 
            grid-template-rows: auto auto auto; 
            gap: 10px; 
        }
        
        .card-logo { 
            grid-row: 1 / 3; 
            background: var(--card-bg); 
            border-radius: 14px; 
            border: 1px solid var(--border); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            padding: 4px; 
            box-shadow: var(--shadow); 
        }
        .logo-img { width: 100%; height: 100%; object-fit: contain; }
        
        .card-right { 
            background: var(--card-bg); 
            border-radius: 14px; 
            border: 1px solid var(--border); 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 14px; 
            box-shadow: var(--shadow); 
        }
        
        #nombre-empresa { 
            color: var(--primary); 
            font-size: 0.95rem; 
            font-weight: 900; 
            text-transform: uppercase;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-whatsapp-header {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); 
            color: white; 
            border: none; 
            border-radius: 50%; 
            width: 36px; 
            height: 36px; 
            cursor: pointer; 
            font-size: 16px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.35);
            transition: transform 0.2s;
        }
        .btn-whatsapp-header:hover { transform: scale(1.08); }

        .card-tasa {
            background: linear-gradient(135deg, #1E40AF 0%, #2563EB 100%);
            color: white;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.85rem;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        
        .card-direccion { 
            grid-column: 2 / 4; 
            background: var(--card-bg); 
            border-radius: 14px; 
            border: 1px solid var(--border); 
            display: flex; 
            align-items: center; 
            padding: 8px 14px; 
            font-size: 0.75rem; 
            color: var(--text-muted); 
            font-weight: 600;
            box-shadow: var(--shadow);
        }
        
        .search-container {
            grid-column: 1 / 4;
            margin-top: 4px;
        }
        .search-bar { 
            width: 100%; 
            padding: 12px 18px; 
            border: 1px solid #CBD5E1; 
            border-radius: 14px; 
            background: var(--card-bg); 
            box-sizing: border-box; 
            font-size: 0.88rem;
            font-family: 'Poppins', sans-serif;
            box-shadow: var(--shadow);
            outline: none;
            transition: all 0.2s;
        }
        .search-bar:focus { 
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        
        .grid-catalog { padding: 0 15px; }

        /* Tarjeta de Producto */
        .card-prod { 
            background: var(--card-bg); 
            border-radius: 14px; 
            padding: 14px; 
            border: 1px solid var(--border); 
            border-left: 5px solid var(--emerald); 
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }
        .card-prod:hover { transform: translateY(-2px); }

        .btn-cant {
            background: #F1F5F9;
            border: 1px solid #CBD5E1;
            color: var(--primary);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-cant:hover { background: var(--accent-blue); color: white; border-color: var(--accent-blue); }

        /* Footer Flotante del Carrito */
        #cart-footer { 
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 92%; 
            max-width: 420px; 
            background: var(--primary); 
            color: white;
            padding: 12px 20px; 
            border-radius: 20px; 
            display: none; 
            align-items: center; 
            justify-content: space-between; 
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.3); 
            z-index: 1000; 
            border: 1px solid rgba(255,255,255,0.1); 
        }

        .total-box span { font-size: 1.15rem; font-weight: 900; color: #38BDF8; }
        .total-box small { font-size: 0.8rem; color: #94A3B8; font-weight: 700; }
    </style>
</head>
<body>

    <div class="youcontrol-badge">
        🚀 SOFTWARE ADMINISTRATIVO YOU CONTROL &bull; CATÁLOGO DIGITAL
    </div>

    <div class="page-wrapper">
        <header class="app-header">
            <div class="header-grid">
                <!-- Logo -->
                <div class="card-logo">
                    <img id="logo-empresa" src="" class="logo-img" style="display:none;" onerror="this.style.display='none'">
                </div>
                
                <!-- Nombre y WhatsApp -->
                <div class="card-right" style="grid-column: 2 / 3;">
                    <span id="nombre-empresa" style="opacity: 0; transition: opacity 0.5s ease;">CARGANDO...</span>
                    <button onclick="window.abrirWhatsApp()" class="btn-whatsapp-header" title="Contactar por WhatsApp">💬</button>
                </div>

                <!-- Tasa BCV Destacada -->
                <div class="card-tasa">
                    BCV: <span id="tasa-cliente" style="margin-left:6px;">0.00</span> Bs
                </div>
                
                <!-- Dirección -->
                <div class="card-direccion" id="direccion-empresa">📍 Cargando dirección...</div>
                
                <!-- Buscador -->
                <div class="search-container">
                    <input type="text" id="buscador-prod" placeholder="🔍 ¿Qué repuesto o producto buscas?" class="search-bar">
                </div>
            </div>
        </header>

        <main id="contenedor-catalogo" class="grid-catalog"></main>
    </div>

    <!-- Footer de Compra Persuasivo -->
    <div id="cart-footer">
        <div class="total-box">
            $<span id="cart-total-usd">0.00</span><br>
            <small><span id="cart-total-bs">0.00</span> Bs</small>
        </div>
        <button onclick="enviarPedido()" style="background: linear-gradient(135deg, #10B981 0%, #059669 100%); color:white; border:none; padding:12px 22px; border-radius:14px; font-weight:800; font-size:0.9rem; cursor:pointer; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);">
            Enviar Pedido (<span id="cart-count">0</span>) 🛍️
        </button>
    </div>
    
    <script type="module" src="js/catalogo.js"></script>
</body>
</html>
