<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario | You Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --dark: #1E1E2D; --vinotinto: #800020; --blue: #3B82F6; --emerald: #10B981; }
        body { font-family: 'Poppins', sans-serif; background: #F4F7F9; margin: 0; }
        .header-main { background: var(--dark); color: white; padding: 20px; display: flex; justify-content: center; align-items: center; border-bottom: 5px solid var(--vinotinto); }
        .tasa-badge { background: #2B2B40; padding: 8px 15px; border-radius: 12px; font-weight: 700; margin-left: 20px; border: 1px solid #3f3f5a; }
        .tasa-badge span { color: var(--blue); }
        .btn-group { padding: 20px; display: flex; gap: 10px; max-width: 1200px; margin: auto; }
        .table-wrapper { background: white; border-radius: 20px; margin: 0 20px; overflow-x: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { background: #F8FAFC; padding: 18px; text-align: left; color: #64748B; font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 15px 18px; border-bottom: 1px solid #F1F5F9; }
        .price-bs { color: var(--blue); font-weight: 900; font-size: 1.1rem; }
        .badge-stock { background: #F1F5F9; padding: 5px 12px; border-radius: 8px; font-weight: 800; }
        .utilidad-pill { background: #DCFCE7; color: #166534; padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; }
    </style>
</head>
<body oncontextmenu="return false">

    <header class="header-main">
        <h2 style="margin:0; font-size: 1.4rem;">YOU CONTROL</h2>
        <div class="tasa-badge">Tasa: <span id="tasa-valor">0.00 Bs.</span></div>
    </header>

    <div class="btn-group">
        <button onclick="actualizarTasa()" style="background:var(--blue); color:white; border:none; padding:12px 18px; border-radius:12px; font-weight:700; cursor:pointer;">
            <i class="fas fa-sync"></i> TASA
        </button>
        <button onclick="location.href='sys_v1_datos.html'" style="background:var(--emerald); color:white; border:none; padding:12px 18px; border-radius:12px; font-weight:700; cursor:pointer;">
            <i class="fas fa-plus"></i> CARGAR STOCK
        </button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 30%;">Producto</th>
                    <th style="width: 10%;">Stock</th>
                    <th style="width: 15%;">Costo $</th>
                    <th style="width: 15%;">Venta $</th>
                    <th style="width: 15%;">Precio Bs.</th>
                    <th style="width: 15%; text-align:center;">Gestión</th>
                </tr>
            </thead>
            <tbody id="tabla-inventario"></tbody>
        </table>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const UID = "sUhfZI9Fy3M9UlInTYw2wFWZmB12";
        let tasaActual = 0;

        // Escuchar Tasa en tiempo real
        onSnapshot(doc(db, "usuarios", UID, "configuracion", "tasa"), (snap) => {
            if (snap.exists()) {
                tasaActual = snap.data().valor;
                document.getElementById('tasa-valor').innerText = tasaActual.toLocaleString('es-VE') + " Bs.";
                cargarProductos();
            }
        });

        window.actualizarTasa = async () => {
            const nv = prompt("Nueva tasa de cambio (Bs.):", tasaActual);
            if (nv && !isNaN(nv)) {
                await updateDoc(doc(db, "usuarios", UID, "configuracion", "tasa"), { valor: parseFloat(nv) });
            }
        };

        function cargarProductos() {
            onSnapshot(collection(db, "usuarios", UID, "productos"), (snap) => {
                const tbody = document.getElementById('tabla-inventario');
                tbody.innerHTML = "";
                snap.forEach(docSnap => {
                    const p = docSnap.data();
                    const costo = p.costo || 0;
                    const precioVenta = p.precio || 0;
                    const ganancia = precioVenta - costo;
                    
                    tbody.innerHTML += `
                        <tr>
                            <td><b>${p.nombre}</b><br><small style="color:#94A3B8;">${p.codigo || 'S/C'}</small></td>
                            <td><span class="badge-stock">${p.stock || 0}</span></td>
                            <td style="color:#64748B;">$ ${costo.toFixed(2)}</td>
                            <td>
                                <b>$ ${precioVenta.toFixed(2)}</b><br>
                                <span class="utilidad-pill">Ganancia: $ ${ganancia.toFixed(2)}</span>
                            </td>
                            <td class="price-bs">${(precioVenta * tasaActual).toLocaleString('es-VE')} Bs.</td>
                            <td style="text-align:center;">
                                <button style="color:var(--blue); background:none; border:none; font-size:1.1rem; cursor:pointer;"><i class="fas fa-edit"></i></button>
                                <button style="color:#EF4444; background:none; border:none; font-size:1.1rem; cursor:pointer; margin-left:10px;"><i class="fas fa-eye-slash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            });
        }
    </script>
</body>
</html>
