<style>
    /* Estilos para el Modal de Edición */
    .modal {
        display: none; position: fixed; z-index: 1000; left: 0; top: 0;
        width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);
        backdrop-filter: blur(5px);
    }
    .modal-content {
        background-color: white; margin: 5% auto; padding: 25px;
        border-radius: 20px; width: 90%; max-width: 500px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .modal-header { border-bottom: 2px solid #F1F5F9; padding-bottom: 15px; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; color: #64748B; margin-bottom: 5px; }
    .form-input { 
        width: 100%; padding: 12px; border: 2px solid #E2E8F0; border-radius: 10px; 
        font-family: 'Poppins'; box-sizing: border-box;
    }
    .form-input:focus { border-color: var(--blue); outline: none; }
    .modal-footer { display: flex; gap: 10px; margin-top: 25px; }
    .btn-save-edit { background: var(--emerald); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 700; flex: 1; cursor: pointer; }
    .btn-cancel { background: #F1F5F9; color: #64748B; border: none; padding: 12px; border-radius: 10px; font-weight: 700; flex: 1; cursor: pointer; }
</style>

<body oncontextmenu="return false">

    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0;"><i class="fas fa-edit" style="color:var(--blue);"></i> Editar Producto</h3>
            </div>
            <div id="formEditar">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="edit-nombre" class="form-input">
                </div>
                <div class="form-group">
                    <label>Costo ($)</label>
                    <input type="number" id="edit-costo" class="form-input" step="0.01" oninput="recalcularEdit()">
                </div>
                <div class="form-group">
                    <label>Precio Venta ($)</label>
                    <input type="number" id="edit-precio" class="form-input" step="0.01" oninput="recalcularEdit('precio')">
                </div>
                <div class="form-group">
                    <label>Ganancia (%)</label>
                    <input type="number" id="edit-margen" class="form-input" step="0.1" oninput="recalcularEdit('margen')">
                </div>
                <div class="form-group">
                    <label>Stock Actual</label>
                    <input type="number" id="edit-stock" class="form-input">
                </div>
                <div class="modal-footer">
                    <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                    <button class="btn-save-edit" onclick="guardarCambios()">Actualizar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from './js/firebase-config.js';
        import { collection, onSnapshot, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ... (Código de Tasa e Inventario se mantiene igual) ...

        // FUNCIÓN PARA ABRIR EL MODAL Y CARGAR DATOS
        window.prepararEdicion = async (id) => {
            const docRef = doc(db, "usuarios", UID, "productos", id);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const p = docSnap.data();
                document.getElementById('edit-id').value = id;
                document.getElementById('edit-nombre').value = p.nombre;
                document.getElementById('edit-costo').value = p.costo;
                document.getElementById('edit-precio').value = p.precio;
                document.getElementById('edit-stock').value = p.stock;
                
                // Calcular margen inicial
                const margen = ((p.precio - p.costo) / p.costo) * 100;
                document.getElementById('edit-margen').value = margen.toFixed(0);

                document.getElementById('modalEditar').style.display = 'block';
            }
        };

        // Lógica bidireccional dentro del modal
        window.recalcularEdit = (origen) => {
            const costo = parseFloat(document.getElementById('edit-costo').value) || 0;
            const margenInput = document.getElementById('edit-margen');
            const precioInput = document.getElementById('edit-precio');

            if (costo <= 0) return;

            if (origen === 'margen') {
                const m = parseFloat(margenInput.value) || 0;
                precioInput.value = (costo + (costo * (m / 100))).toFixed(2);
            } else {
                const p = parseFloat(precioInput.value) || 0;
                margenInput.value = (((p - costo) / costo) * 100).toFixed(0);
            }
        };

        window.cerrarModal = () => {
            document.getElementById('modalEditar').style.display = 'none';
        };

        window.guardarCambios = async () => {
            const id = document.getElementById('edit-id').value;
            const btn = document.querySelector('.btn-save-edit');
            btn.disabled = true;
            btn.innerText = "Guardando...";

            try {
                const docRef = doc(db, "usuarios", UID, "productos", id);
                await updateDoc(docRef, {
                    nombre: document.getElementById('edit-nombre').value,
                    costo: parseFloat(document.getElementById('edit-costo').value) || 0,
                    precio: parseFloat(document.getElementById('edit-precio').value) || 0,
                    stock: parseInt(document.getElementById('edit-stock').value) || 0
                });
                cerrarModal();
            } catch (e) {
                alert("Error al actualizar");
            } finally {
                btn.disabled = false;
                btn.innerText = "Actualizar";
            }
        };
        
        // No olvides actualizar el botón en el renderizado de la tabla:
        // El botón ahora debe ser: <button onclick="prepararEdicion('${p.id}')" ...>
    </script>
</body>
