<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cobro - You Control</title>
    <style>
        body { font-family: sans-serif; background: #001A3D; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; color: #333; padding: 30px; border-radius: 20px; width: 350px; text-align: center; }
        .display { background: #001A3D; color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1.2rem; text-align: right; }
        .btn { background: #0052D4; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="display">
            <div id="mUSD" style="font-size: 2rem;">$ 0.00</div>
            <div id="mBS">0,00 Bs.</div>
        </div>
        <label>DIVISAS $</label>
        <input type="number" id="inUSD" value="0">
        <label>PAGO MÓVIL BS</label>
        <input type="number" id="inPM" value="0">
        <button class="btn" id="btnOk">REGISTRAR PAGO</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const total = parseFloat(params.get('total'));
        const tasa = parseFloat(params.get('tasa'));

        document.getElementById('mUSD').innerText = `$ ${total.toFixed(2)}`;
        document.getElementById('mBS').innerText = `${(total * tasa).toFixed(2)} Bs.`;

        document.getElementById('btnOk').onclick = () => {
            window.opener.postMessage({ 
                action: 'VENTA_COMPLETADA', 
                pagos: { usd: document.getElementById('inUSD').value, pm: document.getElementById('inPM').value } 
            }, "*");
            window.close();
        };
    </script>
</body>
</html>
