<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control P2P: Lógica de Inventario</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 0.85em; font-weight: bold; margin-top: 10px; }
        input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: #2563eb; color: white; }
        .res { margin-top: 25px; padding: 20px; background: #f0fdf4; border: 2px solid #22c55e; border-radius: 5px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Control P2P: Lógica de Flujo</h2>
        <div class="grid">
            <div>
                <h3>Inicio</h3>
                <input type="number" id="iUsdt" placeholder="USDT">
                <input type="number" id="iVzla" placeholder="Vzla">
                <input type="number" id="iBanesco" placeholder="Banesco">
                <input type="number" id="iTasa" placeholder="Tasa Compra">
            </div>
            <div>
                <h3>Cierre</h3>
                <input type="number" id="fUsdt" placeholder="USDT">
                <input type="number" id="fVzla" placeholder="Vzla">
                <input type="number" id="fBanesco" placeholder="Banesco">
                <input type="number" id="fTasa" placeholder="Tasa Venta">
            </div>
        </div>
        <button onclick="calcular()">Calcular Ganancia Real</button>
        <div class="res" id="res">
            <p><strong>Ganancia Real:</strong> <span id="resGanancia">0</span> VES</p>
        </div>
    </div>

    <script>
        function calcular() {
            const get = (id) => parseFloat(document.getElementById(id).value) || 0;
            
            const difUsdt = get('fUsdt') - get('iUsdt');
            const difBancos = (get('fVzla') + get('fBanesco')) - (get('iVzla') + get('iBanesco'));
            
            let ganancia;
            if (difUsdt < 0) {
                // Vendiste: Ganancia es la diferencia de bancos + (USDT vendidos * Tasa Venta)
                ganancia = difBancos + (Math.abs(difUsdt) * get('fTasa'));
            } else {
                // Compraste: Ganancia es la diferencia de bancos - (USDT comprados * Tasa Compra)
                ganancia = difBancos - (difUsdt * get('iTasa'));
            }

            document.getElementById('res').style.display = 'block';
            document.getElementById('resGanancia').innerText = ganancia.toLocaleString();
        }
    </script>
</body>
</html>
