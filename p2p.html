<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control P2P Profesional</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-size: 0.85em; font-weight: bold; margin-top: 10px; }
        input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-calc { background: #2563eb; color: white; }
        .btn-clear { background: #dc2626; color: white; margin-top: 10px; }
        .resultado { margin-top: 25px; padding: 20px; background: #f0fdf4; border: 2px solid #22c55e; border-radius: 5px; display: none; }
        .res-table { width: 100%; border-collapse: collapse; }
        .res-table td { padding: 8px; border: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Control P2P: Gestión de Bancos</h2>
        
        <div class="grid">
            <div>
                <h3>Inicio</h3>
                <label>USDT:</label> <input type="number" id="iUsdt" step="any">
                <label>Vzla (VES):</label> <input type="number" id="iVzla" step="any">
                <label>Banesco (VES):</label> <input type="number" id="iBanesco" step="any">
                <label>Tasa Compra:</label> <input type="number" id="iTasa" step="any">
            </div>
            <div>
                <h3>Cierre</h3>
                <label>USDT:</label> <input type="number" id="fUsdt" step="any">
                <label>Vzla (VES):</label> <input type="number" id="fVzla" step="any">
                <label>Banesco (VES):</label> <input type="number" id="fBanesco" step="any">
                <label>Tasa Venta:</label> <input type="number" id="fTasa" step="any">
            </div>
        </div>

        <button class="btn-calc" onclick="guardarYCalcular()">Calcular Ganancia Real</button>
        <button class="btn-clear" onclick="limpiarDatos()">Limpiar Todo</button>

        <div class="resultado" id="res">
            <h3>Resultado del Análisis</h3>
            <table class="res-table">
                <tr><td>Total Bancos Inicio:</td><td id="tIniBancos" style="text-align:right;">0</td></tr>
                <tr><td>Total Bancos Cierre:</td><td id="tFinBancos" style="text-align:right;">0</td></tr>
                <tr style="background:#e0f2f1;"><td><strong>Ganancia Neta (VES):</strong></td><td id="gananciaReal" style="text-align:right; font-weight:bold; color:green;">0</td></tr>
            </table>
        </div>
    </div>

    <script>
        const campos = ['iUsdt', 'iVzla', 'iBanesco', 'iTasa', 'fUsdt', 'fVzla', 'fBanesco', 'fTasa'];

        window.onload = () => {
            campos.forEach(id => {
                const val = localStorage.getItem(id);
                if (val) document.getElementById(id).value = val;
            });
        };

        function guardarYCalcular() {
            campos.forEach(id => localStorage.setItem(id, document.getElementById(id).value));
            
            const get = (id) => parseFloat(document.getElementById(id).value) || 0;

            // Sumas automáticas de bancos
            const totalIniBancos = get('iVzla') + get('iBanesco');
            const totalFinBancos = get('fVzla') + get('fBanesco');

            // Cálculo Patrimonio (USDT * Tasa + Bancos)
            const patIni = (get('iUsdt') * get('iTasa')) + totalIniBancos;
            const patFin = (get('fUsdt') * get('fTasa')) + totalFinBancos;

            const ganancia = patFin - patIni;

            document.getElementById('res').style.display = 'block';
            document.getElementById('tIniBancos').innerText = totalIniBancos.toLocaleString() + " VES";
            document.getElementById('tFinBancos').innerText = totalFinBancos.toLocaleString() + " VES";
            document.getElementById('gananciaReal').innerText = ganancia.toLocaleString() + " VES";
        }

        function limpiarDatos() {
            localStorage.clear();
            campos.forEach(id => document.getElementById(id).value = '');
            document.getElementById('res').style.display = 'none';
        }
    </script>
</body>
</html>
