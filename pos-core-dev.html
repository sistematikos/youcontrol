<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Devoluciones - You Control</title>
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body>

<div class="container" style="padding: 20px;">
    <div class="card shadow-sm mb-4" style="background: #fff; padding: 20px; border-radius: 10px; border-top: 4px solid #28a745;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h2 style="margin: 0;">🔄 Módulo de Devoluciones</h2>
                <p style="color: #666; margin: 5px 0 0 0;">Gestión de notas de crédito y reintegro de inventario</p>
            </div>
            <a href="index.html" class="btn btn-secondary">← Volver al POS</a>
        </div>
    </div>

    <div class="card shadow-sm" style="background: #fff; padding: 20px; border-radius: 10px;">
        <div class="input-group" style="display: flex; gap: 10px;">
            <input type="text" id="busqueda-factura" class="form-control" placeholder="Escriba el número de factura..." style="padding: 12px; border: 1px solid #ddd; border-radius: 5px; flex: 1;">
            <button onclick="buscarFacturaParaDevolver()" class="btn btn-primary" style="padding: 10px 20px;">Buscar Factura</button>
        </div>

        <div id="resultado-busqueda" style="margin-top: 25px; display: none;">
            <hr>
            <h4>Productos de la Factura: <span id="nro-factura-display" style="color: #28a745;"></span></h4>
            <div id="lista-productos-dev" style="margin: 15px 0;">
                </div>
            <textarea id="motivo-devolucion" class="form-control" placeholder="Motivo de la devolución..." style="width: 100%; height: 80px; padding: 10px;"></textarea>
            
            <button id="btn-confirmar-dev" onclick="ejecutarProcesoDev()" class="btn-success" style="width: 100%; margin-top: 20px; padding: 15px; font-weight: bold;">
                CONFIRMAR Y REINGRESAR AL STOCK
            </button>
        </div>
    </div>
</div>

<script type="module" src="js/controlador-dev.js"></script>
</body>
</html>
