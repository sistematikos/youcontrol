<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Devoluciones - You Control</title>
    <link rel="stylesheet" href="css/style.css"> 
</head>
<body>

    <div class="container" style="max-width: 800px; margin: auto; padding: 20px;">
        <div class="header">
            <h1>🔄 Módulo de Devoluciones</h1>
            <a href="index.html">← Volver al POS</a>
        </div>

        <div class="card" style="padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <h3>Buscar Factura Original</h3>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="busqueda-factura" placeholder="Nro de Factura o ID..." style="flex: 1; padding: 10px;">
                <button onclick="buscarFacturaParaDevolver()" class="btn-primary">Buscar</button>
            </div>
        </div>

        <div id="resultado-busqueda" style="margin-top: 20px; display: none;">
            <div class="card" style="padding: 20px;">
                <h4>Productos de la Factura: <span id="nro-factura-display"></span></h4>
                <div id="lista-productos-dev">
                    </div>
                <textarea id="motivo-devolucion" placeholder="Motivo de la devolución..." style="width: 100%; margin-top: 15px;"></textarea>
                
                <button id="btn-confirmar-dev" onclick="ejecutarProcesoDev()" class="btn-success" style="margin-top: 15px; width: 100%; padding: 15px;">
                    Procesar Devolución y Reingresar Stock
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/controlador-dev.js"></script>
</body>
</html>
