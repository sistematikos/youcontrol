<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital | You Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Estilos específicos para el Catálogo */
        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .producto-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0, 123, 255, 0.1);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .producto-card:hover {
            transform: translateY(-10px);
            border-color: var(--electric);
        }

        .precio-bs {
            font-size: 24px;
            font-weight: 800;
            color: var(--success);
            margin: 10px 0;
        }

        .precio-usd {
            font-size: 18px;
            color: var(--text);
            font-weight: 600;
        }

        .btn-whatsapp {
            background-color: #25D366 !important;
            color: white !important;
            margin-top: 15px;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3) !important;
        }
    </style>
</head>
<body>

    <header class="header-app">
        <h1><i class="fas fa-shopping-bag"></i> NUESTRO CATÁLOGO</h1>
        <div id="tasa-badge" style="background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 30px; font-size: 14px;">
            Tasa: <span id="tasa-cliente">0.00</span> Bs.
        </div>
    </header>

    <main class="container">
        <div class="input-group">
            <i class="fas fa-search"></i>
            <input type="text" id="busqueda-cliente" placeholder="¿Qué estás buscando hoy?">
        </div>

        <div class="catalogo-grid" id="catalogo-productos">
            </div>
    </main>

    <footer style="text-align: center; padding: 40px; color: var(--text); font-size: 14px;">
        <p>Desarrollado por <strong>Sistematikos - Frank Hernandez</strong></p>
    </footer>

    <script type="module" src="js/catalogo.js"></script>
</body>
</html>
