<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | You Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Estilos para la selección de productos */
        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .producto-card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }

        /* Cuando el producto está seleccionado */
        .producto-card.seleccionado {
            border-color: var(--electric);
            background-color: rgba(0, 123, 255, 0.03);
            transform: translateY(-5px);
        }

        .check-container {
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .check-container input {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: var(--electric);
        }

        /* Botón Flotante de WhatsApp */
        #btn-flotante-pedido {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            z-index: 1000;
            display: none; /* Se activa con JS */
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { bottom: -100px; opacity: 0; }
            to { bottom: 25px; opacity: 1; }
        }
    </style>
</head>
<body oncontextmenu="return false">

    <header class="header-app">
        <h1><i class="fas fa-store"></i> NUESTRO CATÁLOGO</h1>
        <div style="background: rgba(255,255,255,0.15); padding: 6px 15px; border-radius: 30px; font-size: 14px; font-weight: 700;">
            Tasa: <span id="tasa-cliente">0.00</span> Bs.
        </div>
    </header>

    <main class="container" style="padding-bottom: 120px;">
        <div class="input-group">
            <i class="fas fa-search"></i>
            <input type="text" id="busqueda-cliente" placeholder="¿Qué deseas llevar hoy?">
        </div>

        <div class="catalogo-grid" id="catalogo-productos">
            </div>
    </main>

    <div id="btn-flotante-pedido">
        <button onclick="enviarPedidoWhatsApp()" class="btn-primary" style="width: 100%; background: #25D366 !important; height: 65px; border-radius: 50px; font-size: 16px; border: none; box-shadow: 0 15px 35px rgba(37, 211, 102, 0.4) !important;">
            <i class="fab fa-whatsapp" style="font-size: 24px;"></i> 
            CONFIRMAR PEDIDO (<span id="cuenta-productos">0</span>)
        </button>
    </div>

    <script type="module" src="js/catalogo.js"></script>
</body>
</html>
